<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PCA 正式溫習</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#22282b;--mute:#626b70;--line:#dfdcd3;--accent:#0f6b63;--accent-ink:#fff;--soft:#e4f0ee;--ok:#1b7a43;--ok-bg:#e5f4ea;--bad:#b3362b;--bad-bg:#fbe9e6;--warn:#8a5a00;--warn-bg:#fbf0d9}
@media (prefers-color-scheme:dark){:root{--bg:#15191b;--card:#1f2528;--ink:#e9ecec;--mute:#a2acb0;--line:#343c40;--accent:#5cc4b8;--accent-ink:#08201d;--soft:#1f3633;--ok:#6fd398;--ok-bg:#17301f;--bad:#f39186;--bad-bg:#3a1f1b;--warn:#e8bf73;--warn-bg:#352a14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;line-height:1.3;margin:4px 0 12px}
h2{font-size:1.08rem;margin:20px 0 8px}
h3{font-size:.85rem;color:var(--mute);font-weight:600;margin:18px 0 8px}
p{margin:8px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.btn{display:block;width:100%;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;margin:10px 0}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{display:inline-block;width:auto;min-height:40px;padding:6px 12px;margin:4px 6px 4px 0;font-weight:500;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;min-height:52px}
.link small{color:var(--mute);white-space:nowrap}
.mute{color:var(--mute)}.sm{font-size:.86rem}
.tag{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:.8rem;margin:2px 0}
ul{padding-left:20px;margin:8px 0}li{margin:6px 0}
dl{margin:0}dt{font-weight:600;margin-top:10px}dd{margin:0;color:var(--ink)}dd .pg{color:var(--mute);font-size:.8rem;margin-left:6px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:128px;min-height:58px;border:0;background:none;font-size:.82rem;color:var(--mute);position:relative}
nav button b{display:block;font-size:1.25rem;font-weight:400;line-height:1.25}
nav button[aria-current=page]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:.66rem;min-width:17px;padding:0 4px;line-height:17px;font-weight:600}
.chip{display:inline-block;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin:4px 6px 4px 0;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt{display:flex;gap:10px;text-align:left;width:100%;min-height:52px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;align-items:flex-start}
.opt .l{font-weight:700;color:var(--mute);flex:none}
.opt:not(:disabled):active{background:var(--soft)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.why{display:block;font-size:.88rem;margin-top:5px;color:var(--mute)}
.opt.ok .why,.opt.bad .why{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}
.res{padding:12px 14px;border-radius:10px;margin:12px 0}.res.ok{background:var(--ok-bg)}.res.bad{background:var(--bad-bg)}
.res strong{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flag{background:none;border:0;color:var(--mute);font-size:.86rem;min-height:40px;padding:6px 0;text-decoration:underline}
.flag.on{color:var(--warn);font-weight:600}
textarea{width:100%;min-height:76px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fc{perspective:1000px;background:none;border:0;padding:0;width:100%;display:block;margin:12px 0}
.fc-in{display:block;position:relative;height:280px;transition:transform .35s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-radius:14px;border:1px solid var(--line);background:var(--card);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:1.25rem;text-align:center;overflow:auto}
.fc-f.b{transform:rotateY(180deg);background:var(--soft);font-size:1.06rem}
.fc-f small{color:var(--mute);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .btn{margin:0}
select{font:inherit;width:100%;min-height:46px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}.lv button{min-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);text-align:left;padding:8px 12px}.lv button[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}.lv small{display:block;font-weight:400;color:var(--mute);font-size:.8rem}
.exam{border-left:4px solid var(--warn)}
.pill{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:middle}
nav button{min-width:0;padding:0 2px}
.home{display:grid;gap:10px}.home button{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:76px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}.home b{font-size:1.8rem;font-weight:400;line-height:1}.home strong{display:block;font-size:1.08rem}.home small{display:block;color:var(--mute);font-size:.86rem}
.home b{flex:none;width:48px;height:48px;border-radius:12px;background:#0f6b63;display:grid;place-items:center}.home svg{width:28px;height:28px}
.home .hot{background:#b34a08;border-color:#b34a08;color:#fff;min-height:92px}.home .hot small{color:#fff}.home .hot b{background:#8a3704}
nav{background:#0f5a53;border-top:0}nav button,nav button[aria-current=page]{color:#fff}nav button b{height:26px}nav button[aria-current=page]{background:#093f3a;box-shadow:inset 0 3px #fff}nav button:focus-visible{outline-color:#fff;outline-offset:-4px}
.ff{display:block;margin:8px 0;min-width:0}.ff span{display:block;font-size:.82rem;color:var(--mute)}.ff input{width:100%;font:inherit;min-height:46px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);opacity:1}.ff input:focus{outline:3px solid var(--accent)}.ff input.ok{border-color:var(--ok);background:var(--ok-bg)}.ff input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:10px 0}.tw table{border-collapse:collapse;font-size:.78rem;line-height:1.35}.tw th,.tw td{border:1px solid var(--line);padding:5px 7px;white-space:nowrap;text-align:left;height:28px}.tw th{white-space:normal;font-weight:600}
summary{cursor:pointer;min-height:32px}
.score{font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1.2}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="主選單"></nav>
<script>
const Q=[{"id":"E001","level":"簡單","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p1","question":"根據馬思樓（Maslow）的理論，五個需要層次中最底層係邊一層？","options":["生理的需要","安全感的需要","自尊或自我價值的需要","自我實現的需要"],"answer":"A","explanation":{"correct":"金字塔由底至頂第一層係生理的需要。 教材原文：「由底至頂：生理的需要」","wrong":{"B":"安全感係第二層，喺生理需要之上。","C":"自尊或自我價值係第四層。","D":"自我實現係最頂層。"}}},{"id":"E002","level":"簡單","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p1","question":"水、空氣、食物、排泄、睡眠同痛的解除，屬於馬思樓邊一層需要？","options":["安全感的需要","相愛及被愛的需要","生理的需要","自我實現的需要"],"answer":"C","explanation":{"correct":"教材將水、空氣、食物、排泄、睡眠等列為生理的需要。 教材原文：「包括水、空氣、食物、排泄、性、睡眠、痛的解除等」","wrong":{"A":"安全感指身體、就業、家庭、健康等的安全。","B":"相愛及被愛指朋友、伴侶或家人的支持。","D":"自我實現要喺其他需要滿足之後先出現。"}}},{"id":"E003","level":"簡單","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p2","question":"Virginia Henderson 嘅理論共列出幾多項基本護理要素？","options":["5 項","14 項","6 項","4 項"],"answer":"B","explanation":{"correct":"Henderson（1966）列出 14 項基本護理要素。 教材原文：「共有 14 項基本護理的要素」","wrong":{"A":"5 個係馬思樓嘅需要層次數目。","C":"6 項係教材 D 部分嘅護理原則數目。","D":"護理目的第 1 點分 4 方面（生理、心理、社交、心靈），唔係 Henderson 嘅要素。"}}},{"id":"E004","level":"簡單","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p3","question":"護理過程五個步驟入面，第一步係乜？","options":["確立問題","計劃","評估","檢討"],"answer":"C","explanation":{"correct":"護理過程由評估開始，之後確立問題、計劃、執行、檢討，再返回評估。 教材原文：「評估 → 確立問題 → 計劃 → 執行 → 檢討」","wrong":{"A":"確立問題係第二步，要先有評估資料。","B":"計劃係第三步。","D":"檢討係最後一步，之後再返回評估。"}}},{"id":"E005","level":"簡單","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p4","question":"護理前「核對病人」，教材要求點做？","options":["清晰地詢問病人的姓名，耐心等待回應","直接讀出病人姓名，等病人點頭","只核對床頭牌，唔使問病人","請病人家屬代為說出姓名"],"answer":"A","explanation":{"correct":"教材要求清晰地詢問病人姓名，並耐心等待病人回應。 教材原文：「清晰地詢問病人的姓名，耐心等待回應」","wrong":{"B":"由職員讀出姓名再等點頭，唔係教材寫嘅方法。","C":"教材要求詢問病人，唔係只睇床頭牌。","D":"教材寫明係詢問病人本人。"}}},{"id":"E006","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"教材寫一般病人沐浴最適當嘅水溫係幾多？","options":["40°C","37°C–38°C","20°C–24°C","60°C"],"answer":"A","explanation":{"correct":"教材寫最適當水溫係 40°C。 教材原文：「最適當水溫：40°C」","wrong":{"B":"37°C–38°C 係高血壓或心臟病病人用嘅水溫。","C":"20°C–24°C 係嬰兒沐浴時嘅室溫。","D":"60°C 係疥瘡衣物清洗嘅水溫。"}}},{"id":"E007","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"有高血壓或心臟病嘅病人，沐浴水溫宜係幾多？","options":["37°C–38°C","40°C","42°C–44°C","20°C–24°C"],"answer":"A","explanation":{"correct":"教材寫高血壓或心臟病病人水溫宜為 37°C–38°C，比一般 40°C 低。 教材原文：「如病人有高血壓或心臟病，水溫宜為 37°C–38°C」","wrong":{"B":"40°C 係一般病人嘅水溫。","C":"教材冇建議更熱嘅水溫，水溫應該比一般低。","D":"20°C–24°C 係嬰兒沐浴嘅室溫。"}}},{"id":"E008","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"為病人淋浴開水喉時，正確次序係？","options":["先開熱水，後開冷水","先開冷水，後開熱水","冷熱水同時開","先開熱水，試好溫度先開冷水"],"answer":"B","explanation":{"correct":"教材寫手持花灑，先開冷水掣，後開熱水掣至水溫適中。 教材原文：「先開冷水掣，後開熱水掣」","wrong":{"A":"先開熱水有燙傷風險，次序相反。","C":"教材有指定先後次序。","D":"次序同教材相反。"}}},{"id":"E009","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p8","question":"床上浴（Bed Bath）適合邊類病人？","options":["清醒但行動不便的病人","危重病人","可以自行步行的病人","只需協助洗頭的病人"],"answer":"B","explanation":{"correct":"教材寫床上浴適合危重病人，減少不必要的轉身。 教材原文：「適合危重病人」","wrong":{"A":"清醒但行動不便適合淋浴。","C":"可步行病人唔需要床上浴。","D":"教材冇咁講。"}}},{"id":"E010","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"教材建議病人沐浴最佳時間係幾時？","options":["飯後即刻沐浴，趁身體溫暖","避開飯前／飯後的一小時","飯前半小時之內進行","排泄之前，以免沐浴時便急"],"answer":"B","explanation":{"correct":"最佳時間係避開飯前／飯後的一小時，或在排泄之後。 教材原文：「避開飯前／飯後的一小時；或在排泄之後」","wrong":{"A":"飯後即刻要避開。","C":"飯前一小時內都要避開。","D":"教材寫係排泄之後，唔係之前。"}}},{"id":"E011","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"淋浴（Shower Bath）適合邊類病人？","options":["危重的病人","昏迷的病人","清醒但行動不便的病人","剛做完全身麻醉手術的病人"],"answer":"C","explanation":{"correct":"教材寫淋浴又稱花灑浴，適合清醒但行動不便的病人。 教材原文：「適合清醒但行動不便的病人」","wrong":{"A":"危重病人適合床上浴。","B":"昏迷病人唔係清醒，唔符合。","D":"教材冇講術後病人適合淋浴。"}}},{"id":"E012","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p5","question":"以下邊一項係教材列出「缺乏個人衞生」會引起嘅問題？","options":["夜盲症","腳氣病","白內障","壓瘡"],"answer":"D","explanation":{"correct":"缺乏個人衞生可引起感染、壓瘡、潰瘍、體臭、影響自尊心等。 教材原文：「缺乏個人衞生引起的問題：a. 感染 b. 壓瘡」","wrong":{"A":"夜盲症係缺乏維他命 A。","B":"腳氣病係缺乏維他命 B1。","C":"白內障係晶狀體變混濁。"}}},{"id":"E013","level":"簡單","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p6","question":"如病人使用電鬚刨，剃鬚前應先做乜？","options":["用熱毛巾敷面五分鐘","檢查電鬚刨是否清潔","先為病人塗上鬚後水","由護理人員代病人剃"],"answer":"B","explanation":{"correct":"教材寫先檢查電鬚刨是否清潔，再讓病人自行剃鬚。 教材原文：「先檢查電鬚刨是否清潔」","wrong":{"A":"教材冇提熱敷。","C":"鬚後水係護理用品之一，唔係剃前步驟。","D":"教材寫先讓病人自行剃鬚，有需要先協助。"}}},{"id":"E014","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p14","question":"頭蝨主要經乜途徑傳播？","options":["與患者直接毛髮接觸","共用帽子或梳子","空氣中的飛沫","共用餐具"],"answer":"A","explanation":{"correct":"教材寫頭蝨主要經由患者與他人之間的直接毛髮接觸傳播。 教材原文：「主要經由患者與他人之間的直接毛髮接觸」","wrong":{"B":"教材寫共用帽子、梳子而受傳染較為罕見。","C":"教材冇提飛沫。","D":"教材冇提餐具。"}}},{"id":"E015","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p14","question":"頭蝨患者多數係邊類人？","options":["獨居長者","長期臥床病人","醫護人員","幼兒和學前小童"],"answer":"D","explanation":{"correct":"教材寫患者多為幼兒和學前小童，因為玩耍時經常有緊密接觸。 教材原文：「患者多為幼兒和學前小童」","wrong":{"A":"教材冇咁講。","B":"教材冇咁講。","C":"教材冇咁講。"}}},{"id":"E016","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p14","question":"頭蝨卵大約幾多日內孵化？","options":["7 至 13 日","28 至 30 日","7 至 10 日","大概兩天"],"answer":"C","explanation":{"correct":"教材寫卵會在 7 至 10 日內孵化。 教材原文：「卵會在 7 至 10 日內孵化」","wrong":{"A":"7 至 13 日係由蛹至成蟲。","B":"28 至 30 日係成蟲壽命。","D":"兩天係成蟲離開人體後存活時間。"}}},{"id":"E017","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p14","question":"床上洗頭時，用棉花球做乜？","options":["清潔病人眼睛","塗洗髮液落頭皮","吸乾頭髮水份","堵塞外耳道以防入水"],"answer":"D","explanation":{"correct":"教材寫用棉花球堵塞病人外耳道以防入水。 教材原文：「用棉花球堵塞病人外耳道以防入水」","wrong":{"A":"教材冇咁用。","B":"洗髮液用手塗抹。","C":"抹乾用大毛巾及風筒。"}}},{"id":"E018","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p14","question":"頭蝨成蟲離開人體之後，大約幾耐會死亡？","options":["7 至 10 日","28 至 30 日","大概兩天","12 小時"],"answer":"C","explanation":{"correct":"教材寫成蟲離開人體大概兩天便會死亡。 教材原文：「當它們離開人體大概兩天便會死亡」","wrong":{"A":"7 至 10 日係卵孵化時間。","B":"28 至 30 日係成蟲一般壽命。","D":"12 小時係除蝨藥塗後沖洗時間。"}}},{"id":"E019","level":"簡單","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p15","question":"檢查頭蝨時發現頭蝨狀物體，應點處理？","options":["用棉花球醮適量火酒抹去","戴手套後直接用手指捏走","用大量清水將佢沖走","用風筒熱風將佢吹走"],"answer":"A","explanation":{"correct":"教材寫若發現頭蝨狀物體，用棉花球醮適量火酒抹去。 教材原文：「用棉花球醮適量火酒抹去」","wrong":{"B":"教材冇咁寫，而且要戴手套。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E020","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"邊類病人嘅口腔護理要由護士負責？","options":["用口呼吸但精神清醒嘅病人","用人工呼吸機或 Bipap 的病人","有假牙但可以自己清潔假牙嘅病人","剛剛食完飯、想漱口嘅長者"],"answer":"B","explanation":{"correct":"教材寫所有使用人工呼吸機、Bipap 呼吸機的病人要由護士負責口腔護理。 教材原文：「所有使用人工呼吸機、Bipap 呼吸機的病人要由護士負責口腔護理」","wrong":{"A":"用口呼吸者係特別需要口腔護理，但冇講要由護士負責。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E021","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"每支口腔清潔專用棉棒可以抹幾多次？","options":["只可抹拭一次","可抹兩次，之後要換","同一位置可重覆使用","沾濕之後可以一直用"],"answer":"A","explanation":{"correct":"教材寫每支口腔清潔專用棉棒只可抹拭一次，不可重覆使用。 教材原文：「每支口腔清潔專用棉棒只可抹拭一次，不可重覆使用」","wrong":{"B":"教材寫只可抹一次。","C":"教材寫不可重覆使用。","D":"教材寫不可重覆使用。"}}},{"id":"E022","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"為病人清潔口腔之後，喺咀唇塗乜？","options":["鋅氧膏","甘油或潤唇膏","生理鹽水","潤膚膏"],"answer":"B","explanation":{"correct":"教材寫清洗後在咀唇塗上甘油或潤唇膏，以保濕潤。 教材原文：「清洗後，在咀唇塗上甘油或潤唇膏」","wrong":{"A":"鋅氧膏係塗皮膚有紅嘅位置。","C":"生理鹽水係用嚟清潔口腔。","D":"潤膚膏係塗身體皮膚。"}}},{"id":"E023","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p19","question":"病人睡覺前，假牙應該點處理？","options":["戴住假牙睡覺","浸喺熱水入面","自行調整至舒服形狀","一定要除去假牙"],"answer":"D","explanation":{"correct":"教材注意事項寫病人睡覺前一定要除去假牙。 教材原文：「病人睡覺前一定要除去假牙」","wrong":{"A":"教材要求睡前除去。","B":"教材寫不要用熱水浸假牙。","C":"教材寫不要自行調整假牙形狀。"}}},{"id":"E024","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p17","question":"教材建議病人用邊種牙刷？","options":["較硬的牙刷","較軟性的牙刷","電動牙刷","唔使用牙刷，只漱口"],"answer":"B","explanation":{"correct":"教材口腔護理第一點係使用較軟性的牙刷。 教材原文：「使用較軟性的牙刷」","wrong":{"A":"教材寫較軟性。","C":"教材冇提電動牙刷。","D":"教材有寫要清潔牙齒，唔係只漱口。"}}},{"id":"E025","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p19","question":"清洗假牙應該用乜浸？","options":["熱水，以達到消毒效果","清水，內可加入牙粉","稀釋漂白水，浸 30 分鐘","酒精，浸完再用清水沖"],"answer":"B","explanation":{"correct":"教材寫把假牙放入一碗或一杯清水內（內可加入牙粉），並寫不要用熱水浸。 教材原文：「把假牙放入一碗或一杯清水內（內可加入牙粉）」","wrong":{"A":"教材寫不要用熱水浸假牙。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E026","level":"簡單","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"以下邊一位病人屬於教材所講「特別需要口腔護理」？","options":["食慾良好的病人","可以自行刷牙的病人","剛剛完成沐浴的病人","用口呼吸的病人"],"answer":"D","explanation":{"correct":"特別需要口腔護理嘅病人包括失去知覺、厭食、用口呼吸、不可用口進食、管道餵飼、脫水、不能自助等。 教材原文：「用口呼吸者」","wrong":{"A":"教材列嘅係厭食者，唔係食慾好。","B":"教材列嘅係不能自助者。","C":"教材冇咁寫。"}}},{"id":"E027","level":"簡單","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p24","question":"以下邊類病人係教材列出需要手足護理？","options":["糖尿病患者","剛剛完成洗頭的病人","可以自行步行的病人","輕微傷風的病人"],"answer":"A","explanation":{"correct":"需要手足護理：營養不良、關節炎、糖尿病、不能自助、昏迷病人。 教材原文：「糖尿病患者」","wrong":{"B":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E028","level":"簡單","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"做完髖關節成形術（AMA）或全髖關節置換（THR）嘅病人，要用邊種便盆？","options":["普通便盆","便椅","便壺","扁身便盆"],"answer":"D","explanation":{"correct":"教材寫為防髖關節脫位，要特別使用扁身便盆。 教材原文：「為防髖關節脫位，要特別使用扁身便盆」","wrong":{"A":"教材特別指出要用扁身便盆，唔係普通便盆。","B":"教材講嘅係便盆種類。","C":"便壺係收集小便用。"}}},{"id":"E029","level":"簡單","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"點解唔可以讓病人使用便盆太耐？","options":["以免病人著涼","以免引起壓瘡","以免便盆破裂","以免大便變硬"],"answer":"B","explanation":{"correct":"教材寫不可讓病人使用便盆過久，以免引起壓瘡情況。 教材原文：「不可讓病人使用便盆過久，以免引起壓瘡情況」","wrong":{"A":"教材講嘅原因係壓瘡。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E030","level":"簡單","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p24","question":"為病人清潔手足時，要特別注意抹乾邊度？","options":["手背","腳底","手腕","趾隙"],"answer":"D","explanation":{"correct":"教材程序寫清潔病人手足，注意抹乾趾隙。 教材原文：「注意抹乾趾隙」","wrong":{"A":"教材特別提嘅係趾隙。","B":"教材特別提嘅係趾隙。","C":"教材特別提嘅係趾隙。"}}},{"id":"E031","level":"簡單","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p25","question":"用便椅之前，第一步要確保乜？","options":["病床及便椅已上鎖固定","病人已經穿好外套","便椅已經放好廁紙","病人已經飲咗水"],"answer":"A","explanation":{"correct":"教材便椅程序第一步：確保病床及便椅已上鎖固定。 教材原文：「確保病床及便椅已上鎖固定」","wrong":{"B":"穿保暖衣物喺第二步。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E032","level":"簡單","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p28","question":"清潔失禁病人臀部時，濕棉花塊應該點抹？","options":["由後抹向前，每塊只抹一次","來回抹至乾淨為止","同一塊抹兩次再換","由肛門抹向後，每塊只抹一次"],"answer":"D","explanation":{"correct":"教材寫清理臀部時由肛門抹向後，每次濕棉花塊只可抹一次，避免把便溺帶往尿道。 教材原文：「由肛門抹向後，每次濕棉花塊只可抹一次」","wrong":{"A":"方向相反，會將便溺帶往尿道。","B":"教材寫不可回抹。","C":"教材寫每塊只抹一次。"}}},{"id":"E033","level":"簡單","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p28","question":"為偏癱病人除褲，正確次序係？","options":["先除患側，再除健側","先除健側，再除患側","兩邊同時除","由病人自己除"],"answer":"B","explanation":{"correct":"教材寫協助病人除褲先除健側，再除患側。 教材原文：「先除健側，再除患側」","wrong":{"A":"次序相反。","C":"教材有指定次序。","D":"教材寫由護理人員協助。"}}},{"id":"E034","level":"簡單","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p27","question":"小便失禁係指乜？","options":["每日小便少過三次","小便時感到疼痛","小便顏色變深","無法用意志去控制排尿"],"answer":"D","explanation":{"correct":"教材定義：小便失禁是指無法用意志去控制排尿，尿液不由自主地從尿道流出。 教材原文：「小便失禁是指無法用意志去控制排尿」","wrong":{"A":"教材冇咁定義。","B":"小便疼痛係另一問題。","C":"顏色同失禁定義無關。"}}},{"id":"E035","level":"簡單","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p29","question":"教材建議點樣安排飲水去預防小便失禁？","options":["白天充分飲水，晚上減量","白天少飲，晚上多飲","全日都盡量少飲水","只喺食飯時飲水"],"answer":"A","explanation":{"correct":"預防小便失禁措施之一係白天充分飲水，晚上減量。 教材原文：「白天充分飲水，晚上減量」","wrong":{"B":"次序相反。","C":"教材冇叫全日少飲。","D":"教材冇咁寫。"}}},{"id":"E036","level":"簡單","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p27","question":"以下邊項係教材列出失禁護理嘅目標？","options":["增加病人飲水量","減少更換床單次數","令病人減少如廁","預防壓瘡形成"],"answer":"D","explanation":{"correct":"護理目標：保持皮膚乾爽清潔、防皮膚破損、預防壓瘡、預防尿道感染、令病人舒適。 教材原文：「預防壓瘡形成」","wrong":{"A":"教材冇列為目標。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"E037","level":"簡單","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p36","question":"正常造口嘅顏色係？","options":["鮮紅色","藍色","黑色","灰白色"],"answer":"A","explanation":{"correct":"教材寫造口呈鮮紅色，有如咀唇內部的顏色。 教材原文：「呈鮮紅色」","wrong":{"B":"轉藍色要立即通知醫生。","C":"轉黑色要立即通知醫生。","D":"教材冇咁寫。"}}},{"id":"E038","level":"簡單","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p38","question":"造口俗稱乜？","options":["假牙","假肛","尿套","人工氣道"],"answer":"B","explanation":{"correct":"教材寫造口俗稱「假肛」。 教材原文：「俗稱「假肛」」","wrong":{"A":"假牙係牙齒用。","C":"尿套（Paul's Tube）係收集小便。","D":"口咽人工氣道係保持氣道暢通。"}}},{"id":"E039","level":"簡單","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p36","question":"迴腸造口嘅開口通常喺邊？","options":["病人腹部左邊","肚臍正中","病人腹部右邊","背部"],"answer":"C","explanation":{"correct":"教材寫迴腸造口開口處通常在病人腹部右邊。 教材原文：「開口處通常在病人腹部右邊」","wrong":{"A":"左邊係降結腸或乙狀結腸造口。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E040","level":"簡單","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"造口顏色轉咗藍色或黑色，應點做？","options":["等一兩日再觀察","應立即通知醫生","用消毒藥水清洗","換一個更大的造口袋"],"answer":"B","explanation":{"correct":"教材寫若造口顏色轉了藍色或黑色，應立即通知醫生。 教材原文：「若造口顏色轉了藍色或黑色，應立即通知醫生」","wrong":{"A":"教材要求立即通知。","C":"教材寫切勿用消毒藥水。","D":"教材冇咁寫。"}}},{"id":"E041","level":"簡單","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p40","question":"造口用品入面，「碳片」嘅作用係乜？","options":["填平有摺痕的皮膚","吸去腸道排出的氣體","穩固造口袋","用於有損傷的皮膚"],"answer":"B","explanation":{"correct":"教材寫碳片：吸去腸道排出的氣體。 教材原文：「碳片：吸去腸道排出的氣體」","wrong":{"A":"填平皮膚係防漏膏。","C":"穩固造口袋係造口袋腰帶。","D":"有損傷皮膚用護膚粉。"}}},{"id":"E042","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p42","question":"尿套（Paul's Tube）適用於邊類病人？","options":["小便失禁之女病人","急性尿瀦留病人","剛做完婦科手術的病人","小便失禁或滴漏之男病人"],"answer":"D","explanation":{"correct":"教材寫尿套對象係患小便失禁或滴漏之男病人。 教材原文：「對象：患小便失禁或滴漏之男病人」","wrong":{"A":"尿套係套落陰莖，對象係男病人。","B":"急性尿瀦留係用導尿管排空膀胱。","C":"婦科手術前後係用導尿管。"}}},{"id":"E043","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p42","question":"尿袋應該放喺邊個位置？","options":["高於病人的膀胱水平","同膀胱一樣高","放喺病人肚上","低於病人的膀胱水平"],"answer":"D","explanation":{"correct":"教材寫尿袋應放置於低於病人的膀胱水平，以防尿液倒流。 教材原文：「尿袋應放置於低於病人的膀胱水平，以防尿液倒流」","wrong":{"A":"高於膀胱會令尿液倒流。","B":"教材要求低於膀胱。","C":"教材要求低於膀胱。"}}},{"id":"E044","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p42","question":"尿袋要幾時清倒一次？","options":["每八小時或注滿一半","每日一次","注滿全袋先倒","每四小時或注滿三分二"],"answer":"D","explanation":{"correct":"教材寫每四小時或注滿尿袋三分二的水平清倒一次。 教材原文：「每四小時或注滿尿袋三分二的水平清倒尿袋一次」","wrong":{"A":"教材寫四小時或三分二。","B":"教材寫四小時或三分二。","C":"滿袋會令尿液回流。"}}},{"id":"E045","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p44","question":"有導尿管嘅病人，如冇其他疾病影響，每日應鼓勵飲幾多水？","options":["1500–2000 毫升","500–800 毫升","少於 1000 毫升","3000 毫升以上"],"answer":"A","explanation":{"correct":"教材寫如無其他疾病影響，鼓勵病人多進水份，每日 1500–2000 毫升。 教材原文：「每日 1500–2000 毫升」","wrong":{"B":"500–800 毫升係迴腸造口回復進食後嘅每日輸出量。","C":"限飲一公升係腎病、心臟病病人。","D":"教材冇咁寫。"}}},{"id":"E046","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p44","question":"教材寫每日用乜清潔導尿病人嘅尿道口？","options":["1:49 稀釋的漂白水","70% 酒精（火酒）","鋅氧膏（Zinc Oxide）","希必定（Hibitane）"],"answer":"D","explanation":{"correct":"教材寫每日替病人用希必定（Hibitane）清潔尿道口及附近皮膚。 教材原文：「每日替病人用希必定（Hibitane）清潔尿道口及附近皮膚」","wrong":{"A":"漂白水係用嚟浸物品。","B":"酒精係用嚟抹尿袋出口。","C":"鋅氧膏係塗皮膚有紅嘅位置。"}}},{"id":"E047","level":"簡單","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p43","question":"導尿病人每小時排尿量少過幾多要向護士報告？","options":["100c.c","300c.c","500c.c","30c.c"],"answer":"D","explanation":{"correct":"教材寫每小時排出量 < 30c.c 要向護士報告。 教材原文：「每小時排出量 < 30c.c」","wrong":{"A":"教材寫 30c.c。","B":"教材寫 30c.c。","C":"教材寫 30c.c。"}}},{"id":"E048","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p47","question":"缺乏維他命 A 會引致乜？","options":["夜盲症","腳氣病","壞血病","佝僂病"],"answer":"A","explanation":{"correct":"教材表格：Vitamin A 缺乏時夜盲症、眼球乾燥、皮膚乾燥。 教材原文：「夜盲症；眼球乾燥」","wrong":{"B":"腳氣病係缺乏 B1。","C":"壞血病同維他命 C 有關。","D":"佝僂病係缺乏維他命 D。"}}},{"id":"E049","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p48","question":"邊種維他命有凝血作用？","options":["維他命 K","維他命 A","維他命 B1","維他命 D"],"answer":"A","explanation":{"correct":"教材表格：Vitamin K 功能係凝血作用。 教材原文：「凝血作用」","wrong":{"B":"A 係視力及黏膜。","C":"B1 係神經系統及心臟。","D":"D 係骨骼及吸收鈣質。"}}},{"id":"E050","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p49","question":"缺乏邊種礦物質會令甲狀腺腫大？","options":["鐵","鈣","碘","鋅"],"answer":"C","explanation":{"correct":"教材表格：Iodine 碘缺乏時甲狀腺腫大、智力及發育遲緩。 教材原文：「甲狀腺腫大」","wrong":{"A":"缺鐵會貧血。","B":"缺鈣會骨質疏鬆等。","D":"缺鋅會降低味覺及免疫。"}}},{"id":"E051","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p50","question":"人體水分大約佔體重幾多？","options":["百分之五十","百分之九十五","百分之七十五","百分之二十五"],"answer":"C","explanation":{"correct":"教材寫人體水分約是體重的百分之七十五。 教材原文：「人體水分約是體重的百分之七十五」","wrong":{"A":"教材寫 75%。","B":"95% 係脂肪以三酸甘油脂形式出現嘅比例。","D":"教材寫 75%。"}}},{"id":"E052","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p46","question":"碳水化合物嘅主要功能係乜？","options":["修補細胞及製造激素","保溫及保護內臟","為人體細胞提供能量","維持甲狀腺功能"],"answer":"C","explanation":{"correct":"教材寫碳水化合物功能係為人體細胞提供能量。 教材原文：「功能：為人體細胞提供能量」","wrong":{"A":"修補細胞及製造激素係蛋白質。","B":"保溫保護係脂肪。","D":"甲狀腺係碘。"}}},{"id":"E053","level":"簡單","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p49","question":"以下邊項係教材列出纖維素嘅功能？","options":["預防及紓緩便秘","製造紅血球","維持心律正常","幫助吸收鈣質"],"answer":"A","explanation":{"correct":"纖維素功能包括預防便秘、預防大腸癌、控制體重、穩定血糖、降低膽固醇。 教材原文：「預防及紓緩便秘」","wrong":{"B":"製造紅血球係 B6、B12、葉酸等。","C":"維持心律係鉀。","D":"幫助吸收鈣質係維他命 D。"}}},{"id":"E054","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p51","question":"「日日二加三」係指每天最少食乜？","options":["兩份蔬菜及三份水果","兩碗飯及三份蔬菜","兩份水果及三份蔬菜","兩杯奶及三份水果"],"answer":"C","explanation":{"correct":"教材寫每天應進食最少兩份水果及三份蔬菜。 教材原文：「每天應進食最少兩份水果及三份蔬菜」","wrong":{"A":"次序相反。","B":"教材講嘅係蔬果。","D":"教材講嘅係蔬果。"}}},{"id":"E055","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p52","question":"健康飲食金字塔入面，邊類食物應該「吃最多」？","options":["蔬菜及瓜類","瘦肉、魚類及蛋類","穀類、麵包、飯、粉及麵","脂肪、油、鹽、糖"],"answer":"C","explanation":{"correct":"金字塔底層「吃最多」係穀類、麵包、飯、粉及麵（3–5 碗）。 教材原文：「吃最多：穀類、麵包、飯、粉及麵 3–5 碗」","wrong":{"A":"蔬菜係「吃多些」。","B":"肉魚蛋係「吃適量」。","D":"油鹽糖係「吃最少」。"}}},{"id":"E056","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p52","question":"教材建議每天應該飲幾多杯流質飲品？","options":["2 至 3 杯","6 至 8 杯","10 至 12 杯","1 至 2 杯"],"answer":"B","explanation":{"correct":"教材註明每天應喝 6 至 8 杯流質飲品，如開水、清茶和清湯。 教材原文：「每天應喝 6 至 8 杯流質飲品」","wrong":{"A":"教材寫 6 至 8 杯。","C":"教材寫 6 至 8 杯。","D":"1–2 杯係金字塔奶類嘅建議。"}}},{"id":"E057","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p54","question":"低普林餐適合邊類病人？","options":["糖尿病病人","胃潰瘍病人","痛風症病人","營養不良病人"],"answer":"C","explanation":{"correct":"教材寫低普林餐適用於血尿酸值高、痛風症病人。 教材原文：「血尿酸值高，痛風症病人適用」","wrong":{"A":"糖尿病用糖尿餐。","B":"胃潰瘍用胃餐。","D":"營養不良用高卡路里高蛋白餐。"}}},{"id":"E058","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p57","question":"「N.P.O.」係乜意思？","options":["只飲流質","微量飲水","請多飲流質","不准飲食"],"answer":"D","explanation":{"correct":"教材寫 Nil By Mouth / Nil Per Oral（N.P.O）即不准飲食。 教材原文：「不准飲食 Nil By Mouth / Nil Per Oral（N.P.O）」","wrong":{"A":"只飲流質係 Fluid Diet。","B":"微量飲水係 Sips of Water。","C":"多飲流質係 Encourage Fluid Intake。"}}},{"id":"E059","level":"簡單","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p57","question":"抽空肚血糖之前，最少要禁食幾耐？","options":["十二小時","四小時","二十四小時","八小時"],"answer":"D","explanation":{"correct":"教材寫抽空肚血糖最少禁食八小時。 教材原文：「抽空肚血糖 Fasting Blood Sugar，最少禁食八小時」","wrong":{"A":"十二小時係抽空肚膽固醇。","B":"教材寫八小時。","C":"教材寫八小時。"}}},{"id":"E060","level":"簡單","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"餵食時每次份量應該係幾多？","options":["一湯匙","一茶匙","半碗","一大啖"],"answer":"B","explanation":{"correct":"教材寫每次應以一茶匙為準，待完全吞嚥後才繼續。 教材原文：「每次應以一茶匙為準」","wrong":{"A":"教材寫一茶匙。","C":"教材寫一茶匙。","D":"教材寫一茶匙。"}}},{"id":"E061","level":"簡單","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"餵食時可唔可以同病人傾偈？","options":["可以，令病人放鬆","可以，但要大聲講","不可，以防哽塞","可以講下食物嘅色香味"],"answer":"C","explanation":{"correct":"教材寫餵食時不可與病人交談，以防哽塞。 教材原文：「不可與病人交談，以防哽塞」","wrong":{"A":"教材寫不可交談。","B":"教材寫不可交談。","D":"以色香味為話題係鼓勵吞嚥困難病人進食嘅方法，但餵食當刻仍不可交談。"}}},{"id":"E062","level":"簡單","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"餵食時護理人員應該同病人保持點樣嘅位置？","options":["企喺病人後面","企高過病人","坐喺病人側後方","與病人同一高度"],"answer":"D","explanation":{"correct":"教材寫護理人員必須與病人同一高度，以便觀察病人吞嚥情況。 教材原文：「護理人員必須與病人同一高度」","wrong":{"A":"企後面觀察唔到吞嚥。","B":"教材要求同一高度。","C":"教材要求同一高度。"}}},{"id":"E063","level":"簡單","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"餵食之後，病人最少要端坐幾耐？","options":["半小時","五分鐘","兩小時","唔使坐，可即刻躺下"],"answer":"A","explanation":{"correct":"教材寫餵食後應讓患者端坐最少半小時，或把床頭調高不少於 60 度。 教材原文：「應讓患者端坐最少半小時」","wrong":{"B":"教材寫最少半小時。","C":"教材寫最少半小時。","D":"教材寫切勿立刻躺下。"}}},{"id":"E064","level":"簡單","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p58","question":"為不能自助病人餵食，第一口應該先畀乜？","options":["先給病人喝水","先餵飯","先餵湯","先餵水果"],"answer":"A","explanation":{"correct":"教材程序寫先給病人喝水，再慢慢餵食病人。 教材原文：「先給病人喝水，再慢慢餵食病人」","wrong":{"B":"教材寫先喝水。","C":"教材寫先喝水。","D":"教材寫先喝水。"}}},{"id":"E065","level":"簡單","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p65","question":"拆床單時應該注意乜？","options":["用力抖走碎屑","將床單放喺地上","將污床單放喺隔離床","不要抖動床單"],"answer":"D","explanation":{"correct":"教材寫拆床單時不要抖動床單，以免微生物散播。 教材原文：「拆床單時，不要抖動床單」","wrong":{"A":"教材寫不要抖動。","B":"教材寫不要放污穢床單在地上。","C":"教材寫不要放在其他病床。"}}},{"id":"E066","level":"簡單","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p65","question":"「備用床（Closed Bed）」係指？","options":["有病人佔用的床","沒有病人佔用的床","手術後應用床","病人請假回家的床"],"answer":"B","explanation":{"correct":"教材寫備用床：床冚蓋全床；沒有病人佔用。 教材原文：「沒有病人佔用」","wrong":{"A":"有病人佔用係應用床。","C":"手術後床屬於應用床。","D":"請假回家屬於應用床／暫空床。"}}},{"id":"E067","level":"簡單","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p64","question":"整理床鋪嘅目的之一係？","options":["可防褥瘡","增加病人飲水","方便量血壓","減少探病人數"],"answer":"A","explanation":{"correct":"教材列整理床鋪目的：整齊舒適、使新鮮空氣透入、可防褥瘡。 教材原文：「可防褥瘡」","wrong":{"B":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E068","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p70","question":"「G.A.」係指邊種麻醉？","options":["全身麻醉","局部麻醉","脊髓麻醉","硬脊膜外腔麻醉"],"answer":"A","explanation":{"correct":"教材寫全身（General Anaesthesia – G.A.）。 教材原文：「全身（General Anaesthesia – G.A.）」","wrong":{"B":"局部麻醉係 L.A.。","C":"脊髓麻醉係 S.A.。","D":"硬脊膜外腔麻醉係 E.A.。"}}},{"id":"E069","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"手術日，病人有飾物除唔到，應點處理？","options":["照戴入手術室","用剪刀剪斷","先用膠布包好","交俾家人保管手術袍"],"answer":"C","explanation":{"correct":"教材寫如飾物不能除下，應先用膠布包好。 教材原文：「如飾物不能除下，應先用膠布包好」","wrong":{"A":"教材要求先用膠布包好。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E070","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p72","question":"術後仍要禁食嘅病人話口渴，應點做？","options":["畀佢飲一小杯水","只可用棉花棒沾水濕口","畀佢飲少量果汁","叫佢忍住，唔好理"],"answer":"B","explanation":{"correct":"教材寫需要禁食的病人只可以用棉花棒沾水濕口。 教材原文：「只可以用棉花棒沾水濕口」","wrong":{"A":"禁食病人唔可以飲水。","C":"禁食病人唔可以飲果汁。","D":"教材建議用棉花棒沾水濕口。"}}},{"id":"E071","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"口咽人工氣道（Oropharyngeal Airway）有咩作用？","options":["收集口腔分泌物","幫助病人吞嚥食物","控制舌頭下墮，保持氣道暢通","撐開口部方便清潔牙齒"],"answer":"C","explanation":{"correct":"教材寫口咽人工氣道可用作控制舌頭免其下墮，以保持氣道暢通。 教材原文：「可用作控制舌頭免其下墮，以保持氣道暢通」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","D":"撐開口部係開口器（mouth gag）。"}}},{"id":"E072","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"手術前病人要學習「PCA」，即係乜？","options":["病人自控式止痛法","病人自行如廁","醫護支援人員","術前清潔腸道"],"answer":"A","explanation":{"correct":"教材寫學習深呼吸、咳嗽、放鬆、病人自控式止痛法（PCA – Patient Controlled Analgesia）。 教材原文：「病人自控式止痛法（PCA – Patient Controlled Analgesia）」","wrong":{"B":"教材冇咁寫。","C":"喺呢度 PCA 唔係指醫護支援人員。","D":"清潔腸道係飲瀉劑或灌腸劑。"}}},{"id":"E073","level":"簡單","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p70","question":"病人簽手術同意書之前，邊個要解釋手術風險同併發症？","options":["醫護支援人員","病房文員","家屬","醫生"],"answer":"D","explanation":{"correct":"教材寫給予病人簽署手術同意書前，醫生一定要給病人清楚解釋手術名稱、原因、過程、風險和併發症。 教材原文：「醫生一定要給病人清楚解釋手術的名稱、進行手術的原因、手術的過程、風險和後遺症／併發症等」","wrong":{"A":"教材寫醫生。","B":"教材寫醫生。","C":"教材寫醫生。"}}},{"id":"E074","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p73","question":"整理小兒床鋪，上層被蓋最高可以去到邊？","options":["可以蓋過頭部保暖","不可高過小兒肩膊","蓋到下巴","唔使蓋被"],"answer":"B","explanation":{"correct":"教材寫上層被蓋不可高過小兒肩膊，以免被床單覆蓋以致窒息。 教材原文：「上層被蓋不可高過小兒肩膊」","wrong":{"A":"會有窒息危險。","C":"教材寫不可高過肩膊。","D":"教材冇咁寫。"}}},{"id":"E075","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p75","question":"為嬰兒沐浴，室溫最好係幾多？","options":["37°C–40°C","10°C–15°C","20°C–24°C","30°C–35°C"],"answer":"C","explanation":{"correct":"教材寫室溫最好在 20°C–24°C。 教材原文：「室溫最好在 20°C–24°C」","wrong":{"A":"37°C–40°C 係嬰兒沐浴水溫。","B":"教材寫 20°C–24°C。","D":"教材寫 20°C–24°C。"}}},{"id":"E076","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p76","question":"為嬰兒清潔眼睛，方向係？","options":["從眼頭向眼尾","從眼尾向眼頭","打圈抹","上下來回抹"],"answer":"A","explanation":{"correct":"教材寫從眼頭向眼尾輕抹，每次用一個棉球。 教材原文：「從眼頭向眼尾輕抹，每次用一個棉球」","wrong":{"B":"方向相反。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E077","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p78","question":"瓶飼嬰兒時，奶咀流出速度以幾多為宜？","options":["每秒流出 1 滴","每秒流出 5 滴","成條線咁流","倒轉都唔會滴出"],"answer":"A","explanation":{"correct":"教材寫倒置奶瓶測試，通常以每秒流出 1 滴為宜。 教材原文：「通常以每秒流出 1 滴為宜」","wrong":{"B":"教材寫每秒 1 滴。","C":"教材寫每秒 1 滴。","D":"教材寫每秒 1 滴。"}}},{"id":"E078","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p77","question":"包嬰兒尿片時，臍帶應該點？","options":["要用尿片蓋住","要用臍布包紮","要外露","要洒臍粉"],"answer":"C","explanation":{"correct":"教材寫包尿片時臍帶要外露，保持清潔乾爽。 教材原文：「包尿片，臍帶要外露」","wrong":{"A":"教材寫外露。","B":"教材寫切忌用臍布包紮。","D":"教材寫切忌洒臍粉。"}}},{"id":"E079","level":"簡單","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p78","question":"餵完奶之後，應將嬰兒放成邊個姿勢？","options":["左側臥","俯臥","坐起","右側臥"],"answer":"D","explanation":{"correct":"教材寫將嬰兒放回床上，置右側臥。 教材原文：「置右側臥」","wrong":{"A":"教材寫右側臥。","B":"教材寫右側臥。","C":"教材寫放回床上右側臥。"}}},{"id":"E080","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p82","question":"白內障係指乜？","options":["眼壓升高令視神經受損","晶狀體逐漸變得混濁","視網膜脫落","淚管閉塞"],"answer":"B","explanation":{"correct":"教材寫眼睛內的晶狀體逐漸變得混濁，稱為白內障。 教材原文：「眼睛內的晶狀體逐漸變得混濁，稱為白內障」","wrong":{"A":"教材冇咁定義白內障。","C":"視網膜脫落係手術併發症之一。","D":"淚管閉塞係老化轉變。"}}},{"id":"E081","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p79","question":"長者突然眼痛、眼紅、視力急劇衰退，可能係乜？","options":["白內障","老花","青光眼","中耳炎"],"answer":"C","explanation":{"correct":"教材表格寫突然出現眼痛、眼紅及急劇視力衰退可能是青光眼。 教材原文：「可能是青光眼」","wrong":{"A":"白內障係視力衰退唔能用眼鏡糾正。","B":"老花係視力模糊，配眼鏡可改善。","D":"中耳炎係耳孔有分泌物。"}}},{"id":"E082","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p81","question":"長者記憶有咩轉變？","options":["長期記憶降低，短期記憶仍能保持","兩種記憶同時明顯消失","短期記憶降低，長期記憶仍能保持","記憶唔會有轉變"],"answer":"C","explanation":{"correct":"教材寫長者的短期記憶力會降低，但長期記憶仍能保持。 教材原文：「長者的短期記憶力會降低，但長期記憶仍能保持」","wrong":{"A":"次序相反。","B":"教材冇咁寫。","D":"教材寫會降低。"}}},{"id":"E083","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p82","question":"白內障主要嘅治療方法係？","options":["長期滴眼藥水控制","手術切除混濁晶狀體","配戴太陽眼鏡保護","服食維他命 A 補充"],"answer":"B","explanation":{"correct":"教材寫主要治療的方法是用手術切除已混濁的晶狀體；仍未有阻止白內障的有效藥物。 教材原文：「主要治療的方法是用手術切除已混濁的晶狀體」","wrong":{"A":"教材寫未有有效藥物。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E084","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p84","question":"長者最常受退化性關節炎影響嘅關節係？","options":["膝關節","手指關節","肩關節","頸椎"],"answer":"A","explanation":{"correct":"教材寫最常受影響的便是膝關節。 教材原文：「最常受影響的便是膝關節」","wrong":{"B":"教材寫膝關節。","C":"教材寫膝關節。","D":"教材寫膝關節。"}}},{"id":"E085","level":"簡單","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p81","question":"教材話長者最大嘅心理壓力來自乜？","options":["學習新科技","退休及親友相繼去世","搬屋","經濟狀況改善"],"answer":"B","explanation":{"correct":"教材寫退休及親友之相繼去世，乃是長者所要面對的最大心理壓力。 教材原文：「退休及親友之相繼去世，乃是長者所要面對的最大心理壓力」","wrong":{"A":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"E086","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p86","question":"柏金遜症平均病發年齡係？","options":["四十至五十歲","八十五歲以上","六十至七十歲","二十至三十歲"],"answer":"C","explanation":{"correct":"教材寫平均病發年齡在六十至七十歲之間。 教材原文：「平均病發年齡在六十至七十歲之間」","wrong":{"A":"教材寫 60 至 70 歲。","B":"85 歲以上係講認知障礙症比例。","D":"教材寫 60 至 70 歲。"}}},{"id":"E087","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p86","question":"柏金遜症同腦內邊種物質減少有關？","options":["胰島素","多巴胺","甲狀腺素","血紅蛋白"],"answer":"B","explanation":{"correct":"教材寫腦內部份神經系統功能受損，引致稱為多巴胺的神經傳導物質減少。 教材原文：「稱為多巴胺的神經傳導物質減少」","wrong":{"A":"教材冇咁寫。","C":"甲狀腺素同碘有關。","D":"血紅蛋白同鐵有關。"}}},{"id":"E088","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p90","question":"抑鬱症病徵要持續幾耐，先符合教材所講？","options":["兩日","兩星期或以上","兩個月以上","一年以上"],"answer":"B","explanation":{"correct":"教材寫病徵已持續兩星期或以上，並影響日常生活與處事能力。 教材原文：「已持續兩星期或以上」","wrong":{"A":"教材寫兩星期或以上。","C":"教材寫兩星期或以上。","D":"教材寫兩星期或以上。"}}},{"id":"E089","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p91","question":"最普遍嘅認知障礙症係邊種？","options":["多發性梗塞腦退化症","柏金遜症","阿爾茲海默氏痴呆症","抑鬱症"],"answer":"C","explanation":{"correct":"教材寫因腦部退化加速而引起的阿爾茲海默氏痴呆症是最普遍的認知障礙症。 教材原文：「阿爾茲海默氏痴呆症（Alzheimer's Disease）是最普遍的認知障礙症」","wrong":{"A":"多發性梗塞腦退化症由多次中風引起。","B":"柏金遜症唔係認知障礙症種類。","D":"抑鬱症唔係認知障礙症種類。"}}},{"id":"E090","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p94","question":"Zoloft（俗稱開心藥）屬於邊類藥？","options":["鎮靜藥","抗退化藥","止痛藥","抗抑鬱藥"],"answer":"D","explanation":{"correct":"教材寫抗抑鬱藥 – Zoloft（俗稱開心藥），可以減低患者憂鬱的心情。 教材原文：「抗抑鬱藥 – Zoloft（俗稱開心藥）」","wrong":{"A":"鎮靜藥係 Ativan。","B":"抗退化藥係 Tacrine、Aricept。","C":"教材冇咁寫。"}}},{"id":"E091","level":"簡單","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p89","question":"長期臥床嘅柏金遜症病人，最少幾耐要轉換姿勢？","options":["每六小時","每十二小時","每兩小時","每日一次"],"answer":"C","explanation":{"correct":"教材寫至少每兩小時替患者轉換姿勢，減低骨突處長期受壓。 教材原文：「至少每兩小時替患者轉換姿勢」","wrong":{"A":"教材寫每兩小時。","B":"教材寫每兩小時。","D":"教材寫每兩小時。"}}},{"id":"E092","level":"簡單","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p96","question":"嘔吐物呈咖啡渣樣（coffee ground），可能係乜？","options":["腸閉塞","胃液混和膽汁","食物中毒","腸胃出血"],"answer":"D","explanation":{"correct":"教材寫啡色／咖啡渣樣可能是腸胃出血（胃液與血液混和而成啡色）。 教材原文：「可能是腸胃出血」","wrong":{"A":"腸閉塞係有糞便味。","B":"黃綠色先係胃液混膽汁。","C":"教材冇以咖啡渣樣對應食物中毒。"}}},{"id":"E093","level":"簡單","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p96","question":"昏迷病人嘔吐，第一步應該點？","options":["將病人立即轉側臥","扶病人坐起","即刻餵水漱口","用枕頭墊高頭部"],"answer":"A","explanation":{"correct":"教材寫昏迷病人嘔吐，將病人立即轉側臥，以免吸入嘔吐物。 教材原文：「將病人立即轉側臥」","wrong":{"B":"扶坐起係清醒病人做法。","C":"昏迷病人唔可以餵水。","D":"教材寫立即轉側臥。"}}},{"id":"E094","level":"簡單","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p97","question":"睡眠需要量同年齡有咩關係？","options":["成正比","冇關係","成反比","只同性別有關"],"answer":"C","explanation":{"correct":"教材寫通常人類睡眠需要量與年齡成反比。 教材原文：「睡眠需要量與年齡成反比」","wrong":{"A":"教材寫成反比。","B":"教材寫有關。","D":"教材冇咁寫。"}}},{"id":"E095","level":"簡單","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p96","question":"嘔吐物有糞便味，教材話可能係乜？","options":["急性胃出血","腸閉塞","懷孕","舟車暈浪"],"answer":"B","explanation":{"correct":"教材寫糞便味可能是「腸閉塞」。 教材原文：「可能是「腸閉塞」」","wrong":{"A":"胃出血係鮮紅色或咖啡渣樣。","C":"懷孕係嘔吐原因之一，但冇講糞便味。","D":"舟車暈浪係嘔吐原因之一，但冇講糞便味。"}}},{"id":"E096","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p98","question":"否硫氏臥式（Fowler's）床頭要抬高幾多度？","options":["30 度","60 度","90 度","45 度"],"answer":"D","explanation":{"correct":"教材寫否硫氏臥式：床頭抬高 45 度。 教材原文：「否硫氏臥式：床頭抬高 45 度」","wrong":{"A":"30 度係半仰／半倚臥式。","B":"60 度係餵食後床頭最少調高嘅角度。","C":"90 度係端坐式。"}}},{"id":"E097","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p107","question":"協助病人上落樓梯，教材嘅口訣係？","options":["壞上，好落","好上，好落","好上，壞落","壞上，壞落"],"answer":"C","explanation":{"correct":"教材口訣：好上，壞落。上樓好腳先上，落樓弱腳先落。 教材原文：「口訣：好上，壞落」","wrong":{"A":"次序相反。","B":"落樓係弱腳先落。","D":"上樓係好腳先上。"}}},{"id":"E098","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p107","question":"病人用拐杖，應該用邊隻手拿？","options":["較弱那邊的手","慣用手，唔理強弱","兩隻手輪流拿","較強健那邊的手"],"answer":"D","explanation":{"correct":"教材寫使用方法：用較強健那邊的手持拐杖。 教材原文：「用較強健那邊的手持拐杖」","wrong":{"A":"教材寫強健那邊。","B":"教材寫強健那邊。","C":"教材寫強健那邊。"}}},{"id":"E099","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p101","question":"扶病人坐起身時，應該扶住邊度？","options":["頸部","肩膊","頭部","手臂"],"answer":"B","explanation":{"correct":"教材寫扶病人坐起身時，應扶著他的肩膊，而不是頸部。 教材原文：「扶病人坐起身時，應扶著他的肩膊，而不是頸部」","wrong":{"A":"教材寫唔係頸部。","C":"教材寫扶肩膊。","D":"教材寫扶肩膊。"}}},{"id":"E100","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p99","question":"端坐式嘅床頭要抬高幾多度？","options":["90 度","45 度","30 度","60 度"],"answer":"A","explanation":{"correct":"教材寫端坐式：床頭抬高 90 度，適用於呼吸困難及胸腔手術後病人。 教材原文：「端坐式：床頭抬高 90 度」","wrong":{"B":"45 度係否硫氏臥式。","C":"30 度係半仰臥式。","D":"60 度係餵食後床頭最少角度。"}}},{"id":"E101","level":"簡單","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p99","question":"兩位護理人員一齊搬病人，應該點樣同步發力？","options":["兩人各自數自己嘅口令再發力","由一人做司令員數「一、二、三」","唔使數口令，睇對方眼神就得","由病人數口令，兩人跟住發力"],"answer":"B","explanation":{"correct":"教材寫兩人搬運時其中一人為司令員，數口令「一、二、三」才一齊抬起病人。 教材原文：「其中一人為司令員，數口令「一、二、三」」","wrong":{"A":"教材寫由一人做司令員。","C":"教材要求數口令。","D":"教材寫由護理人員做司令員。"}}},{"id":"E102","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p110","question":"輪椅嘅「防反桿」有咩作用？","options":["防止輪椅向前衝","防止病人滑落","防止輪椅往後翻","方便摺埋輪椅"],"answer":"C","explanation":{"correct":"教材寫輪椅設有「防反桿」裝置，作用是防止輪椅往後翻。 教材原文：「作用是防止輪椅往後翻」","wrong":{"A":"教材寫往後翻。","B":"教材寫往後翻。","D":"教材冇咁寫。"}}},{"id":"E103","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p110","question":"推輪椅落斜坡，應該點推？","options":["用雙手推輪椅","用一隻手推","鬆手俾佢自己落","側住推"],"answer":"A","explanation":{"correct":"教材寫落斜坡時要用雙手來推輪椅，以免輪椅拐彎轉向一邊。 教材原文：「落斜坡時要用雙手來推輪椅」","wrong":{"B":"教材寫雙手。","C":"教材寫要緊握手柄。","D":"教材冇咁寫。"}}},{"id":"E104","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p115","question":"病人臥床使用約束物品，索帶應該綁喺邊？","options":["床欄上","床的兩邊","床尾板","病人手腕再綁去床頭"],"answer":"B","explanation":{"correct":"教材寫索帶綁在床的兩邊，勿繫在床欄上，因移動床欄會弄傷手部。 教材原文：「索帶綁在床的兩邊，勿繫在床欄上」","wrong":{"A":"教材寫勿繫在床欄上。","C":"教材寫床的兩邊。","D":"教材寫床的兩邊。"}}},{"id":"E105","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p115","question":"發生火警時，病人身上嘅約束物品應點？","options":["應迅速解除約束物品","保持約束，連床推走","等護士到先決定","綁得更緊以免走散"],"answer":"A","explanation":{"correct":"教材寫於火警及其他緊急情況下，應迅速解除約束物品。 教材原文：「於火警及其他緊急情況下，應迅速解除約束物品」","wrong":{"B":"教材寫迅速解除。","C":"教材寫迅速解除。","D":"教材寫迅速解除。"}}},{"id":"E106","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p109","question":"用滑動板協助病人過床，滑動板要放喺病人背後幾多？","options":["最少四分一","最少三分一","放喺腳下就得","最少一半"],"answer":"D","explanation":{"correct":"教材寫放下滑動板在病人背後最少一半，然後仰臥。 教材原文：「放下滑動板在病人背後最少一半」","wrong":{"A":"教材寫最少一半。","B":"教材寫最少一半。","C":"教材寫放喺背後。"}}},{"id":"E107","level":"簡單","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p114","question":"約束衣（安全背心）應採用邊種領口設計？","options":["V 領或低領","高領","圓領，愈貼頸愈好","樽領"],"answer":"A","explanation":{"correct":"教材寫採用 V 領或低領設計，以減低約束衣勒著頸部機會。 教材原文：「採用 V 領或低領設計」","wrong":{"B":"高領較易勒頸。","C":"貼頸較易勒頸。","D":"樽領較易勒頸。"}}},{"id":"E108","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p119","question":"「削力（Shearing Force）」係指乜？","options":["皮膚受潮變軟","壓力及磨擦的綜合體","骨頭突出受壓","營養不良令皮膚脆弱"],"answer":"B","explanation":{"correct":"教材寫削力係壓力及磨擦的綜合體。 教材原文：「壓力及磨擦的綜合體」","wrong":{"A":"受潮係潮濕因素。","C":"骨頭突出係易生壓瘡部位。","D":"營養不良係內在因素。"}}},{"id":"E109","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p119","question":"壓瘡第 1 級嘅特徵係？","options":["皮膚有破損或水泡，已傷到真皮","皮膚全層受傷，深至皮下組織","組織壞死，已達肌膜甚至骨頭","發紅發腫，移開壓力 30 分鐘仍一樣"],"answer":"D","explanation":{"correct":"教材寫第 1 級：皮膚發紅發腫，可能痛楚，移開壓力 30 分鐘後仍一樣。 教材原文：「移開壓力 30 分鐘後仍一樣」","wrong":{"A":"傷到真皮係第 2 級。","B":"深至皮下係第 3 級。","C":"深及骨頭係第 4 級。"}}},{"id":"E110","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p120","question":"病人平躺時，以下邊個係壓點？","options":["耳朵","骶骨","膝關節內外側","額頭"],"answer":"B","explanation":{"correct":"教材圖示平躺壓點：腳跟、骶骨、手肘、肩胛骨、頭之後面。 教材原文：「平躺：腳跟、骶骨、手肘、肩胛骨、頭之後面」","wrong":{"A":"耳朵係側臥壓點。","C":"膝內外側係側臥壓點。","D":"額頭係俯臥壓點。"}}},{"id":"E111","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p121","question":"為預防壓瘡，教材建議避免將床頭提高過幾多度？","options":["45°","30°","60°","90°"],"answer":"B","explanation":{"correct":"教材寫減低皮膚受壓措施包括避免將床頭提高過 30°。 教材原文：「避免將床頭提高過 30°」","wrong":{"A":"45 度係否硫氏臥式。","C":"60 度係餵食後床頭最少角度。","D":"90 度係端坐式。"}}},{"id":"E112","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p118","question":"以下邊項係教材列出嘅皮膚功能？","options":["激活維生素 D","製造紅血球","儲存肝醣","分泌胰島素"],"answer":"A","explanation":{"correct":"教材列皮膚功能：保護、感覺、調節體溫、激活維生素 D、排泄。 教材原文：「激活維生素 D」","wrong":{"B":"教材冇列為皮膚功能。","C":"肝醣儲存在肝及肌肉。","D":"教材冇列為皮膚功能。"}}},{"id":"E113","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p124","question":"協助病人側臥，教材話要用幾多個枕頭維持臥姿？","options":["一個","兩個","五個","三個"],"answer":"D","explanation":{"correct":"教材寫擺放三個枕頭於病人胸前、背部和膝間至腳跟。 教材原文：「擺放三個枕頭於病人胸前、背部和膝間至腳跟」","wrong":{"A":"教材寫三個。","B":"教材寫三個。","C":"教材寫三個。"}}},{"id":"E114","level":"簡單","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p122","question":"照顧者自身要點樣做，先可以減少弄損病人皮膚？","options":["護理時戴兩層手套保護皮膚","用力按摩受壓發紅嘅部位","每次護理後用火酒抹手消毒","保持短指甲，避免戴尖銳飾物"],"answer":"D","explanation":{"correct":"教材寫照顧者應保持短指甲及避免佩戴尖銳飾物，以免弄損病人皮膚。 教材原文：「照顧者應保持短指甲及避免佩戴尖銳飾物」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"E115","level":"簡單","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"疥瘡俗稱乜？","options":["癩","癬","頭蝨","濕疹"],"answer":"A","explanation":{"correct":"教材寫疥瘡俗稱「癩」，由疥蟲引起。 教材原文：「俗稱「癩」」","wrong":{"B":"教材冇咁寫。","C":"頭蝨係另一種寄生蟲問題。","D":"教材冇咁寫。"}}},{"id":"E116","level":"簡單","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"疥瘡用乜方法診斷？","options":["驗血","照 X 光","刮皮屑","驗小便"],"answer":"C","explanation":{"correct":"教材寫疥瘡診斷：刮皮屑。 教材原文：「診斷：刮皮屑」","wrong":{"A":"教材寫刮皮屑。","B":"教材寫刮皮屑。","D":"教材寫刮皮屑。"}}},{"id":"E117","level":"簡單","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"疥瘡嘅痕癢通常幾時最嚴重？","options":["早上起身時","食飯後","晚上就寢後","沖完涼後"],"answer":"C","explanation":{"correct":"教材寫痕癢尤其在晚上就寢後更甚。 教材原文：「痕癢，尤其在晚上就寢後更甚」","wrong":{"A":"教材寫晚上就寢後。","B":"教材寫晚上就寢後。","D":"教材寫晚上就寢後。"}}},{"id":"E118","level":"簡單","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p132","question":"疥瘡病人嘅衣物，教材建議點處理？","options":["1:49 漂白水浸 30 分鐘","冷水洗後曬乾","60°C 以上熱水煮不少於十分鐘","用火酒噴一次"],"answer":"C","explanation":{"correct":"教材寫將患者曾穿過的衣物，以 60°C 以上熱水煮不少於十分鐘。 教材原文：「以 60°C 以上熱水煮不少於十分鐘」","wrong":{"A":"1:49 漂白水係頭蝨病人床單衣物嘅處理。","B":"教材要求 60°C 以上。","D":"教材冇咁寫。"}}},{"id":"E119","level":"簡單","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p132","question":"疥瘡病人難以清洗嘅物品，應點處理？","options":["放入雪櫃冷藏一晚先用","用風筒熱風吹十分鐘","放入膠袋密封最少 7 天","即時丟棄，唔好再用"],"answer":"C","explanation":{"correct":"教材寫難以清洗的物品，可放入膠袋後密封最少 7 天方可使用。 教材原文：「放入膠袋後密封最少 7 天」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","D":"教材寫密封後可再使用。"}}},{"id":"E120","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p133","question":"護理記錄寫錯咗，應該點改？","options":["用塗改液塗走，再寫正確資料","一直線劃掉並簽名，再寫正確資料","撕走嗰頁，喺新一頁重寫","用鉛筆喺上面寫正確資料蓋過"],"answer":"B","explanation":{"correct":"教材寫記錄錯誤時不可塗改，應以一直線劃掉並簽名作實，隨後寫上正確資料。 教材原文：「記錄錯誤時不可塗改，應以一直線劃掉，並簽名作實」","wrong":{"A":"教材寫不可塗改。","C":"教材冇咁寫。","D":"教材寫用鋼筆或黑原子筆。"}}},{"id":"E121","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p133","question":"寫護理記錄應該用乜筆？","options":["鉛筆","紅色原子筆","鋼筆或黑原子筆","螢光筆"],"answer":"C","explanation":{"correct":"教材寫應使用鋼筆或黑原子筆，使記錄可永久保存。 教材原文：「應使用鋼筆或黑原子筆」","wrong":{"A":"鉛筆不能永久保存。","B":"教材寫黑原子筆。","D":"教材冇咁寫。"}}},{"id":"E122","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p137","question":"記錄寫「BNO」係乜意思？","options":["沒有小便","沒有大便","不准飲食","尿袋未清倒"],"answer":"B","explanation":{"correct":"教材寫沒有大便：BNO（Bowel Not Open）。 教材原文：「沒有大便：BNO (Bowel Not Open)」","wrong":{"A":"沒有小便係 N.P.U.。","C":"不准飲食係 N.P.O.。","D":"尿袋未清倒係 B.N.E.。"}}},{"id":"E123","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p140","question":"「Tarry Stool」係指乜？","options":["水狀大便","硬大便","柏油便","含黏液大便"],"answer":"C","explanation":{"correct":"教材附錄寫柏油便 Tarry Stool。 教材原文：「柏油便 Tarry Stool」","wrong":{"A":"水狀係 Watery。","B":"硬係 Hard。","D":"含黏液係 With Mucus。"}}},{"id":"E124","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p133","question":"教材建議記錄時間用乜格式？","options":["國際時間，如 1330 hrs","中文寫法，例如下午一時半","只寫上午、下午或者晚上","只寫日期，唔使寫埋時間"],"answer":"A","explanation":{"correct":"教材寫用國際時間記錄，例如 1330 hrs。 教材原文：「用國際時間記錄例如：1330 hrs」","wrong":{"B":"教材寫國際時間。","C":"教材寫國際時間。","D":"教材要求記錄日期和時間。"}}},{"id":"E125","level":"簡單","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p134","question":"醫護支援人員寫完記錄之後，仲要邊個加簽？","options":["醫生","註冊護士","病人","病人家屬"],"answer":"B","explanation":{"correct":"教材寫護士學生及／支援人員書寫記錄後，要註冊護士加簽名。 教材原文：「支援人員書寫記錄後，要註冊護士加簽名」","wrong":{"A":"教材寫註冊護士。","C":"教材寫註冊護士。","D":"教材寫註冊護士。"}}},{"id":"E126","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p142","question":"病房派藥由邊個負責？","options":["醫護支援人員","病人家屬","病房文員","護士"],"answer":"D","explanation":{"correct":"教材寫由護士負責派藥，護理人員只可在護士督導下協助病人服藥。 教材原文：「由護士負責派藥，護理人員只可在護士督導下協助病人服藥」","wrong":{"A":"支援人員只可在護士督導下協助。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"E127","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p146","question":"給藥途徑「P.O.」係乜意思？","options":["肌肉注射","自肛門入","含舌下","口服"],"answer":"D","explanation":{"correct":"教材表格：P.O. Per oral 口服。 教材原文：「P.O. Per oral 口服」","wrong":{"A":"肌肉注射係 I.M.I.。","B":"自肛門入係 P.R.。","C":"含舌下係 S.L.。"}}},{"id":"E128","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p147","question":"服藥時間「p.c.」係乜意思？","options":["飯前","晚上／睡前","有需要時","飯後"],"answer":"D","explanation":{"correct":"教材表格：p.c. After food 飯後。 教材原文：「p.c. After food 飯後」","wrong":{"A":"飯前係 a.c。","B":"晚上係 Nocte。","C":"有需要時係 p.r.n.。"}}},{"id":"E129","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p147","question":"「Stat」係乜意思？","options":["隔日","每天一次","明天早上","即時給予"],"answer":"D","explanation":{"correct":"教材表格：Stat At once 即時給予。 教材原文：「Stat At once 即時給予」","wrong":{"A":"隔日係 Q.O.D。","B":"每天一次係 Daily / Q.D.。","C":"明天早上係 Mane。"}}},{"id":"E130","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p146","question":"給藥途徑「S.L.」係指？","options":["含舌下","皮下注射","吸入","皮膚擦入"],"answer":"A","explanation":{"correct":"教材表格：S.L. Sublingual 含舌下。 教材原文：「S.L. Sublingual 含舌下」","wrong":{"B":"皮下注射係 s.c.。","C":"吸入係 Inh。","D":"皮膚擦入係 L.A.。"}}},{"id":"E131","level":"簡單","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p145","question":"教材話藥櫃最少幾耐清理一次？","options":["每日一次","每月一次","每星期一次","每年一次"],"answer":"C","explanation":{"correct":"教材寫藥櫃最少每星期清理一次。 教材原文：「藥櫃最少每星期清理一次」","wrong":{"A":"教材寫每星期。","B":"教材寫每星期。","D":"教材寫每星期。"}}},{"id":"E132","level":"簡單","chapter":"附錄｜考試篇","page":"印刷 p i","question":"期末筆試有幾多條選擇題？","options":["30 條","10 條","20 條","45 條"],"answer":"A","explanation":{"correct":"教材寫期末筆試包括選擇題 30 條（45 分）及短答題 2 條（15 分）。 教材原文：「包括選擇題 30 條（45 分）及短答題 2 條（15 分）」","wrong":{"B":"10 條係持續評估筆試。","C":"教材寫 30 條。","D":"45 係選擇題嘅總分。"}}},{"id":"E133","level":"簡單","chapter":"附錄｜考試篇","page":"印刷 p i","question":"畢業要求嘅出席率最少要幾多？","options":["80%","50%","60%","100%"],"answer":"A","explanation":{"correct":"教材寫學員的總出席率須達課程之最低要求（80%）。 教材原文：「學員的總出席率須達課程之最低要求（80%）」","wrong":{"B":"50% 係筆試及格分數比例。","C":"教材寫 80%。","D":"教材寫 80%。"}}},{"id":"E134","level":"簡單","chapter":"附錄｜考試篇","page":"印刷 p iii","question":"實務試可唔可以攝錄過程？","options":["可以，但唔可以上載","可以，只錄自己","不可攝錄","要評估員同意先可以"],"answer":"C","explanation":{"correct":"教材實務試須知寫不可攝錄實務試過程。 教材原文：「不可攝錄實務試過程」","wrong":{"A":"教材寫不可。","B":"教材寫不可。","D":"教材寫不可。"}}},{"id":"N001","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p2","question":"病人患病後覺得自己由「對社會有貢獻」變成「受人照顧」，尊嚴受威脅。根據教材，醫護人員應點做？","options":["尊重並了解個人需要，讓病人參與護理計劃","由醫護人員全權安排，免病人再操心","交由家人代病人決定護理安排","避免同病人討論病情，減少佢嘅壓力"],"answer":"A","explanation":{"correct":"教材喺自尊需要嘅應用寫明要尊重病人、了解個人需要，並讓病人參與護理計劃。 教材原文：「醫護人員應尊重並了解個人需要，讓病人參與護理計劃」","wrong":{"B":"全權代病人安排會令病人更覺得失去自主。","C":"教材冇講交由家人代決定。","D":"避免討論唔係教材建議嘅做法。"}}},{"id":"N002","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p3","question":"計劃護理措施時要決定問題嘅優先次序，教材話應該先解決邊類問題？","options":["病人最常投訴的問題","危及生命的問題","最容易即時完成的問題","家屬最關注的問題"],"answer":"B","explanation":{"correct":"教材寫明決定優先次序時，先解決危及生命的問題。 教材原文：「先解決危及生命的問題」","wrong":{"A":"教材冇以投訴次數決定次序。","C":"容易做唔等於最重要。","D":"家屬關注唔係教材列出嘅優先準則。"}}},{"id":"N003","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p3","question":"以下邊一項屬於護理過程中「檢討」嘅工作？","options":["與病人會談及參閱病歷搜集資料","決定問題的優先次序並確定目標","將護理效果與擬定的護理目標比較","運用物理治療、社康護理等資源"],"answer":"C","explanation":{"correct":"檢討包括觀察病人反應、將效果同目標比較，需要時修正計劃。 教材原文：「將護理效果及擬定之護理目標作比較」","wrong":{"A":"會談及參閱病歷屬於評估。","B":"決定優先次序及確定目標屬於計劃。","D":"運用其他資源屬於計劃護理措施。"}}},{"id":"N004","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p3","question":"執行護理計劃時，以下邊一項符合教材？","options":["由護理人員獨自執行，不讓家人參與","嚴格按原定時間執行，不可改動","先由家人執行，護理人員只作記錄","讓家人參與，執行時應具彈性"],"answer":"D","explanation":{"correct":"教材寫執行時醫護人員與病人一起執行、讓家人參與，並應具彈性。 教材原文：「讓家人參與」；「執行時，應具彈性」","wrong":{"A":"教材寫明讓家人參與。","B":"教材要求執行時具彈性。","C":"教材冇講由家人代為執行。"}}},{"id":"N005","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p4","question":"護理後「再次觀察病人」，教材舉咗邊個例子？","options":["填寫出入量紀錄表","餵飼後有否嘔吐或不適","把用過的物品消毒","向主管報告已完成的項目"],"answer":"B","explanation":{"correct":"再次觀察病人係觀察護理後反應，例如餵飼後、服藥後有否嘔吐或不適。 教材原文：「例如餵飼後、服食藥物後有否嘔吐或不適」","wrong":{"A":"填表屬於「記錄」。","C":"物品消毒屬於「物品及環境處理」。","D":"向主管報告屬於「報告」。"}}},{"id":"N006","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p4","question":"護理前準備中，「環境準備」包括乜？","options":["開燈、圍屏風、移除障礙物","除去手上飾物及洗淨雙手","向病人解釋護理的程序","準備清潔的床單及衣服"],"answer":"A","explanation":{"correct":"教材列出環境準備係開燈、圍屏風、移除障礙物。 教材原文：「環境準備：開燈、圍屏風、移除障礙物」","wrong":{"B":"除飾物、洗手係護理人員準備。","C":"解釋程序係病人準備。","D":"床單衣服係物品準備。"}}},{"id":"N007","level":"正常","chapter":"（二）起居照顧技巧｜基本照顧護理原則","page":"印刷 p3","question":"護理過程中「確立病人的健康問題」，教材要求點做？","options":["觀察病人接受護理後的各種反應","分析搜集所得的資料，以病人為中心","與其他醫護人員討論護理目標","讓病人及家人一起執行護理計劃"],"answer":"B","explanation":{"correct":"確立問題係把搜集所得的資料分析，並以病人為中心。 教材原文：「把搜集所得的資料予以分析」；「以病人為中心」","wrong":{"A":"觀察護理後反應屬於檢討。","C":"與其他醫護人員討論屬於計劃。","D":"一起執行屬於執行步驟。"}}},{"id":"N008","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p8","question":"協助中風病人淋浴後穿褲，以下邊個做法正確？","options":["先助病人穿好腳的褲管","讓病人站起後先穿褲頭","先助病人穿弱腳的褲管","兩邊褲管同時穿上"],"answer":"C","explanation":{"correct":"教材寫中風病人應先助病人穿弱腳的褲管。 教材原文：「中風病人，應先助病人穿弱腳的褲管」","wrong":{"A":"次序相反。","B":"教材步驟係先穿褲管至大腿，之後先撐起拉褲頭。","D":"教材有指定先穿弱腳。"}}},{"id":"N009","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p8","question":"淋浴徹底沖身後關水喉，正確次序係？","options":["先關冷水，後關熱水","冷熱水同時關","先關熱水，後關冷水","先關熱水，再沖一次冷水"],"answer":"C","explanation":{"correct":"教材寫徹底沖身後先關熱水，後關冷水。 教材原文：「先關熱水，後關冷水」","wrong":{"A":"次序相反，可能令水突然變熱。","B":"教材有指定先後。","D":"教材冇咁寫。"}}},{"id":"N010","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p7","question":"病人入院後第一次沐浴，除咗清潔，教材特別提到可以做乜？","options":["量度病人體重同身高作入院記錄","觀察身體有否異常，如壓瘡，並立即報告","教病人日後如何自己清洗陰部","評估病人嘅飲食喜好同食物敏感"],"answer":"B","explanation":{"correct":"教材寫可藉入院第一次沐浴觀察病人身體有否異常狀況，例如皮膚病、疤痕、損傷、壓瘡等，並立即報告。 教材原文：「可藉入院之第一次沐浴，觀察病人身體有否異常狀況，並立即報告」","wrong":{"A":"教材冇講沐浴時量體重。","C":"教材冇以此為目的。","D":"飲食喜好唔係沐浴目的。"}}},{"id":"N011","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p9","question":"床上浴時，清潔完胸部同腹部，發現盆水已經污染，應該點？","options":["繼續使用，完成後先換","更換清水","加多啲沐浴露","加熱水維持 40°C"],"answer":"B","explanation":{"correct":"教材注意事項寫清潔胸腹部後，如水已被污染便要更換。 教材原文：「清潔胸腹部後，如水已被污染便要更換」","wrong":{"A":"教材要求即時更換。","C":"加沐浴露唔解決污染。","D":"維持水溫唔解決污染問題。"}}},{"id":"N012","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p9","question":"床上浴時將浴巾放喺施行部位之下，目的係乜？","options":["為病人保暖","保護病人私隱","以防弄濕床單","方便即時抹乾皮膚"],"answer":"C","explanation":{"correct":"教材寫施行時置浴巾於施行部位下，以防弄濕床單。 教材原文：「置浴巾於施行部位下，以防弄濕床單」","wrong":{"A":"保暖係用保暖氈。","B":"私隱靠關門及圍屏風。","D":"教材講嘅目的係防弄濕床單。"}}},{"id":"N013","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p12","question":"實務試指導病人撐起身方便脫褲之前，必須確保乜？","options":["水喉已經開好並試咗水溫適中","病人已經除咗浴帽同埋手錶","病人已經穿好拖鞋可以企穩","病人雙腳已踏在地上及腳踏已收起"],"answer":"D","explanation":{"correct":"教材註明病人撐起前要確保雙腳已踏地及腳踏已收起。 教材原文：「確保病人撐起前，病人雙腳已踏在地上及腳踏已收起」","wrong":{"A":"開水喉喺脫衣之後。","B":"浴帽要喺沐浴前戴上，最後先除。","C":"步驟係先脫拖鞋。"}}},{"id":"N014","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p12","question":"實務試推洗澡車入浴室時，考生應該企喺邊？","options":["病人後方，從椅背推車前行","病人側邊，一手扶病人一手推","病人前方，面向病人，病人背行先","由協助員推車，考生在旁扶持"],"answer":"C","explanation":{"correct":"教材寫推洗澡車時考生站在病人前方，面向病人，病人背行先。 教材原文：「推洗澡車時考生應站在病人的前方，面向病人，病人背行先」","wrong":{"A":"教材唔係由後方推。","B":"教材冇咁寫。","D":"教材寫由考生推車。"}}},{"id":"N015","level":"正常","chapter":"（二）起居照顧技巧｜日常梳洗及沐浴","page":"印刷 p13","question":"「扶抱及沐浴」實務試中，以下邊一項屬於 ★★ 項目（被評 × 即不合格）？","options":["冇口述潤膚膏有效日期","冇除手錶就開始","過程中令病人跌到地上","冇放下浴簾"],"answer":"C","explanation":{"correct":"教材 4.7 以 ★★ 標示：過程中不可令病人跌到地上。 教材原文：「過程中，不可令病人跌到地上」","wrong":{"A":"口述日期係 □ 項目。","B":"除手錶係 □ 項目。","D":"放浴簾係 □ 項目。"}}},{"id":"N016","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p16","question":"使用除蝨藥之前，頭髮應該點樣？","options":["先洗頭，趁頭髮濕塗藥","無須洗頭，頭髮乾效果最好","先用火酒抹勻頭皮","先將頭髮全部剪短"],"answer":"B","explanation":{"correct":"教材寫使用除蝨藥前無須洗頭，頭髮乾反而效果最好。 教材原文：「使用除蝨藥前，無須洗頭，頭髮乾，反而效果最好」","wrong":{"A":"教材寫頭髮乾效果最好。","C":"火酒係抹走蝨狀物用，唔係塗藥前步驟。","D":"教材寫頭髮過長可徵得同意剪短，唔係必須。"}}},{"id":"N017","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p16","question":"塗上滅蝨藥之後，幾耐先沖洗同梳理頭髮？","options":["30 分鐘後","12 小時後","兩天後","7 至 10 日後"],"answer":"B","explanation":{"correct":"教材寫 12 小時後沖洗及梳理頭髮，用密齒梳梳出死蝨和死卵。 教材原文：「12 小時後沖洗及梳理頭髮」","wrong":{"A":"30 分鐘係漂白水浸物品時間。","C":"兩天係成蟲離開人體存活時間。","D":"7 至 10 日係卵孵化時間。"}}},{"id":"N018","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p15","question":"以下邊組特徵係「蝨卵」而唔係頭皮？","options":["薄片狀、色澤暗淡、容易鬆脫","薄片狀、色澤光滑、容易鬆脫","橢圓形、色澤光滑、不易脫落","橢圓形、色澤暗淡、容易鬆脫"],"answer":"C","explanation":{"correct":"教材表格：蝨卵橢圓形、色澤光滑、不易脫落；頭皮薄片狀、暗淡、易鬆脫。 教材原文：「a. 橢圓形」；「不易脫落」","wrong":{"A":"呢組係頭皮嘅特徵。","B":"薄片狀及容易鬆脫係頭皮特徵。","D":"色澤暗淡及容易鬆脫係頭皮特徵。"}}},{"id":"N019","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p16","question":"多霸除蝨液（Derbac Lotion）應點樣使用？","options":["每日一次，連續使用一至兩個星期","每週兩次，直至頭皮唔再痕癢為止","每週一次，不得連續使用超過三個星期","只用一次，之後唔好再用"],"answer":"C","explanation":{"correct":"教材寫每週一次用藥，不得連續使用超過三個星期。 教材原文：「每週一次用藥，不得連續使用超過三個星期」","wrong":{"A":"教材寫每週一次。","B":"教材寫每週一次及最多三個星期。","D":"教材容許每週一次最多三星期。"}}},{"id":"N020","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p15–16","question":"頭蝨病人換出嚟、但唔可以丟棄嘅床單衣物，應點處理？","options":["用 60°C 以上熱水煮不少於十分鐘","放在烈日下曝曬六至八個小時","放入膠袋密封最少 7 天先再用","放入 1:49 漂白水浸約 30 分鐘"],"answer":"D","explanation":{"correct":"教材寫唔能丟棄的放入消毒溶液桶（1:49 稀釋漂白水）浸約 30 分鐘，再平常洗淨。 教材原文：「1:49 稀釋的漂白水」；「完全浸約待 30 分鐘後」","wrong":{"A":"60°C 熱水煮係疥瘡衣物處理方法。","B":"曝曬係疥瘡床褥等物件處理方法。","C":"密封 7 天係疥瘡難洗物品處理方法。"}}},{"id":"N021","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p16","question":"點解使用多霸除蝨液之後唔可以用風筒？","options":["因為熱風會令蝨卵孵化","因為風筒會吹走藥液","因為多霸除蝨液是易燃物品","因為頭髮要保持濕潤 12 小時"],"answer":"C","explanation":{"correct":"教材寫多霸除蝨液是易燃物品，請勿使用風筒。 教材原文：「多霸除蝨液是易燃物品，請勿使用風筒」","wrong":{"A":"教材冇咁寫。","B":"教材講嘅原因係易燃。","D":"教材冇要求保持濕潤。"}}},{"id":"N022","level":"正常","chapter":"（二）起居照顧技巧｜床上洗頭及頭蝨","page":"印刷 p16","question":"六個月以下嘅幼嬰有頭蝨，教材點講用滅蝨藥？","options":["可以照常使用，份量減半","要先洗頭，之後先可以用藥","要先得到醫生同意，同孕婦一樣","除非在監督下，否則禁忌用藥"],"answer":"D","explanation":{"correct":"教材寫除非在監督下，否則六個月以下的幼嬰禁忌用藥。 教材原文：「除非在監督下，否則六個月以下的幼嬰，禁忌用藥」","wrong":{"A":"教材冇講減半。","B":"教材寫用藥前無須洗頭。","C":"「先得醫生同意」係教材對孕婦嘅要求。"}}},{"id":"N023","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"用口腔清潔專用棉棒沾生理鹽水時，濕度應該點？","options":["沾上適量，不可過濕滴水或過乾","愈濕愈好，方便沖走食物渣","保持乾身，避免病人嗆到","先浸透再擠乾一半"],"answer":"A","explanation":{"correct":"教材寫要沾上適量的生理鹽水，不可過濕滴水或過乾。 教材原文：「沾上適量的生理鹽水（不可過濕滴水或過乾）」","wrong":{"B":"過濕滴水係教材唔准嘅。","C":"過乾都唔准。","D":"教材冇咁寫。"}}},{"id":"N024","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p18","question":"清潔口腔時，以下邊個位置係教材列明要清洗嘅？","options":["喉嚨後壁","鼻腔入面","面頰內側","扁桃腺"],"answer":"C","explanation":{"correct":"教材列出清洗範圍：牙齒外、齒面、內側、牙齦、舌頭、上顎、下顎、面頰內側。 教材原文：「牙齒外、齒面、內側、牙齦、舌頭、上顎、下顎、面頰內側」","wrong":{"A":"教材冇列喉嚨後壁。","B":"鼻腔唔屬於口腔清潔範圍。","D":"教材冇列扁桃腺。"}}},{"id":"N025","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p19","question":"冇口腔清潔專用棉棒，要用血管鉗清潔口腔時，要注意乜？","options":["用紗布妥善包裹鉗咀，勿露鉗咀","用棉花棒代替，唔好用紗布","鉗咀要露出，方便夾走食物渣","每塊紗布可以重覆抹兩次"],"answer":"A","explanation":{"correct":"教材寫要以紗布妥善包裹血管鉗咀，勿露鉗咀，以防弄傷牙肉及黏膜。 教材原文：「須留意以紗布妥善包裹血管鉗咀，勿露鉗咀」","wrong":{"B":"教材講嘅係用紗布包血管鉗。","C":"教材寫勿露鉗咀。","D":"教材寫每塊紗布只用一次便棄掉。"}}},{"id":"N026","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p17","question":"缺乏口腔護理可以引致「擴散性」問題，以下邊項屬於擴散性？","options":["牙周病","舌炎","肺炎","腮腺炎"],"answer":"C","explanation":{"correct":"教材列擴散性問題：胃炎、咽喉炎、氣管炎、肺炎、中耳炎。 教材原文：「擴散性：胃炎、咽喉炎、氣管炎、肺炎、中耳炎」","wrong":{"A":"牙周病屬於局部性。","B":"舌炎屬於局部性。","D":"腮腺炎屬於局部性。"}}},{"id":"N027","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p21","question":"口腔護理實務試入面，替偏癱病人穿外套嘅正確次序係？","options":["先穿患側，然後穿健側","先穿健側，然後穿患側","先穿鞋襪，再穿外套","由病人自行穿著，考生旁觀"],"answer":"A","explanation":{"correct":"實務篇寫穿衣時先穿患側，然後穿健側。 教材原文：「穿衣時先穿患側，然後穿健側」","wrong":{"B":"次序相反；健側先穿會令患側難以穿入。","C":"教材冇以鞋襪先後評核。","D":"教材寫由考生協助病人穿上。"}}},{"id":"N028","level":"正常","chapter":"（二）起居照顧技巧｜口腔及假牙護理","page":"印刷 p22","question":"實務試中，病人坐輪椅時以下邊項係教材 ★ 要求？","options":["推行期間一直鎖住剎掣，以策安全","只需要喺離開病人之前鎖上剎掣","由協助員負責鎖上同鬆開剎掣","轉移前、推到位後同離開前鎖剎掣"],"answer":"D","explanation":{"correct":"教材 ★4.4 寫轉移前、推行至指定位置後及離開病人前須鎖上輪椅剎掣。 教材原文：「轉移前、推行至指定位置後及離開病人前須鎖上輪椅的剎掣器」","wrong":{"A":"推行期間要鬆開剎掣先推得郁。","B":"教材列明三個時間點都要鎖。","C":"教材要求考生做到。"}}},{"id":"N029","level":"正常","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"男病人要用便盆時，教材建議點做？","options":["只給便盆，唔使便壺","可先給便壺，然後給便盆","先給便盆，之後先給便壺","建議改用尿套"],"answer":"B","explanation":{"correct":"教材寫男病人用便盆時，可先給便壺，然後給便盆。 教材原文：「男病人用便盆時，可先給便壺，然後給便盆」","wrong":{"A":"教材建議先給便壺。","C":"次序相反。","D":"尿套係失禁或滴漏男病人用，唔係呢度嘅建議。"}}},{"id":"N030","level":"正常","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"病人唔能夠自己抹拭，護理人員用廁紙替佢抹，方向係？","options":["由後向前拭抹","先抹左右兩側","打圈方式拭抹","由前向後拭抹"],"answer":"D","explanation":{"correct":"教材寫護理人員可以廁紙替病人由前向後拭抹。 教材原文：「由前向後拭抹」","wrong":{"A":"方向相反，會將細菌帶向前面。","B":"教材寫由前向後。","C":"教材冇咁寫。"}}},{"id":"N031","level":"正常","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"傾倒便盆時發現大便有異常，應點處理？","options":["立即留下標本、記錄及通知護士","即時倒掉，並清洗及消毒便盆","等下次大便時再觀察多一次","先通知家屬，等佢哋決定點做"],"answer":"A","explanation":{"correct":"教材寫如有異常，應立即留下標本、記錄及通知護士。 教材原文：「應立即留下標本、記錄及通知護士」","wrong":{"B":"倒掉會冇咗標本。","C":"教材要求立即處理。","D":"教材寫通知護士。"}}},{"id":"N032","level":"正常","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p26","question":"記錄病人大便時，教材要求記低乜？","options":["時間、色、質、量及異常","只需記錄當日大便次數","只需記錄大便有冇血","時間同病人排便後感受"],"answer":"A","explanation":{"correct":"教材寫記錄時記下：時間、大便的色、質（特點）、量及異常。 教材原文：「時間、大便的色、質（特點）、量及異常」","wrong":{"B":"教材要求更多項目。","C":"教材要求更多項目。","D":"教材冇要求記錄感受。"}}},{"id":"N033","level":"正常","chapter":"（二）起居照顧技巧｜手足清潔及協助如廁","page":"印刷 p25","question":"病人行動不便，而廁所離床較遠，教材建議點？","options":["給予便盆／便壺","扶病人慢慢行去廁所","叫病人忍住，等有人手先去","即時為病人包尿片"],"answer":"A","explanation":{"correct":"教材寫若病人行動不便，廁所離床較遠，可給予便盆／便壺。 教材原文：「若病人行動不便，廁所離床較遠，可給予便盆／便壺」","wrong":{"B":"扶行適合情況許可嘅病人。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N034","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p29","question":"清潔失禁病人後，發現臀部皮膚已經破損，應點做？","options":["塗上厚厚一層防水膏","塗上潤膚膏後包尿片","不可塗防水膏，並通知護士","用火酒消毒傷口"],"answer":"C","explanation":{"correct":"教材寫如皮膚有破損，不可塗上防水膏，並通知護士。 教材原文：「如皮膚有破損，不可塗上防水膏，並通知護士」","wrong":{"A":"教材寫破損時不可塗防水膏。","B":"教材要求通知護士。","D":"教材冇咁寫。"}}},{"id":"N035","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p28","question":"為女病人清潔外陰時，抹拭方向同次序係？","options":["由後向前，先兩側然後中間","由前向後，先兩側然後中間","打圈抹，由中間向外","由前向後，先中間然後兩側"],"answer":"D","explanation":{"correct":"教材寫每次由前向後抹，抹拭時先中間然後兩側。 教材原文：「每次由前向後抹」；「先中間然後兩側」","wrong":{"A":"方向同次序都相反。","B":"次序相反。","C":"打圈係男病人清潔龜頭嘅方法。"}}},{"id":"N036","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p28","question":"為男病人清潔外陰，第一步用濕棉花抹邊度？","options":["先抹陰囊，然後抹陰莖","先抹腹股溝，然後抹尿道口","先抹大腿內側，再抹龜頭","先抹尿道口，然後打圈清潔龜頭"],"answer":"D","explanation":{"correct":"教材寫先以濕棉花塊抹尿道口，然後打圈清潔龜頭。 教材原文：「先抹尿道口，然後打圈清潔龜頭」","wrong":{"A":"陰囊四周喺包皮推回之後先清潔。","B":"次序唔啱，尿道口最先。","C":"次序唔啱，尿道口最先。"}}},{"id":"N037","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p27","question":"盤骨底肌肉鬆弛導致嘅小便失禁，有咩特點？","options":["只會喺夜晚發生，男性居多","由利尿藥引起，停藥即好","中風後先會出現","腹壓增加時漏尿，尤以女性居多"],"answer":"D","explanation":{"correct":"教材寫盤骨底肌肉鬆弛，當腹壓增加（咳嗽或便秘）尿液會不由自主流出，尤以女性居多。 教材原文：「當腹壓增加（咳嗽或便秘），尿液便會不由自主地流出，尤以女性居多」","wrong":{"A":"教材寫女性居多。","B":"利尿藥係另一個成因。","C":"中風屬於神經系統受影響，係另一成因。"}}},{"id":"N038","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p27","question":"以下邊項係教材列出嘅大便失禁成因？","options":["飲水過多","濫用輕瀉劑","進食高纖維食物","長期臥床休息"],"answer":"B","explanation":{"correct":"大便失禁成因包括功能性、括約肌損傷、神經損傷、濫用輕瀉劑、環境。 教材原文：「濫用輕瀉劑，造成直腸喪失部分功能」","wrong":{"A":"教材冇咁寫。","C":"高纖維係預防便秘。","D":"教材冇列為大便失禁成因。"}}},{"id":"N039","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p29","question":"失禁病人清理完臀部之後，先可以做乜？","options":["即刻餵食","進行床上浴","即刻做復康運動","即刻送去照 X 光"],"answer":"B","explanation":{"correct":"教材注意事項寫清理後方可進行床上浴。 教材原文：「清理後方可進行床上浴」","wrong":{"A":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N040","level":"正常","chapter":"（二）起居照顧技巧｜失禁處理","page":"印刷 p32–33","question":"「更換尿片、長褲及床單」實務試完成後，教材要求喺邊度記錄排泄情況？","options":["Patient Turning Chart","Physical Restraint Chart","危險藥物記錄冊","Intake and Output Chart"],"answer":"D","explanation":{"correct":"教材 ★3.4 寫要如實記錄排泄情況於 Intake and Output Chart 內。 教材原文：「排泄情況於 Intake and Output Chart 內」","wrong":{"A":"Patient Turning Chart 係轉換體位用。","B":"約束表係使用約束物品時用。","C":"危險藥物記錄冊係核對危險藥物用。"}}},{"id":"N041","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p36","question":"點解迴腸造口嘅排出物較容易損傷皮膚？","options":["冇經結腸吸水，較稀，含鹽同消化酵素多","已經過大部份結腸，所以糞便好硬","開口喺身體左邊，容易同衣服摩擦","排出物同正常大便一樣，但量較多"],"answer":"A","explanation":{"correct":"教材寫迴腸造口沒有經過結腸吸水，排泄物較呈液狀，含鹽和消化酵素較多，接觸皮膚易受損。 教材原文：「排泄物較呈液狀，同時含鹽和消化酵素的量亦較多」；「迴腸造口排出物若接觸皮膚則很容易令皮膚受損」","wrong":{"B":"迴腸造口冇經過結腸。","C":"左邊係降結腸或乙狀結腸造口。","D":"同正常大便一樣係降結腸或乙狀結腸造口。"}}},{"id":"N042","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p39","question":"迴腸造口同結腸造口，各自較適合用邊種造口袋？","options":["迴腸用開口袋，結腸用密口袋","迴腸用密口袋，結腸用開口袋","兩種都較適合用開口袋","兩種都較適合用密口袋"],"answer":"A","explanation":{"correct":"迴腸造口排泄物糊狀或液體狀，可用開口袋；結腸造口排泄物固體而軟，可用密口袋。 教材原文：「若是迴腸造口，排泄物會是糊狀或液體狀，故可使用開口袋」；「若是結腸造口，排泄物會是固體而軟性的，故可使用密口袋」","wrong":{"B":"配對相反。","C":"結腸造口較適合密口袋。","D":"迴腸造口較適合開口袋。"}}},{"id":"N043","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"剪造口袋護膚板時，大小應該點？","options":["同造口一樣大，貼得愈緊愈好","比造口細，令造口更穩固","比造口大少許（約 3 毫米）","比造口大 1 厘米，方便清潔"],"answer":"C","explanation":{"correct":"教材寫最好比實際尺碼大少許（約 3 毫米或 1/8 吋）；太大皮膚易受刺激，太小會影響血液循環。 教材原文：「最好比實際的尺碼大少許（約 3 毫米或 1/8 吋）」","wrong":{"A":"太緊會令造口緊逼。","B":"太小會影響血液循環。","D":"太大皮膚容易受排泄物刺激。"}}},{"id":"N044","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"點解切勿用消毒藥水清潔造口周圍皮膚？","options":["會令造口袋貼得太實","會刺激造口及引致皮膚乾燥","會令造口顏色轉深","會令造口停止收縮"],"answer":"B","explanation":{"correct":"教材寫用消毒藥水會刺激造口及引致皮膚乾燥。 教材原文：「因為這樣會刺激造口及引致皮膚乾燥」","wrong":{"A":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N045","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"迴腸造口用開口袋，幾時應該清倒？","options":["有三份二滿的時候","全滿先倒","每次換袋時先倒","有三份一滿的時候"],"answer":"D","explanation":{"correct":"教材寫當開口袋有三份一滿的時候，就應該把糞便放進廁所內。 教材原文：「當開口袋有三份一滿的時候」","wrong":{"A":"三分二係尿袋清倒嘅標準。","B":"教材寫三份一滿。","C":"開口袋嘅好處係唔使每次更換。"}}},{"id":"N046","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"造口手術後，造口一般幾時開始收縮？","options":["手術當日已停止收縮","手術後半年先開始收縮","手術後一至兩星期開始收縮","造口唔會收縮"],"answer":"C","explanation":{"correct":"教材寫造口會在手術後一至兩星期開始收縮，約一至兩個月內收縮便會停止，所以造口袋尺碼要跟住減。 教材原文：「造口會在手術後一至兩星期開始收縮」","wrong":{"A":"教材冇咁寫。","B":"教材寫一至兩星期開始。","D":"教材寫造口會收縮。"}}},{"id":"N047","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p41","question":"清潔造口時造口輕微滲血，應點處理？","options":["立刻用消毒藥水清洗","用濕紙巾輕按滲血位置一會","即時睇醫生，唔好再掂","繼續清潔，唔使理"],"answer":"B","explanation":{"correct":"教材寫清潔時造口受損，只需用濕了水份的紙巾輕按滲血位置一會便能止血；但若排泄物有血或血從造口內部流出，便需立刻看醫生。 教材原文：「只需用濕了水份的紙巾輕按滲血位置一會便能止血」","wrong":{"A":"教材寫切勿用消毒藥水。","C":"教材寫輕微受損按一會就可以止血。","D":"教材要求按壓止血。"}}},{"id":"N048","level":"正常","chapter":"（二）起居照顧技巧｜造口護理","page":"印刷 p37","question":"迴腸造口病人回復正常進食之後，每天輸出量大約係？","options":["1500–1800 毫升","500–800 毫升","1500–2000 毫升","少於 30 毫升"],"answer":"B","explanation":{"correct":"教材寫迴腸造口初期每天 1500–1800 毫升，回復正常進食後為 500–800 毫升。 教材原文：「回復正常進食後為 500–800 毫升」","wrong":{"A":"1500–1800 毫升係手術後初期。","C":"1500–2000 毫升係導尿病人每日建議飲水量。","D":"30c.c 係每小時排尿量要報告嘅界線。"}}},{"id":"N049","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p42","question":"清倒尿袋之後，應該點樣處理尿袋出口？","options":["用酒精抹尿袋出口","用清水沖洗出口","用希必定浸出口","唔使處理，直接關上"],"answer":"A","explanation":{"correct":"教材寫清倒後用酒精抹尿袋出口，以免細菌從出口引進。 教材原文：「清倒後，用酒精抹尿袋出口」","wrong":{"B":"教材寫用酒精。","C":"希必定係清潔尿道口用。","D":"教材要求用酒精抹。"}}},{"id":"N050","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p42","question":"準備為病人換尿套時，發現陰莖皮膚有紅疹，應點做？","options":["照常套上新尿套","不應再套上尿套","換一個較細的尿套","塗潤膚膏後再套上"],"answer":"B","explanation":{"correct":"教材寫若病人陰莖皮膚出現紅疹或水泡，便不應再套上尿套。 教材原文：「若病人陰莖皮膚出現紅疹或水泡，便不應再套上尿套」","wrong":{"A":"教材寫不應再套。","C":"太細會太緊，教材要求合適尺碼。","D":"教材冇咁寫。"}}},{"id":"N051","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p43","question":"一般留置導尿管幾耐更換一次？","options":["每日更換一次，同尿套一樣做法","每四小時或尿袋三分二滿時","通常 7–14 日，矽膠可四星期","三個月，或者有漏先更換"],"answer":"C","explanation":{"correct":"教材寫按醫院指示通常 7–14 日更換一次；矽膠導尿管可四星期才換。 教材原文：「通常 7–14 日更換一次導尿管；矽膠導尿管可四星期才換」","wrong":{"A":"每日更換係尿套。","B":"每四小時係清倒尿袋。","D":"教材冇咁寫。"}}},{"id":"N052","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p43","question":"「14FG」嘅導尿管係乜意思？","options":["導管外面圓周為 14mm","導管長度為 14cm","導管可用 14 日","水囊容量為 14ml"],"answer":"A","explanation":{"correct":"教材寫一條 14FG 的導管即是外面圓周為 14mm。 教材原文：「一條 14FG 的導管即是外面圓周為 14mm」","wrong":{"B":"教材冇咁定義。","C":"教材冇咁定義。","D":"教材冇咁定義。"}}},{"id":"N053","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p43","question":"揀導尿管尺寸時，教材話直徑太大會有咩問題？","options":["可能引致滲漏","可能引流不暢順","可能令水囊爆裂","可能引致尿道黏膜糜爛"],"answer":"D","explanation":{"correct":"教材寫較大直徑導管可能引致尿道黏膜糜爛、形成狹窄。 教材原文：「較大直徑的導管可能會引致尿道黏膜糜爛」","wrong":{"A":"滲漏係直徑太細嘅問題。","B":"引流不暢係直徑太細嘅問題。","C":"教材冇咁寫。"}}},{"id":"N054","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p43–44","question":"替有導尿管嘅病人轉身時，應點處理尿袋喉？","options":["用夾子夾緊，轉完要放夾","將尿袋放上床，轉完放返落","拆開尿袋，轉完再接駁","唔使理，尿袋掛住就得"],"answer":"A","explanation":{"correct":"教材寫轉換體位時用夾子挾緊尿袋喉，避免尿液回流；轉身完成後記得放夾子。 教材原文：「要用「夾」子挾緊尿袋喉」；「轉身完成後，僅記放「夾」子」","wrong":{"B":"尿袋要低於膀胱。","C":"導尿系統係閉合式，不可隨意分開。","D":"教材要求用夾子夾緊。"}}},{"id":"N055","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p44","question":"以下邊項係泌尿道感染症狀，要立即通知護士？","options":["尿液淡黃色","尿液混濁及尿道灼痛","每日排尿 1500 毫升","尿袋喉冇扭結"],"answer":"B","explanation":{"correct":"教材列出泌尿道感染症狀：發冷發熱、尿道灼痛、尿液混濁、血尿、惡臭、分泌物增加。 教材原文：「尿道灼痛，尿液混濁」","wrong":{"A":"淡黃色唔係教材列出嘅感染症狀。","C":"教材冇列為異常。","D":"冇扭結係正常狀態。"}}},{"id":"N056","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p44","question":"導尿系統係「閉合式」，以下邊個做法符合教材？","options":["尿袋開口可以掂地","幾個病人共用一個量杯","每個病人用自己的量杯","清倒時尿袋開口接觸量杯"],"answer":"C","explanation":{"correct":"教材寫尿袋開口勿接觸地板或量杯，每一個病人都必要有個別之量杯。 教材原文：「每一個病人都必要有個別之量杯」","wrong":{"A":"教材寫不可接觸地板。","B":"教材要求每人一個。","D":"教材寫開口勿與量杯接觸。"}}},{"id":"N057","level":"正常","chapter":"（二）起居照顧技巧｜尿套及導尿管","page":"印刷 p44","question":"停留導尿管應該點樣固定？","options":["用膠布固定於大腿內側，留足夠長度","用膠布固定於肚皮上，愈緊愈好","唔使固定，由尿袋拉住","用繩綁喺床欄上"],"answer":"A","explanation":{"correct":"教材寫用夠闊及夠長的膠布固定於病人大腿內側，尿道口與腿部間要有足夠長度。 教材原文：「停留導尿管應用夠闊及夠長之膠布固定於病人大腿內側」","wrong":{"B":"教材寫大腿內側。","C":"教材要求固定，避免拉扯。","D":"教材冇咁寫。"}}},{"id":"N058","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p46","question":"肝同肌肉都儲滿肝醣之後，剩餘嘅糖分會點？","options":["全部經小便排出體外","轉化成蛋白質去修補細胞","留喺血液入面，令血糖升高","轉化成脂肪，儲存在皮下"],"answer":"D","explanation":{"correct":"教材寫肝及肌肉儲滿後，剩餘的糖分會轉化成脂肪，儲存在皮下脂肪細胞中。 教材原文：「剩餘的糖分會轉化成脂肪，儲存在皮下脂肪細胞中」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N059","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p46","question":"點解高密度脂蛋白有助預防心血管疾病？","options":["較容易黏附在血管壁上","能帶走血管壁上的膽固醇","含較多脂肪、較少蛋白質","係飽和脂肪酸的一種"],"answer":"B","explanation":{"correct":"教材寫高密度脂蛋白能夠帶走血管壁上的膽固醇。 教材原文：「高密度脂蛋白能夠帶走血管壁上的膽固醇」","wrong":{"A":"黏附血管壁係低密度脂蛋白。","C":"含較多脂肪係低密度脂蛋白。","D":"飽和脂肪酸係與心血管疾病有關嘅脂肪酸。"}}},{"id":"N060","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p48","question":"病人牙肉出血、傷口癒合緩慢、皮下出血，可能缺乏邊種營養素？","options":["維他命 C","維他命 K","維他命 B2","鐵"],"answer":"A","explanation":{"correct":"教材表格：Vitamin C 缺乏時牙肉出血、易患感冒、傷口癒合緩慢、皮下出血。 教材原文：「牙肉出血、牙齒脫落；易患感冒；傷口癒合緩慢；皮下出血」","wrong":{"B":"缺 K 係不正常體內出血。","C":"缺 B2 係嘴角裂開、口腔黏膜發炎。","D":"缺鐵係貧血和疲倦。"}}},{"id":"N061","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p46","question":"蛋白質同鐵質一齊，可以形成乜？","options":["甲狀腺素，維持甲狀腺功能","血紅蛋白，製造紅血球","肝醣，儲存喺肝及肌肉","三酸甘油脂，儲存為脂肪"],"answer":"B","explanation":{"correct":"教材寫蛋白質功能之一係與鐵質形成血紅蛋白，製造紅血球。 教材原文：「與鐵質形成血紅蛋白，製造紅血球」","wrong":{"A":"甲狀腺素同碘有關。","C":"肝醣係糖分嘅儲存形式。","D":"三酸甘油脂係脂肪嘅主要形式。"}}},{"id":"N062","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p49","question":"傷口復原慢、味覺敏銳度降低，同缺乏邊種礦物質有關？","options":["鋅","鈉","鉀","碘"],"answer":"A","explanation":{"correct":"教材表格：鋅幫助傷口復原，缺乏時降低味覺敏銳度及免疫能力。 教材原文：「幫助傷口復原」；「降低味覺敏銳度」","wrong":{"B":"鈉係水份及酸鹼平衡。","C":"鉀係心律及肌肉收縮。","D":"碘係甲狀腺。"}}},{"id":"N063","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p48","question":"病人長期高鈉飲食，教材話會引致乜？","options":["夜盲症","甲狀腺腫大","心跳停止","血壓高"],"answer":"D","explanation":{"correct":"教材表格：鈉——高鈉則引致血壓高。 教材原文：「高鈉則引致血壓高」","wrong":{"A":"夜盲症係缺乏維他命 A。","B":"甲狀腺腫大係缺碘。","C":"心跳停止係缺鉀嘅症狀之一。"}}},{"id":"N064","level":"正常","chapter":"（二）起居照顧技巧｜七大營養素","page":"印刷 p48","question":"維他命 D 對骨骼有咩幫助？","options":["凝血，同時修補骨骼","製造紅血球，防止貧血","保持口腔及消化道黏膜健康","幫助吸收鈣質，防止骨質疏鬆"],"answer":"D","explanation":{"correct":"教材表格：維他命 D 幫助牙齒骨骼發育、補充鈣質、防止骨質疏鬆、幫助吸收鈣質。 教材原文：「防止骨質疏鬆症」；「幫助吸收鈣質」","wrong":{"A":"凝血係維他命 K。","B":"製造紅血球係 B12 等。","C":"口腔黏膜係 B2。"}}},{"id":"N065","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p57","question":"病人明早要抽空肚膽固醇，最少要禁食幾耐？","options":["八小時","六小時","四小時","十二小時"],"answer":"D","explanation":{"correct":"教材寫抽空肚膽固醇最少禁食十二小時；空肚血糖先係八小時。 教材原文：「抽空肚膽固醇 Fasting Cholesterol，最少禁食十二小時」","wrong":{"A":"八小時係空肚血糖。","B":"教材寫十二小時。","C":"教材寫十二小時。"}}},{"id":"N066","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p54","question":"腎病同肝病病人，教材話適合邊種特別餐？","options":["高卡路里高蛋白餐","低普林餐","胃餐","低蛋白餐"],"answer":"D","explanation":{"correct":"教材寫低蛋白餐（少肉、少蛋白及豆類）適用於腎、肝病人。 教材原文：「腎、肝病人適用」","wrong":{"A":"高蛋白餐係營養不良、癌症病人。","B":"低普林餐係痛風。","C":"胃餐係胃潰瘍。"}}},{"id":"N067","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p54","question":"有水腫嘅心臟病病人，較適合邊種餐？","options":["低鹽餐","低纖維／少渣餐","高卡路里高蛋白餐","低普林餐"],"answer":"A","explanation":{"correct":"教材寫低鹽餐有固定鈉份量，心臟病人、水腫、腎病人適用。 教材原文：「心臟病人、水腫、腎病人適用」","wrong":{"B":"少渣餐係腸道檢查或手術前後。","C":"高蛋白餐係營養不良。","D":"低普林餐係痛風。"}}},{"id":"N068","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p54","question":"病人明日要做腸道檢查，教材話適合邊種餐？","options":["低纖維／少渣餐","高纖維餐","低膽固醇餐","糖尿餐"],"answer":"A","explanation":{"correct":"教材寫少渣餐適用於腸道檢查前、手術前後及腸道需要休息、肚瀉等。 教材原文：「適用於腸道檢查前、手術前後病人」","wrong":{"B":"教材冇列高纖維餐。","C":"低膽固醇係高血脂病人。","D":"糖尿餐係糖尿病人。"}}},{"id":"N069","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p55","question":"醫生寫「DAT（可耐受飲食）」，以下邊個理解正確？","options":["即係正常餐，冇飲食限制","即係糊餐，方便吞嚥困難病人","即係流質餐，例如粥水清湯","按評估制定，不代表特定餐類"],"answer":"D","explanation":{"correct":"教材寫可耐受飲食按病人可耐受程度、喜好及醫療狀況，經專業評估後制定；不代表任何特定的餐飲質類。 教材原文：「而此術語不代表任何特定的餐飲質類」","wrong":{"A":"教材寫不代表特定餐類。","B":"教材寫不代表特定餐類。","C":"教材寫不代表特定餐類。"}}},{"id":"N070","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p52","question":"教材建議每日攝取嘅鈉上限係幾多？","options":["不多於 800 毫克","不多於 2400 毫克","不多於 6 克","不多於 4–6 茶匙"],"answer":"B","explanation":{"correct":"教材寫低鹽：每日攝取不多於 2400 毫克鈉，每餐不多於 800 毫克。 教材原文：「每日攝取不多於 2400 毫克鈉」","wrong":{"A":"800 毫克係每餐上限。","C":"6 克係一茶匙鹽嘅重量。","D":"4–6 茶匙係每日糖嘅上限。"}}},{"id":"N071","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p51","question":"病人飲咗一杯半（約 360 毫升）純果汁，按教材計，當幾多份水果？","options":["兩份","一份","三份","半份"],"answer":"B","explanation":{"correct":"教材寫飲用多於四分三杯（180 毫升）的純果汁也只會當作一份水果計算。 教材原文：「飲用多於四分三杯（180 毫升）的純果汁也只會當作一份水果計算」","wrong":{"A":"超過四分三杯都只當一份。","C":"超過四分三杯都只當一份。","D":"四分三杯已經算一份。"}}},{"id":"N072","level":"正常","chapter":"（二）起居照顧技巧｜均衡飲食及膳食種類","page":"印刷 p57","question":"新入院病人，醫生未初步診治之前，飲食應該點？","options":["可以照常食正餐，唔使等","可以飲少量清水濕口","可以食流質，例如粥水","暫時不准飲食，等醫生准許"],"answer":"D","explanation":{"correct":"教材寫新入院病人暫時不准飲食，直至醫生初步診治並准許進食為止。 教材原文：「暫時不准飲食，直至醫生初步診治並准許進食為止」","wrong":{"A":"教材寫暫時不准飲食。","B":"教材寫不准飲食。","C":"教材寫不准飲食。"}}},{"id":"N073","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p59","question":"餵食期間病人出現嗆咳，應該點做？","options":["繼續餵水，幫病人將食物沖落去","拍病人背部幾下，然後繼續餵食","將病人放平躺下，休息一陣先再餵","立即停止，休息，檢查口腔，穩定先再餵"],"answer":"D","explanation":{"correct":"教材寫嗆咳時立即停止餵食餵水，先讓病人休息，再檢查口腔；情況穩定才可再次餵食。 教材原文：「病人出現嗆咳情況時須立即停止餵食餵水及先讓病人休息片刻」","wrong":{"A":"教材寫要立即停止餵水。","B":"教材冇咁寫。","C":"教材寫餵食後切勿立刻躺下。"}}},{"id":"N074","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"病人餵食後唔方便坐起，床頭最少要調高幾多度？","options":["30 度","60 度","45 度","15 度"],"answer":"B","explanation":{"correct":"教材寫餵食後端坐最少半小時，或把床頭調高不少於 60 度。 教材原文：「把床頭調高不少於 60 度」","wrong":{"A":"30 度係半仰臥式。","C":"45 度係否硫氏臥式。","D":"教材寫 60 度。"}}},{"id":"N075","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"病人進食時出現哽噎、嘴唇及指甲發紫，應點做？","options":["鼓勵病人咳嗽，並即時通知護士","即刻餵水，幫病人吞落去","讓病人躺低休息，觀察一陣","等病人自己好返先通知護士"],"answer":"A","explanation":{"correct":"教材寫有任何哽噎、嘴唇及指甲發紫，應鼓勵病人咳嗽，並即時通知護士進行哽噎搶救。 教材原文：「應鼓勵病人咳嗽，並即時通知護士進行哽噎搶救」","wrong":{"B":"餵水可能令情況更差，教材冇咁寫。","C":"教材冇咁寫。","D":"教材要求即時通知。"}}},{"id":"N076","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p59","question":"病人食完飯坐喺大班椅，以下邊個做法係教材唔容許？","options":["除去枱板讓病人單獨坐著","檢查口腔冇剩餘食物","替病人抹咀","維持病人端坐姿勢"],"answer":"A","explanation":{"correct":"教材寫餐後不可除去枱板讓病人單獨坐著。 教材原文：「餐後不可除去枱板讓病人單獨坐著」","wrong":{"B":"教材要求檢查口腔。","C":"教材要求餐後抹咀。","D":"教材要求維持端坐。"}}},{"id":"N077","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p56","question":"照顧吞嚥困難病人，教材話飲食建議應該依照邊位專業人員？","options":["物理治療師","職業治療師","言語治療師","藥劑師"],"answer":"C","explanation":{"correct":"教材照顧吞嚥困難病人第 8 點：依照言語治療師的飲食建議。 教材原文：「依照言語治療師的飲食建議」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N078","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p57","question":"醫生寫「除藥物外，不准飲食」，醫護支援人員可唔可以餵藥？","options":["可以自行決定餵藥","只可以在護士指導下餵藥","要等醫生到場先可以餵藥","可以，但要家屬同意"],"answer":"B","explanation":{"correct":"教材寫醫護支援人員祇可以在護士指導下餵病人服食藥物。 教材原文：「醫護支援人員祇可以在護士指導下餵病人服食藥物」","wrong":{"A":"教材要求在護士指導下。","C":"教材容許在護士指導下協助。","D":"教材冇咁寫。"}}},{"id":"N079","level":"正常","chapter":"（二）起居照顧技巧｜餵食技巧","page":"印刷 p58","question":"準備餵食嘅環境，教材要求先做乜？","options":["先打開電視令病人放鬆","先熄燈令環境安靜","先請其他病人離開","先拿走便盆、便椅、便壺"],"answer":"D","explanation":{"correct":"教材寫環境方面要先拿走便盆、便椅、便壺，並保持空氣流通。 教材原文：「先拿走便盆、便椅、便壺」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N080","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p64","question":"鋪上面床單時，足部位置應該點？","options":["要拉緊，防病人滑落","要摺入床褥下兩次","宜寬鬆，防足部受壓或足垂","唔使蓋到足部"],"answer":"C","explanation":{"correct":"教材寫鋪上面床單時，足部宜寬鬆，防足部受壓或足垂。 教材原文：「鋪上面床單時，足部宜寬鬆，防足部受壓或足垂」","wrong":{"A":"拉緊會令足部受壓。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N081","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p65","question":"為節省時間及精力，鋪床次序應該點？","options":["先床尾後床頭，兩側同時一齊鋪","先鋪中間，再向四角逐個鋪好","由病人決定先鋪邊一部分","先床頭後床尾，鋪好一側再鋪另一側"],"answer":"D","explanation":{"correct":"教材寫先鋪床頭再鋪床尾，鋪好一側再鋪另一側。 教材原文：「先鋪床頭再鋪床尾，鋪好一側再鋪另一側」","wrong":{"A":"次序相反。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N082","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p66","question":"鋪收症床時，面床單上端要向外摺幾多？","options":["2–3 吋","8–12 吋","20–24 吋","唔使摺"],"answer":"B","explanation":{"correct":"教材寫將面床單上端 8–12 吋向外摺，蓋過花被。 教材原文：「將面床單上端 8–12 吋向外摺」","wrong":{"A":"教材寫 8–12 吋。","C":"教材寫 8–12 吋。","D":"教材要求向外摺。"}}},{"id":"N083","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p66","question":"病人請假回家，佢張床屬於邊類？","options":["備用床（Closed Bed）","手術後床","應用床（暫空床）","特別床類（如水床）"],"answer":"C","explanation":{"correct":"教材列應用床種類包括收症床、病人離床外坐、病人請假回家、手術後應用床。 教材原文：「病人請假回家」","wrong":{"A":"備用床係冇病人佔用。","B":"手術床係手術後用。","D":"教材冇咁分類。"}}},{"id":"N084","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p68","question":"病人不可離床時更換床單，以下邊個做法正確？","options":["扶病人坐喺椅上，再重鋪全床","兩人合力一次過抽走全部床單","協助側臥，將床單捲入病人背後","病人平臥時，由床尾直接拉出床單"],"answer":"C","explanation":{"correct":"教材寫協助病者轉側臥，由面至底將各類床單捲入病人背後，一邊一邊更換。 教材原文：「由面至底將各類床單一併捲入病人背後」","wrong":{"A":"坐椅上係病人可離床時嘅做法。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N085","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p64","question":"鋪床時護理人員應保持點樣嘅姿勢？","options":["雙腳併埋，彎腰埋床邊鋪床","扭轉身體去拉直對面床單","主要用腰力將床單拉直","兩腳分開，勿彎腰，用大腿肌肉"],"answer":"D","explanation":{"correct":"教材寫應注意正確姿勢，兩腳分開，勿彎腰，屈膝；用大腿肌肉；避免扭轉身體。 教材原文：「兩腳分開，勿彎腰」；「用大腿肌肉」","wrong":{"A":"教材寫兩腳分開、勿彎腰。","B":"教材寫避免扭轉身體。","C":"教材寫用大腿肌肉。"}}},{"id":"N086","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"以下邊類術後病人，醫護支援人員可以獨自接送？","options":["全身麻醉的大型手術，病人已醒","下半身麻醉的手術，病人清醒","各類手術，只要病人已經清醒","簡單局部麻醉手術，如切除粉瘤"],"answer":"D","explanation":{"correct":"教材寫醫護支援人員只可接送簡單及小型手術的術後病人，如簡單局部麻醉手術；全身或下半身麻醉要護士處理。 教材原文：「醫護支援人員只可接送簡單及小型手術的術後病人」","wrong":{"A":"全身麻醉要護士處理。","B":"下半身麻醉要護士處理。","C":"教材只容許簡單小型手術。"}}},{"id":"N087","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"手術日，以下邊種藥物教材寫明唔包括喺「繼續服用」之內？","options":["止痛藥","糖尿藥","血壓藥","抗生素"],"answer":"B","explanation":{"correct":"教材寫確保繼續服用署方藥物（除糖尿藥外）。 教材原文：「（除糖尿藥外）」","wrong":{"A":"教材冇特別排除。","C":"教材冇特別排除。","D":"教材冇特別排除。"}}},{"id":"N088","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p72","question":"術後病人返到病房，即時要量度乜？","options":["血壓、體溫、脈搏和血含氧量","體重、身高同埋腰圍","血糖同小便糖份及蛋
