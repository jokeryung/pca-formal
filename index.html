","options":["2–3 吋","8–12 吋","20–24 吋","唔使摺"],"answer":"B","explanation":{"correct":"教材寫將面床單上端 8–12 吋向外摺，蓋過花被。 教材原文：「將面床單上端 8–12 吋向外摺」","wrong":{"A":"教材寫 8–12 吋。","C":"教材寫 8–12 吋。","D":"教材要求向外摺。"}}},{"id":"N083","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p66","question":"病人請假回家，佢張床屬於邊類？","options":["備用床（Closed Bed）","手術後床","應用床（暫空床）","特別床類（如水床）"],"answer":"C","explanation":{"correct":"教材列應用床種類包括收症床、病人離床外坐、病人請假回家、手術後應用床。 教材原文：「病人請假回家」","wrong":{"A":"備用床係冇病人佔用。","B":"手術床係手術後用。","D":"教材冇咁分類。"}}},{"id":"N084","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p68","question":"病人不可離床時更換床單，以下邊個做法正確？","options":["扶病人坐喺椅上，再重鋪全床","兩人合力一次過抽走全部床單","協助側臥，將床單捲入病人背後","病人平臥時，由床尾直接拉出床單"],"answer":"C","explanation":{"correct":"教材寫協助病者轉側臥，由面至底將各類床單捲入病人背後，一邊一邊更換。 教材原文：「由面至底將各類床單一併捲入病人背後」","wrong":{"A":"坐椅上係病人可離床時嘅做法。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N085","level":"正常","chapter":"（二）起居照顧技巧｜整理床鋪","page":"印刷 p64","question":"鋪床時護理人員應保持點樣嘅姿勢？","options":["雙腳併埋，彎腰埋床邊鋪床","扭轉身體去拉直對面床單","主要用腰力將床單拉直","兩腳分開，勿彎腰，用大腿肌肉"],"answer":"D","explanation":{"correct":"教材寫應注意正確姿勢，兩腳分開，勿彎腰，屈膝；用大腿肌肉；避免扭轉身體。 教材原文：「兩腳分開，勿彎腰」；「用大腿肌肉」","wrong":{"A":"教材寫兩腳分開、勿彎腰。","B":"教材寫避免扭轉身體。","C":"教材寫用大腿肌肉。"}}},{"id":"N086","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"以下邊類術後病人，醫護支援人員可以獨自接送？","options":["全身麻醉的大型手術，病人已醒","下半身麻醉的手術，病人清醒","各類手術，只要病人已經清醒","簡單局部麻醉手術，如切除粉瘤"],"answer":"D","explanation":{"correct":"教材寫醫護支援人員只可接送簡單及小型手術的術後病人，如簡單局部麻醉手術；全身或下半身麻醉要護士處理。 教材原文：「醫護支援人員只可接送簡單及小型手術的術後病人」","wrong":{"A":"全身麻醉要護士處理。","B":"下半身麻醉要護士處理。","C":"教材只容許簡單小型手術。"}}},{"id":"N087","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"手術日，以下邊種藥物教材寫明唔包括喺「繼續服用」之內？","options":["止痛藥","糖尿藥","血壓藥","抗生素"],"answer":"B","explanation":{"correct":"教材寫確保繼續服用署方藥物（除糖尿藥外）。 教材原文：「（除糖尿藥外）」","wrong":{"A":"教材冇特別排除。","C":"教材冇特別排除。","D":"教材冇特別排除。"}}},{"id":"N088","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p72","question":"術後病人返到病房，即時要量度乜？","options":["血壓、體溫、脈搏和血含氧量","體重、身高同埋腰圍","血糖同小便糖份及蛋白","只需要量體溫同脈搏"],"answer":"A","explanation":{"correct":"教材寫回病房即時測量血壓、體溫、脈搏和血含氧量，按醫囑每 15 分鐘至 1 小時觀察。 教材原文：「測量血壓、體溫、脈搏和血含氧量」","wrong":{"B":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材列出四項。"}}},{"id":"N089","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"準備口咽人工氣道時，成人通常預備幾多號？","options":["3 號或 4 號","0 號或 00 號","1 號或 2 號","5 號或 6 號"],"answer":"A","explanation":{"correct":"教材寫通常預備成人尺碼（3 號或 4 號），或小童尺碼（2 號或 3 號）。 教材原文：「通常預備成人尺碼（3 號或 4 號）」","wrong":{"B":"教材冇咁寫。","C":"2 號係小童尺碼之一。","D":"教材冇咁寫。"}}},{"id":"N090","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"病人被送去手術室之後，病房可以準備乜？","options":["收症床","備用床","嬰兒床","手術後床"],"answer":"D","explanation":{"correct":"教材寫病人離開病房後，可以準備手術後床。 教材原文：「病人離開病房後，可以準備手術後床」","wrong":{"A":"收症床係新入院用。","B":"備用床係冇病人佔用。","C":"教材冇咁寫。"}}},{"id":"N091","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p74","question":"為男嬰清潔下身，以下邊個做法正確？","options":["將包皮拉後再抹龜頭","由陰莖向腿部皺摺抹","唔使清潔陰囊","切勿將包皮朝後拉扯擦拭"],"answer":"D","explanation":{"correct":"教材寫清潔男嬰時沿腿部皺摺處朝陰莖擦拭，切勿將包皮朝後拉扯擦拭。 教材原文：「切勿將包皮朝後拉扯擦拭」","wrong":{"A":"拉後包皮係成人男病人清潔方法，嬰兒切勿。","B":"方向相反。","C":"教材寫要注意陰囊部位清潔。"}}},{"id":"N092","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p74","question":"點解女嬰尿片較厚嘅部分應該向後移？","options":["女嬰大便量較男嬰多","女嬰臀部皮膚較男嬰薄","躺下時容易尿濕背側","防止尿片壓住臍帶"],"answer":"C","explanation":{"correct":"教材寫女嬰尿濕區域多在中央，躺下時容易尿濕背側，因此把尿片較厚部份向後移。 教材原文：「躺下時容易尿濕背側，因此應把尿片較厚的部份向後移」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N093","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p75","question":"準備嬰兒沐浴水，以下邊個做法正確？","options":["先放熱水後放冷水，用手指試溫","水溫約 45°C，用手背試溫","冷熱水一齊放，用手掌試溫","先放冷水後放熱水，用手肘試溫"],"answer":"D","explanation":{"correct":"教材寫預備水溫約 37°C–40°C，先放冷水後放熱水，並用手肘測試水溫。 教材原文：「要先放冷水，後放熱水，並用手肘測試水溫」","wrong":{"A":"次序相反，而且教材寫用手肘。","B":"教材寫約 37°C–40°C。","C":"教材寫先冷後熱。"}}},{"id":"N094","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p77","question":"嬰兒臍帶未乾脫，以下邊個做法係教材「切忌」？","options":["用凍開水沾濕棉花棒抹臍帶底部","用臍布包紮或洒臍粉","包尿片時讓臍帶外露","輕度滲血時用棉棒輕按"],"answer":"B","explanation":{"correct":"教材寫切忌用臍布包紮或洒臍粉，勿塗有色消毒藥水。 教材原文：「切忌用臍布包紮或洒臍粉」","wrong":{"A":"呢個係教材建議嘅做法。","C":"呢個係教材建議嘅做法。","D":"呢個係教材建議嘅做法。"}}},{"id":"N095","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p78","question":"測試奶溫，教材建議用邊個部位同幾多度？","options":["手腕皮膚，37°C – 38°C","手肘，40°C – 42°C","手指，20°C – 24°C","手背，45°C"],"answer":"A","explanation":{"correct":"教材寫以手腕皮膚測試流出奶的溫度是否合適（37°C – 38°C）。 教材原文：「以手腕皮膚測試流出奶的溫度是否合適」","wrong":{"B":"手肘係試沐浴水溫用。","C":"20°C–24°C 係沐浴室溫。","D":"教材冇咁寫。"}}},{"id":"N096","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p77","question":"臍帶滲出液變成膿狀、周圍皮膚發紅，應點做？","options":["用紗布蓋住","塗有色消毒藥水","向護士報告","洒臍粉吸乾"],"answer":"C","explanation":{"correct":"教材寫若滲出液呈膿狀，周圍皮膚發紅或滲血增加，要向護士報告。 教材原文：「若滲出液呈膿狀，周圍皮膚發紅或滲血增加，要向護士報告」","wrong":{"A":"教材寫不宜用紗布覆蓋。","B":"教材寫勿塗有色消毒藥水。","D":"教材寫切忌洒臍粉。"}}},{"id":"N097","level":"正常","chapter":"（三）病人護理技巧｜兒科病人","page":"印刷 p76","question":"為嬰兒洗頭時，點樣防止耳朵入水？","options":["用棉花球塞住耳道","用膠布貼住耳朵","用大拇指和中指塞住兩耳","將頭側向一邊"],"answer":"C","explanation":{"correct":"教材寫洗頭時抱緊嬰兒，用大拇指和中指塞住兩耳朵以免入水。 教材原文：「用大拇指和中指塞住兩耳朵以免入水」","wrong":{"A":"用棉花球係成人床上洗頭嘅做法。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N098","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p79","question":"長者一邊手腳突然失去感覺或軟弱無力，教材話可能係乜？","options":["柏金遜症","退化性膝關節炎","中風","老化引起嘅觸覺減弱"],"answer":"C","explanation":{"correct":"教材表格寫手腳（尤其是一邊）突然失去感覺或軟弱無力可能是中風。 教材原文：「突然失去感覺或軟弱無力」","wrong":{"A":"柏金遜症係震顫、動作緩慢。","B":"膝關節炎係膝痛。","D":"老化觸覺減弱係漸進，唔係突然一邊無力。"}}},{"id":"N099","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p83","question":"以下邊種藥物係教材列出會引起便秘？","options":["抗生素","嗎啡類止痛藥","眼藥水","維他命 C"],"answer":"B","explanation":{"correct":"教材寫一些藥物如嗎啡類止痛藥、鈣片、利尿藥等會引起便秘。 教材原文：「一些藥物如嗎啡類止痛藥、鈣片、利尿藥等」","wrong":{"A":"教材冇列抗生素。","C":"教材冇列眼藥水。","D":"教材冇列維他命 C。"}}},{"id":"N100","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p83","question":"點解高血壓病人便秘時要特別小心？","options":["便秘會令血壓藥吸收差而失效","過份用力排便會令血壓上升，甚至中風","高血壓病人食高纖維會令血壓升","便秘用力會引致白內障提早出現"],"answer":"B","explanation":{"correct":"教材寫患有高血壓者排便時過份用力，會令血壓上升，甚或誘發中風。 教材原文：「患有高血壓者排便時過份用力，會令血壓上升，甚或誘發中風」","wrong":{"A":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N101","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p84","question":"教材點評價喺膝關節內注射類固醇？","options":["可以根治已退化的關節","雖能止痛，但會令退化惡化","係首選治療，愈早做愈好","冇副作用，可以長期使用"],"answer":"B","explanation":{"correct":"教材寫關節內注射類固醇雖然能止痛，但會令退化惡化，非不得已切勿採用。 教材原文：「在關節內注射類固醇藥物，雖然能止痛，但會令退化惡化」","wrong":{"A":"教材寫藥物不能根治已退化的關節。","C":"教材寫非不得已切勿採用。","D":"教材寫會令退化惡化。"}}},{"id":"N102","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p85","question":"為保護膝關節，以下邊個做法符合教材？","options":["多做蹲下運動","長時間步行強化膝部","避免長期坐矮櫈或蹲","攜帶重物鍛鍊肌肉"],"answer":"C","explanation":{"correct":"教材寫避免膝關節長時間保持同一姿勢，如長期坐矮櫈、蹲等。 教材原文：「避免膝關節長時間保持同一個姿勢，如長期坐矮櫈、蹲等」","wrong":{"A":"教材寫避免蹲。","B":"教材寫避免步行太久。","D":"教材寫避免攜帶過重物件。"}}},{"id":"N103","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p83","question":"白內障手術後嘅護理，以下邊項符合教材？","options":["洗頭時避免污水流入眼內","多食堅硬食物增強咀嚼","術後第二日開始劇烈運動","先停用醫生處方的眼藥"],"answer":"A","explanation":{"correct":"教材寫手術後洗頭時小心避免污水流入眼內，並依時使用醫生囑咐的藥物。 教材原文：「洗頭時，小心避免污水流入眼內」","wrong":{"B":"教材寫堅硬食物不宜進食。","C":"教材寫初期應多在床上靜養。","D":"教材寫依時使用醫生囑咐的藥物。"}}},{"id":"N104","level":"正常","chapter":"（三）病人護理技巧｜老化、白內障、便秘、膝關節炎","page":"印刷 p80","question":"長者喺熟識嘅街道迷路，教材話可能係乜嘅病徵？","options":["白內障","認知障礙症","正常老化","柏金遜症"],"answer":"B","explanation":{"correct":"教材表格寫認知能力衰退，例如在熟識的街道迷途，可能是認知障礙症的病徵。 教材原文：「在熟識的街道迷途」","wrong":{"A":"白內障係視力問題。","C":"教材列為應尋求治療嘅問題，唔係正常老化。","D":"柏金遜症係活動問題。"}}},{"id":"N105","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p87","question":"照顧柏金遜症病人，教材點解話「切忌凡事代勞」？","options":["病人會覺得唔受尊重而發脾氣","代勞會增加醫護人手","病人會拒絕食藥","自理能力會因少鍛鍊而退步更快"],"answer":"D","explanation":{"correct":"教材寫切忌凡事代勞，否則患者活動自理能力反而會因少鍛鍊退步得更快。 教材原文：「切忌凡事代勞」","wrong":{"A":"教材講嘅原因係自理能力退步。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N106","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p86","question":"以下邊項係柏金遜症嘅典型徵狀？","options":["晚上就寢後痕癢加劇","突然眼痛眼紅","關節活動如齒輪般僵硬","嘴角裂開及潰瘍"],"answer":"C","explanation":{"correct":"柏金遜症徵狀：震顫、動作緩慢、關節如齒輪般僵硬、面部無表情。 教材原文：「關節活動顯得如齒輪般僵硬」","wrong":{"A":"晚上痕癢係疥瘡。","B":"眼痛眼紅係青光眼。","D":"嘴角裂開係缺乏維他命 B2。"}}},{"id":"N107","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p88","question":"為柏金遜症病人安排沐浴設施，教材話邊樣較安全？","options":["浴缸","企缸","玻璃趟門浴室","淋浴間"],"answer":"D","explanation":{"correct":"教材寫患者進出浴缸或企缸都較危險，淋浴間則較安全，最好用膠浴簾代替玻璃趟門。 教材原文：「淋浴間則較安全」","wrong":{"A":"教材寫浴缸較危險。","B":"教材寫企缸較危險。","C":"教材建議用膠浴簾代替玻璃趟門。"}}},{"id":"N108","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p87","question":"柏金遜症病人穿褲時，教材建議點？","options":["坐著穿，褲勿過長過寬","企著穿，一隻手扶住牆","躺喺床上由人幫手穿","由家人幫手全部代勞"],"answer":"A","explanation":{"correct":"教材寫穿褲時應坐著，褲子勿過長過寬，以預防跌倒。 教材原文：「穿褲時應坐著，褲子勿過長過寬」","wrong":{"B":"教材寫坐著。","C":"教材寫坐著。","D":"教材寫切忌凡事代勞。"}}},{"id":"N109","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p91","question":"抑鬱症病人拒絕服藥，應點做？","options":["強迫病人服藥","了解原因，並通知醫生","偷偷混入食物","由佢唔食，唔使理"],"answer":"B","explanation":{"correct":"教材寫若患者拒絕服藥，須了解原因，並通知醫生。 教材原文：「若患者拒絕服藥，須了解原因，並通知醫生」","wrong":{"A":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材要求了解原因及通知醫生。"}}},{"id":"N110","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p92","question":"阿爾茲海默氏症病人嘅記憶通常點樣？","options":["近期事記得好清楚，舊事忘記","近期事難記，陳年舊事記憶猶新","新舊記憶同時一齊消失","記憶冇影響，只有活動困難"],"answer":"B","explanation":{"correct":"教材寫病人記起近期事較困難，相反對遠期陳年舊事卻記憶猶新。 教材原文：「對遠期所發生的陳年舊事卻記憶猶新」","wrong":{"A":"次序相反。","C":"教材寫係逐漸減退。","D":"教材寫記憶力逐漸減退。"}}},{"id":"N111","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p92","question":"多次中風或血管梗塞，可以引起邊種認知障礙症？","options":["阿爾茲海默氏痴呆症","柏金遜症","多發性梗塞腦退化症","抑鬱症"],"answer":"C","explanation":{"correct":"教材寫多次中風或血管梗塞容易引起多發性梗塞腦退化症。 教材原文：「多發性梗塞腦退化症（Multi-Infarct Dementia）」","wrong":{"A":"阿爾茲海默氏症係腦部退化加速。","B":"柏金遜症係神經系統疾病。","D":"抑鬱症唔係由此引起。"}}},{"id":"N112","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p91","question":"根據教材，85 歲或以上嘅長者，大約幾多人有一位患認知障礙症？","options":["每十名","每二十名","每兩名","每四名"],"answer":"D","explanation":{"correct":"教材寫八十五歲或以上的長者，每四名便可能有一位患上；65 歲或以上約百分之十。 教材原文：「每四名便可能有一位患上痴呆症」","wrong":{"A":"百分之十（每十名）係 65 歲或以上。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N113","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p93","question":"認知障礙症中期病人常見嘅睡眠問題係？","options":["晚上好早就瞓，瞓得好熟","整日整夜都唔需要睡覺","只會喺下晝午睡一陣","日夜不分，白天睡晚上醒"],"answer":"D","explanation":{"correct":"教材寫中期病人對時間冇正確判斷，日夜不分，白天呼呼入睡，晚上則不能安睡。 教材原文：「白天呼呼入睡，晚上則不能安睡」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N114","level":"正常","chapter":"（三）病人護理技巧｜柏金遜症、抑鬱症、認知障礙症","page":"印刷 p94","question":"「定向訓練」對認知障礙症病人有咩作用？","options":["回想及分享舊事，促進長者溝通","刺激體能智能，減少行為問題","認知自己身處的時、地及身邊的人","改善視覺同聽覺，減少影響"],"answer":"C","explanation":{"correct":"教材寫定向訓練使病人認知自己處身的時、地及周圍的人群。 教材原文：「定向訓練，使病人認知自己處身的時、地及周圍的人群」","wrong":{"A":"回想舊事係緬懷活動。","B":"刺激體能係康樂及手工製作活動。","D":"改善視聽係定期檢查及助聽器、眼鏡。"}}},{"id":"N115","level":"正常","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p95","question":"清醒病人想嘔，以下邊個處理正確？","options":["扶坐起或轉側，假牙應即除去","讓病人平臥，頭向上","戴住假牙，以免病人尷尬","即刻餵水幫佢壓住"],"answer":"A","explanation":{"correct":"教材寫將病人扶起坐在床上或轉側以免吸入嘔吐物；若帶有假牙，應即除去。 教材原文：「以免病人吸入嘔吐物」；「若病人帶有假牙，應即除去」","wrong":{"B":"平臥容易吸入嘔吐物。","C":"教材寫應即除去假牙。","D":"教材冇咁寫。"}}},{"id":"N116","level":"正常","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p96","question":"嘔吐物呈黃綠色，代表乜？","options":["急性食道出血","腸胃出血","腸閉塞","胃液混和膽汁"],"answer":"D","explanation":{"correct":"教材寫黃綠色係胃液混和膽汁而成。 教材原文：「胃液混和膽汁而成黃綠色」","wrong":{"A":"急性出血係鮮紅色。","B":"腸胃出血係咖啡渣樣。","C":"腸閉塞係有糞便味。"}}},{"id":"N117","level":"正常","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p96","question":"昏迷病人嘔吐後出現發紺，應點做？","options":["即刻扶病人坐起身咳","餵病人飲水沖走嘔吐物","等嘔吐停止咗先再處理","立即通知當值護士用抽痰器"],"answer":"D","explanation":{"correct":"教材寫如發紺或呼吸急速，要立即通知當值護士用抽痰器將嘔吐物吸清。 教材原文：「通知當值護士用抽痰器」","wrong":{"A":"昏迷病人要轉側臥。","B":"昏迷病人唔可以餵水。","C":"教材要求立即通知。"}}},{"id":"N118","level":"正常","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p97","question":"以下邊個做法有助促進病人睡眠？","options":["黃昏後避免給予咖啡因飲品","夜間每小時叫醒病人做護理","白天盡量讓病人躺床休息","睡前同病人討論煩惱問題"],"answer":"A","explanation":{"correct":"教材寫黃昏後避免咖啡因、白天盡量活動、夜間工作集中進行、睡前避免討論煩惱。 教材原文：「黃昏後，避免給予咖啡因之飲品」","wrong":{"B":"教材寫集中工作減少干擾。","C":"教材寫白天盡量活動。","D":"教材寫睡前不宜討論煩惱問題。"}}},{"id":"N119","level":"正常","chapter":"（三）病人護理技巧｜嘔吐及失眠病人","page":"印刷 p97","question":"夜間護理工作應該點樣安排，先唔會影響病人睡眠？","options":["每項工作分開做，次數愈多愈好","全部留到凌晨三點先做","安排在病人清醒時或集中進行","叫醒病人做完先再瞓"],"answer":"C","explanation":{"correct":"教材寫夜間工作要安排在病人清醒時進行，或集中各項工作以減少干擾。 教材原文：「夜間工作要安排在病人清醒時進行，或集中各項工作以減少對病人的干擾」","wrong":{"A":"教材寫集中進行。","B":"教材冇咁寫。","D":"教材寫要減少干擾。"}}},{"id":"N120","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p98","question":"病人要做肛門或直腸檢查，應擺成邊個體位？","options":["右側臥式","俯臥式","左側臥式","否硫氏臥式"],"answer":"C","explanation":{"correct":"教材寫左側臥式方便背部料理、肛門或直腸檢查、施行直腸或會陰治療。 教材原文：「左側臥式：方便背部料理、肛門或直腸檢查」","wrong":{"A":"右側臥主要方便背部料理及轉換臥式。","B":"俯臥方便背部或臀部傷口料理。","D":"否硫氏用於呼吸困難或有引流者。"}}},{"id":"N121","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p98","question":"身上有引流嘅病人，教材建議用邊個體位？","options":["否硫氏臥式","俯臥式","仰臥式","左側臥式"],"answer":"A","explanation":{"correct":"教材寫否硫氏臥式用於呼吸困難病人，及身上有引流者，有助滲物流出。 教材原文：「用於身上有引流者」","wrong":{"B":"俯臥方便背部傷口料理。","C":"仰臥有助全身鬆弛。","D":"左側臥方便直腸檢查。"}}},{"id":"N122","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p99","question":"以下邊類病人教材寫明唔適合扶行？","options":["高血壓病人","糖尿病病人","剛食完飯的病人","脊骨傷患或手術後病人"],"answer":"D","explanation":{"correct":"教材注意事項寫脊骨傷患／手術後病人不適合扶行。 教材原文：「脊骨傷患／手術後病人不適合扶行」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N123","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p99","question":"扶抱病人時轉身，教材要求點做？","options":["用腰力扭轉身體","用腳步移動（碎步）轉身","雙腳企定，用手拉轉病人","先放低病人再轉身"],"answer":"B","explanation":{"correct":"教材寫轉動病人時要利用腳步的移動（碎步），而非靠扭動本身的腰力。 教材原文：「利用腳步的移動（碎步），而非靠扭動本身的腰力來轉動身體」","wrong":{"A":"教材寫唔好靠腰力扭轉。","C":"教材要求移動腳步。","D":"教材冇咁寫。"}}},{"id":"N124","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p99","question":"扶抱病人時，應該用身體邊部分發力？","options":["用雙腳發力，保持背部挺直","用腰部發力，背部微彎","用雙手發力，雙腳企直","用肩膊發力，頭向下望"],"answer":"A","explanation":{"correct":"教材寫收緊腹肌，用雙腳而不是腰部發力，並保持背部挺直。 教材原文：「用雙腳而不是腰部發力，並保持背部挺直」","wrong":{"B":"教材寫唔係腰部。","C":"教材寫屈膝坐馬，用雙腳。","D":"教材寫眼向前望。"}}},{"id":"N125","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p107","question":"病人用拐杖行平路，正確次序係？","options":["拐杖 → 好腳 → 弱腳","好腳 → 拐杖 → 弱腳","拐杖 → 弱腳 → 好腳","弱腳 → 好腳 → 拐杖"],"answer":"C","explanation":{"correct":"教材寫拐杖放前約一步距離，弱腳行前，好腳跟上。 教材原文：「拐杖放前約一步距離」；「弱腳行前」；「好腳跟上」","wrong":{"A":"教材寫弱腳先行。","B":"教材寫拐杖先放前。","D":"教材寫拐杖先放前。"}}},{"id":"N126","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p107","question":"協助偏癱病人落樓梯，護理人員應企喺邊？","options":["病人弱肢後方","病人健肢後方","病人弱肢前方","病人正後方"],"answer":"C","explanation":{"correct":"教材寫落樓梯時護理人員站於病人弱肢前方；上樓梯則站弱肢後方。 教材原文：「護理人員站於病人弱肢前方加以協助」","wrong":{"A":"弱肢後方係上樓梯嘅位置。","B":"教材寫弱肢。","D":"教材寫弱肢前方。"}}},{"id":"N127","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p102","question":"協助病人由床轉去輪椅前，床高度應點調？","options":["調至病人足跟著地","調至最高，方便發力","調至同輪椅扶手一樣高","唔使調，直接轉"],"answer":"A","explanation":{"correct":"教材寫檢查褲腳勿長過足踝，調較床高度至足跟著地。 教材原文：「調較床高度至足跟著地」","wrong":{"B":"教材寫足跟著地。","C":"教材寫足跟著地。","D":"教材要求調較床高度。"}}},{"id":"N128","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p103","question":"雙人前後式將病人由床搬上輪椅，通常邊個發號令？","options":["站於病人前方的護理員","病人自己","站於病人後方的護理員","在旁的護士"],"answer":"C","explanation":{"correct":"教材寫通常發號令者為站於病人後方的護理員。 教材原文：「通常發號令者為站於病人後方的護理員」","wrong":{"A":"教材寫後方。","B":"教材寫後方嘅護理員。","D":"教材寫後方嘅護理員。"}}},{"id":"N129","level":"正常","chapter":"（三）病人護理技巧｜體位擺放及扶抱轉移","page":"印刷 p106","question":"抬動病人嘅原則入面，邊個負責選擇抬動方法同發號施令？","options":["醫護支援人員","護士","病人家屬","物理治療師"],"answer":"B","explanation":{"correct":"教材寫由護士選擇出一種最恰當的抬動方法，並由護士發號施令。 教材原文：「由護士選擇出一種最恰當的抬動方法；並由護士發號施令」","wrong":{"A":"教材寫由護士。","C":"教材寫由護士。","D":"教材寫由護士。"}}},{"id":"N130","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p111","question":"量度助行器高度時，手肘應該彎曲幾多度？","options":["20° 至 30°","45° 至 60°","90°","手肘伸直，唔使彎曲"],"answer":"A","explanation":{"correct":"教材寫手持助行器具手把緊貼身旁，手肘約彎曲 20° 至 30°；手腕至地面距離即高度。 教材原文：「手肘約彎曲 20° 至 30°」","wrong":{"B":"教材寫 20° 至 30°。","C":"教材寫 20° 至 30°。","D":"開始步行向前一步時手肘先自然伸直。"}}},{"id":"N131","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p111","question":"協助用助行器嘅病人行街，護理人員應該企喺邊？","options":["病人健側，方便病人扶住","麻痺側、人多側、車道側","病人正前方，面向病人行","病人後面三步，唔好阻住"],"answer":"B","explanation":{"correct":"教材寫護理人員應站立於病人的麻痺側、人多側、車道側以便隨時照顧。 教材原文：「護理人員應站立於病人的麻痺側、人多側、車道側」","wrong":{"A":"教材寫麻痺側。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N132","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p110","question":"如要提起輪椅，應該握住邊個位置？","options":["座椅的支架","扶手","腳踏","手柄"],"answer":"A","explanation":{"correct":"教材寫切勿握扶手或腳踏提起，因可拆離；要提起輪椅，必須緊握座椅的支架。 教材原文：「必須緊握座椅的支架」","wrong":{"B":"扶手通常可拆離。","C":"腳踏通常可拆離。","D":"教材寫緊握座椅支架。"}}},{"id":"N133","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p113","question":"以下邊一個係教材接受嘅使用約束物品原因？","options":["病房人手不足","懲罰唔合作嘅病人","方便員工做其他工作","防止病人拔去鼻胃管"],"answer":"D","explanation":{"correct":"教材寫可基於防止傷害自己或他人、防止跌倒、防止拔去尿管、鼻胃管等原因使用。 教材原文：「防止病人拔去尿袋尿管、鼻胃管、尿片或衣服」","wrong":{"A":"教材寫不可為方便員工使用。","B":"教材寫絕對不可作懲罰。","C":"教材寫不可為方便員工使用。"}}},{"id":"N134","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p116","question":"以下邊項係使用約束物品可能引致嘅身體傷害？","options":["增強肌肉力量","減少壓瘡","改善大小便控制","纏頸而造成的呼吸窒息"],"answer":"D","explanation":{"correct":"教材列身體傷害：纏頸窒息、胸部受壓窒息、企圖鬆脫摔跌、皮膚創傷及潰瘍。 教材原文：「纏頸而造成的呼吸窒息」","wrong":{"A":"教材寫會令功能衰退。","B":"教材寫會增加壓瘡機會。","C":"教材寫可能引致失禁。"}}},{"id":"N135","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p117","question":"屬於 Cat. 1 嘅約束病人，最少幾耐要觀察一次？","options":["每半小時","每小時","每 4 小時","每 8 小時"],"answer":"A","explanation":{"correct":"教材表格註腳：Cat. 1 至少每半小時；Cat. 2 至少每小時；Cat. 3 每 4 小時或需要時更頻密。 教材原文：「for Cat. 1 patient, observe at least half-hourly」","wrong":{"B":"每小時係 Cat. 2。","C":"每 4 小時係 Cat. 3。","D":"教材冇咁寫。"}}},{"id":"N136","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p111","question":"病人用助行器開始步行之前，教材要求先做乜？","options":["即刻起步，免得病人企耐咗會攰","先行快幾步，試下助行器穩唔穩","讓病人站立片刻，冇頭暈先起步","先除咗鞋，赤腳行防止滑倒"],"answer":"C","explanation":{"correct":"教材寫讓病人站立片刻，沒有頭暈才起步。 教材原文：「讓病人站立片刻，沒有頭暈才起步」","wrong":{"A":"教材要求先站立片刻。","B":"教材冇咁寫。","D":"教材要求穿合適鞋履。"}}},{"id":"N137","level":"正常","chapter":"（三）病人護理技巧｜輔助器材及約束物品","page":"印刷 p115","question":"病人坐椅使用約束索帶，教材建議點綁？","options":["直接綁喺兩邊椅腳，打兩個結","圍住病人腰間，喺前面打死結","先繞兩邊扶手一圈，再喺椅背打結","綁喺輪椅腳踏，固定雙腳位置"],"answer":"C","explanation":{"correct":"教材寫坐著的綁法：索帶可先在兩邊扶手繞一圈，再在椅背打結。 教材原文：「索帶可先在兩邊扶手繞一圈，再在椅背打結」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N138","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p120","question":"壓瘡已經深至皮下組織或脂肪，但未到肌肉，屬於第幾級？","options":["第 1 級","第 2 級","第 4 級","第 3 級"],"answer":"D","explanation":{"correct":"教材寫第 3 級：皮膚層全部受傷，已經深至皮下組織或脂肪。 教材原文：「深至皮下組織或脂肪」","wrong":{"A":"第 1 級係發紅發腫。","B":"第 2 級係傷到真皮。","C":"第 4 級已達肌膜、肌肉甚至骨頭。"}}},{"id":"N139","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p119","question":"以下邊項係形成壓瘡嘅「內在因素」？","options":["皮膚長期潮濕，例如失禁","營養不良，尤其蛋白質不足","床單同皮膚之間有磨擦","局部皮膚長時間受壓"],"answer":"B","explanation":{"correct":"內在因素：營養不良（尤其蛋白質不足）、抵抗力不足、貧血老化、血液循環減慢、疾病。 教材原文：「尤其蛋白質不足，令皮膚的皮下組織變得脆弱」","wrong":{"A":"潮濕係外在因素。","C":"磨擦係外在因素。","D":"壓力係外在因素。"}}},{"id":"N140","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p119","question":"教材點講壓力同時間對壓瘡嘅影響？","options":["壓力細就唔會產生壓瘡，唔使擔心","要壓力大先會產生壓瘡，時間唔緊要","壓力小但壓得耐，都可以產生壓瘡","受壓時間長短對壓瘡冇影響"],"answer":"C","explanation":{"correct":"教材寫即使壓力小，但長時間的壓迫，也可以產生壓瘡。 教材原文：「即使壓力小，但長時間的壓迫，也可以產生壓瘡」","wrong":{"A":"教材寫壓力小都可以。","B":"教材寫壓力小都可以。","D":"教材列出受壓時間係因素之一。"}}},{"id":"N141","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p120","question":"病人側臥時，以下邊個係壓點？","options":["骶骨","肩胛骨","大粗隆","腳跟"],"answer":"C","explanation":{"correct":"教材圖示側臥壓點：踝部、膝關節內外側、大粗隆、肩峯突、耳朵。 教材原文：「側臥：踝部、膝關節內外側、大粗隆、肩峯突、耳朵」","wrong":{"A":"骶骨係平躺壓點。","B":"肩胛骨係平躺壓點。","D":"腳跟係平躺壓點。"}}},{"id":"N142","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p121","question":"為減少削力，使用便盆或便壺前應做乜？","options":["將便盆用暖水加熱，減少刺激","喺便盆邊緣塗潤膚膏潤滑","將床頭調至 90 度，方便坐上去","檢查邊緣有否裂開，可加軟墊"],"answer":"D","explanation":{"correct":"教材寫減少削力：使用便壺及便盆時，先檢查器皿邊緣有否裂開，亦可加上軟墊。 教材原文：「使用便壺及便盆時，應先檢查器皿邊緣有否裂開」","wrong":{"A":"教材冇咁寫。","B":"教材冇咁寫。","C":"教材寫避免床頭提高過 30°。"}}},{"id":"N143","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p124","question":"壓點護理時，以下邊個位置唔係教材列出要檢查嘅壓點？","options":["耳翼","額頭","股骨大粗隆","足跟"],"answer":"B","explanation":{"correct":"教材列出檢查壓點：耳翼、肩膊、手肘外側、股骨大粗隆、膝關節內外側、足踝及足跟。額頭係俯臥圖示壓點，唔喺呢張清單。 教材原文：「耳翼、肩膊、手肘外側、股骨大粗隆、膝關節之內外側、足踝及足跟」","wrong":{"A":"耳翼喺清單內。","C":"股骨大粗隆喺清單內。","D":"足跟喺清單內。"}}},{"id":"N144","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p130","question":"Patient Turning Chart 上寫「LL」，代表乜體位？","options":["右側臥","左側臥","仰臥","離床坐"],"answer":"B","explanation":{"correct":"教材範本：LL = Left Lateral 左側臥。 教材原文：「LL = Left Lateral 左側臥」","wrong":{"A":"右側臥係 RL。","C":"仰臥係 S（Supine）。","D":"離床坐係 O（Sit Out）。"}}},{"id":"N145","level":"正常","chapter":"（三）病人護理技巧｜皮膚及壓瘡","page":"印刷 p128","question":"「轉換體位」實務試入面，替病人套手肘及腳跟護墊有咩要求？","options":["護墊要套喺膝頭","只套一邊就得","護墊須覆蓋手肘或足跟","護墊要綁到最緊"],"answer":"C","explanation":{"correct":"教材 2.9 寫替病人雙肘套上手肘護墊、雙腳套上腳跟護墊（護墊須覆蓋手肘或足跟）。 教材原文：「護墊須覆蓋手肘或足跟」","wrong":{"A":"教材寫手肘及足跟。","B":"教材寫雙肘雙腳。","D":"教材冇咁寫。"}}},{"id":"N146","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"從未患過疥瘡嘅人，潛伏期大約係幾耐？","options":["1-4 天","7 至 10 日","2-6 星期","超過三個月"],"answer":"C","explanation":{"correct":"教材寫從未患過的人潛伏期約 2-6 星期；曾感染過的人病徵則早在 1-4 天內出現。 教材原文：「潛伏期約為 2-6 星期」","wrong":{"A":"1-4 天係曾感染過嘅人。","B":"7 至 10 日係頭蝨卵孵化時間。","D":"教材冇咁寫。"}}},{"id":"N147","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"使用 25% 疥瘡乳劑（BBE），應該由邊度開始塗？","options":["由頭頂開始塗遍全身","只塗有紅斑嘅位置","只塗手同腳","由頸部以下開始塗到腳趾"],"answer":"D","explanation":{"correct":"教材寫從頸部以下開始塗抹直到腳趾，頭部除外。 教材原文：「從頸部以下開始塗抹直到腳趾」","wrong":{"A":"教材寫頭部除外。","B":"教材寫頸部以下塗遍全身。","C":"教材寫頸部以下塗遍全身。"}}},{"id":"N148","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p131","question":"第一次塗完疥瘡乳劑，12 小時後要點做？","options":["沖涼洗走乳劑","再塗一次，但無需沐浴","停用，觀察反應","再塗兩次加強效果"],"answer":"B","explanation":{"correct":"教材寫 12 小時後重複塗乳劑一次，但無需沐浴；再過 12 小時才用熱水及肥皂沐浴。 教材原文：「12 小時後，重複塗乳劑一次，但無需沐浴」","wrong":{"A":"沐浴喺再過 12 小時先做。","C":"教材寫再塗一次。","D":"教材寫乳劑只適宜用兩次。"}}},{"id":"N149","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p132","question":"疥瘡病人治療後幾個星期仍然覺得痕，教材點講？","options":["代表治療失敗，要再塗乳劑","代表傳染咗其他人","要即刻轉用頭蝨藥","並不表示疥蟲仍然活著"],"answer":"D","explanation":{"correct":"教材寫患者可能連續幾星期後仍會覺得皮膚搔癢，這並不表示疥蟲仍然活著；不可私下塗藥。 教材原文：「這並不表示疥蟲仍然活著」","wrong":{"A":"教材寫不可因搔癢而私下塗藥。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N150","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p132","question":"同疥瘡病人有親密接觸嘅家人，但冇徵狀，應點做？","options":["唔使理，有徵狀先處理","只需要勤洗手","隔離兩星期觀察","同時一併接受治療"],"answer":"D","explanation":{"correct":"教材寫與患者有親密接觸的人士，即使沒有徵狀，亦應同時一併接受治療。 教材原文：「即使沒有疥瘡之徵狀，亦應同時一併接受治療」","wrong":{"A":"教材寫即使冇徵狀都要治療。","B":"教材要求一併治療。","C":"教材冇咁寫。"}}},{"id":"N151","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p144","question":"塗咗疥瘡乳劑之後去洗手，教材要求點？","options":["洗手後唔使再塗","整日唔可以洗手","洗手後改塗止癢膏","洗手後重新塗乳劑於雙手"],"answer":"D","explanation":{"correct":"教材寫由於乳劑會被水份洗去，所以洗手後須重新塗乳劑於雙手。 教材原文：「洗手後須重新塗乳劑於雙手」","wrong":{"A":"乳劑會被洗去，要重塗。","B":"教材冇咁寫。","C":"教材冇咁寫。"}}},{"id":"N152","level":"正常","chapter":"（三）病人護理技巧｜疥瘡","page":"印刷 p132","question":"疥瘡病人用過嘅床褥、棉被、地氈，一般點處理？","options":["用 1:49 漂白水浸","放烈日下曝曬六至八小時","放入雪櫃冷藏","用熱水煮十分鐘"],"answer":"B","explanation":{"correct":"教材寫可將床褥、棉被、絨梳化、地氈等放置於烈日下曝曬六至八個小時。 教材原文：「放置於烈日下曝曬六至八個小時」","wrong":{"A":"漂白水浸係頭蝨病人用品處理。","C":"教材冇咁寫。","D":"熱水煮係衣物處理方法。"}}},{"id":"N153","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p137","question":"病人有一次小量、黃色、軟身大便，記錄應寫？","options":["BSS (M) x 1","YHS (L) x 1","BNO","YSS (S) x 1"],"answer":"D","explanation":{"correct":"教材例子：一次小量黃色軟身大便：YSS (S) x 1。 教材原文：「一次小量黃色軟身大便：YSS (S) x 1」","wrong":{"A":"B 係啡色、M 係中量。","B":"H 係硬、L 係大量。","C":"BNO 係沒有大便。"}}},{"id":"N154","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p137","question":"病人濕咗一條尿片，中量，記錄應寫？","options":["WN (M) x 1","PU (M) x 1","WN (L) x 1","N.P.U."],"answer":"A","explanation":{"correct":"教材例子：濕了尿片一條，中量：Wet Napkin (M) x 1 / WN (M) x 1。 教材原文：「濕了尿片一條，中量：Wet Napkin (M) x 1」","wrong":{"B":"PU 係病人如廁（Pass Urine）。","C":"L 係大量。","D":"N.P.U. 係沒有排小便。"}}},{"id":"N155","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p141","question":"記錄寫「B.N.E.」，下次量小便時要注意乜？","options":["要加回前量","要減回前量","唔使理，照記","要重新換尿袋"],"answer":"B","explanation":{"correct":"教材寫 B.N.E.（Bag Not Empty）即未將尿袋內小便清倒，下次量小便時要減回前量。 教材原文：「未將尿袋內小便清倒，下次量小便時要減回前量」","wrong":{"A":"教材寫減回前量。","C":"教材寫要減回前量。","D":"教材冇咁寫。"}}},{"id":"N156","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p136","question":"以下邊個入量通常由護士負責記錄，唔係醫護支援人員？","options":["口服清水","湯","靜脈注射","粥"],"answer":"C","explanation":{"correct":"教材寫人工哺飼及靜脈注射通常由護士負責記錄。 教材原文：「人工哺飼及靜脈注射通常由護士負責記錄」","wrong":{"A":"口服水份要記錄，但冇講由護士負責。","B":"同上。","D":"同上。"}}},{"id":"N157","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p136","question":"教材話準確記錄出入量對邊類病人特別重要？","options":["心臟衰竭、腎衰竭及尿崩病人","白內障手術後嘅病人","正在塗疥瘡乳劑嘅病人","正在用除蝨藥嘅頭蝨病人"],"answer":"A","explanation":{"correct":"教材註明水份進出量的控制對心臟衰竭、腎衰竭及尿崩等病人非常重要。 教材原文：「心臟衰竭、腎衰竭及尿崩等病人」","wrong":{"B":"教材冇咁寫。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N158","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p134","question":"病房人手唔夠，可唔可以寫喺護理記錄度？","options":["不要寫醫護或管理人員問題","應該寫，方便管理層知道","可以寫，但要用鉛筆寫","可以喺後補記錄入面寫"],"answer":"A","explanation":{"correct":"教材寫不要寫醫護人員、管理人員的問題，例如人手不夠。 教材原文：「不要寫醫護人員、管理人員的問題，例如人手不夠」","wrong":{"B":"教材寫不要寫。","C":"教材寫用鋼筆或黑原子筆。","D":"教材冇咁寫。"}}},{"id":"N159","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p134","question":"同事未做嘅工作，可唔可以預先記錄同簽名？","options":["可以，咁樣可以慳返時間","不可，未做嘅工作唔好預先簽","可以，但事後要記得補做","可以，但要由護士預先簽"],"answer":"B","explanation":{"correct":"教材寫未做工作不要簽名或預先記錄。 教材原文：「未做工作不要簽名或預先記錄」","wrong":{"A":"教材寫不可。","C":"教材寫不可。","D":"教材冇咁寫。"}}},{"id":"N160","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p135","question":"病人意外報告最後由護士或病房經理經乜系統向醫管局報告？","options":["AIRS 早期事故通報系統","Intake and Output Chart","Patient Turning Chart","危險藥物記錄冊"],"answer":"A","explanation":{"correct":"教材寫護士／病房經理會將陳述經早期事故通報系統（AIRS）向醫院管理局報告。 教材原文：「早期事故通報系統（Advanced Incident Reporting System – AIRS）」","wrong":{"B":"出入量表係記錄出入量。","C":"轉身記錄表係記錄體位。","D":"危險藥物記錄冊係核對危險藥物。"}}},{"id":"N161","level":"正常","chapter":"（三）病人護理技巧｜護理紀錄及出入量","page":"印刷 p141","question":"嘔吐物係小量啡色咖啡渣樣胃液，記錄應寫？","options":["C.G.F.(S)x1","Y.F.(S)x1","G.F.(S)x1","U.D. Food(S)x1"],"answer":"A","explanation":{"correct":"教材寫小量啡色（咖啡渣樣）水狀胃液一次：Coffee Ground Fluid C.G.F.(S)x1。 教材原文：「Coffee Ground Fluid C.G.F.(S)x1」","wrong":{"B":"Y.F. 係黃色胃液。","C":"G.F. 係綠色胃液。","D":"U.D. Food 係未消化食物。"}}},{"id":"N162","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p142","question":"為成人滴耳藥水，耳朵應該點拉？","options":["拉往上及後","拉往下方","拉往前","唔使拉"],"answer":"A","explanation":{"correct":"教材寫用食指和拇指把耳朵拉往上及後；若病人是兒童，則拉往下方。 教材原文：「用食指和拇指把耳朵拉往上及後」","wrong":{"B":"拉往下方係兒童嘅做法。","C":"教材冇咁寫。","D":"教材要求拉直外耳道管。"}}},{"id":"N163","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p143","question":"病人同時要用眼藥水同眼藥膏，次序係？","options":["先塗眼藥膏，即刻再滴眼藥水","兩樣混埋一齊用","先塗眼藥膏，數分鐘後滴眼藥水","先滴眼藥水，數分鐘後才塗眼藥膏"],"answer":"D","explanation":{"correct":"教材寫如同時使用眼藥膏及眼藥水，應先滴眼藥水，數分鐘後才塗眼藥膏。 教材原文：「應先滴眼藥水，數分鐘後才塗眼藥膏」","wrong":{"A":"次序相反。","B":"教材冇咁寫。","C":"次序相反。"}}},{"id":"N164","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p143","question":"滴完眼藥水之後，點樣防止藥水從眼中流出？","options":["閉眼，輕壓鼻樑數分鐘","用手輕擦眼皮，令藥水均勻","用清水輕輕沖眼一次","即刻張大眼，向上望一陣"],"answer":"A","explanation":{"correct":"教材寫指示病人切勿用手擦眼，閉上眼睛，眨眼數次，用手指輕壓鼻樑數分鐘。 教材原文：「用手指輕壓鼻樑數分鐘」","wrong":{"B":"教材寫切勿用手擦眼。","C":"教材冇咁寫。","D":"教材冇咁寫。"}}},{"id":"N165","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p144","question":"眼藥水或藥膏首次使用後，幾耐未用完就要棄掉？","options":["一星期","一個月","三個月","到包裝上嘅有效日期先棄"],"answer":"B","explanation":{"correct":"教材寫在首次使用後一個月仍未將藥水／藥膏用完，也要把它棄掉。 教材原文：「在首次使用後一個月仍未將藥水／藥膏用完，也要把它棄掉」","wrong":{"A":"教材寫一個月。","C":"教材寫一個月。","D":"教材寫開咗一個月就要棄。"}}},{"id":"N166","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p145","question":"危險藥物櫃嘅鎖匙應點保管？","options":["放喺藥櫃隔離抽屜","由主管或護士隨身攜帶","交俾醫護支援人員保管","掛喺護士站牆上"],"answer":"B","explanation":{"correct":"教材寫危險藥物櫃需有兩鎖，鎖匙由主管或護士隨身攜帶，不可放於抽屜內。 教材原文：「鎖匙由主管或護士隨身攜帶，不可放於抽屜內」","wrong":{"A":"教材寫不可放於抽屜內。","C":"教材寫由主管或護士。","D":"教材寫隨身攜帶。"}}},{"id":"N167","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p145","question":"藥櫃有幾瓶相同嘅藥，應該先用邊瓶？","options":["最新買嘅一瓶","最近期限的一瓶","最大瓶嘅一瓶","放喺最前面嘅一瓶"],"answer":"B","explanation":{"correct":"教材寫若有多瓶相同之藥物，應用最近期限之一瓶。 教材原文：「若有多瓶相同之藥物，應用最近期限之一瓶」","wrong":{"A":"教材寫最近期限。","C":"教材寫最近期限。","D":"教材寫最近期限。"}}},{"id":"N168","level":"正常","chapter":"（四）藥物認識｜藥物認識","page":"印刷 p147","question":"醫生處方寫 ation":{"correct":"正確答案係「糖及蛋白」。 教材原文：「驗小便（糖及蛋白」","wrong":{"A":"教材呢頁寫嘅係「糖及蛋白」。","B":"教材呢頁寫嘅係「糖及蛋白」。","D":"教材呢頁寫嘅係「糖及蛋白」。"}}},{"id":"NN194","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p70","question":"手術前一天清潔腸道，可以用邊個方法？","options":["飲瀉劑或用灌腸劑","多吃高纖維的蔬果","增加運動及飲奶","按摩腹部及熱敷"],"answer":"A","explanation":{"correct":"正確答案係「飲瀉劑或用灌腸劑」。 教材原文：「清潔腸道（飲瀉劑，灌腸劑）」","wrong":{"B":"教材呢頁寫嘅係「飲瀉劑或用灌腸劑」。","C":"教材呢頁寫嘅係「飲瀉劑或用灌腸劑」。","D":"教材呢頁寫嘅係「飲瀉劑或用灌腸劑」。"}}},{"id":"NN195","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p70","question":"以下邊項屬於「手術前一天」按指示進行嘅準備？","options":["穿上手術袍及戴手術帽","徹底洗澡及洗頭","轉臥到手術室推床","量度術後生命表徵"],"answer":"B","explanation":{"correct":"正確答案係「徹底洗澡及洗頭」。 教材原文：「徹底洗澡及洗頭」","wrong":{"A":"呢項係手術日。","C":"呢項係手術日。","D":"教材呢頁寫嘅係「徹底洗澡及洗頭」。"}}},{"id":"NN196","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"手術日送病人去手術室前，要核對以下邊項？","options":["已進食足夠早餐","已安排出院交通","已飲用足夠清水","已簽妥手術同意書"],"answer":"D","explanation":{"correct":"正確答案係「已簽妥手術同意書」。 教材原文：「核對病人姓名、手鐲、已禁食、明白所做之手術及已簽妥同意書」","wrong":{"A":"教材呢頁寫嘅係「已簽妥手術同意書」。","B":"教材呢頁寫嘅係「已簽妥手術同意書」。","C":"教材呢頁寫嘅係「已簽妥手術同意書」。"}}},{"id":"NN197","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"全身麻醉術後病人，醫護支援人員嘅角色係乜？","options":["獨自決定何時進食","由護士處理，從旁協助","獨自接送返回病房","獨自處理引流傷口"],"answer":"B","explanation":{"correct":"正確答案係「由護士處理，從旁協助」。 教材原文：「則需要護士處理，醫護支援人員則從旁協助」","wrong":{"A":"教材呢頁寫嘅係「由護士處理，從旁協助」。","C":"教材呢頁寫嘅係「由護士處理，從旁協助」。","D":"教材呢頁寫嘅係「由護士處理，從旁協助」。"}}},{"id":"NN198","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"喺復甦房接病人時發現有異常，應該點做？","options":["即時提出及通知病房護士","記錄低等巡房時才報告","由病人自己告知醫生","先送回病房再作觀察"],"answer":"A","explanation":{"correct":"正確答案係「即時提出及通知病房護士」。 教材原文：「如有任何異常的情況，需即時提出及通知病房護士」","wrong":{"B":"教材呢頁寫嘅係「即時提出及通知病房護士」。","C":"教材呢頁寫嘅係「即時提出及通知病房護士」。","D":"教材呢頁寫嘅係「即時提出及通知病房護士」。"}}},{"id":"NN199","level":"正常","chapter":"（三）病人護理技巧｜外科病人（手術前後）","page":"印刷 p71","question":"喺復甦房接術後病人，要觀察以下邊項？","options":["牙齒、頭髮、指甲及皮膚色素","體重、身高、視力及聽力","飲食喜好、信仰及家庭背景","靜脈點滴、傷口包紮、引流及尿袋"],"answer":"D", const C=[{"id":"2A","ch":"（二）起居照顧技巧","title":"基本照顧護理原則","pages":"p1–4","points":["護理目的：給予整體護理（生理、心理、社交、心靈）；提供廣泛護理服務（預防疾病、減少痛苦、協助康復及從速自立、協助無法康復者安祥離世）；協調其他醫療工作者（p1）","馬思樓（Maslow，1943）五層基本需要，由底至頂：生理 → 安全感 → 相愛及被愛 → 自尊或自我價值 → 自我實現（p1）","人患病時由對社會有貢獻的人轉為受他人照顧的人，個人尊嚴受威脅，所以要尊重病人並讓病人參與護理計劃（p2）","Virginia Henderson（1966）提出 14 項基本護理要素，例如呼吸、飲食、排泄、睡眠與休息、維持體溫、避免發生危險、信仰、娛樂、學習（p2）","護理過程五步循環：評估 → 確立問題 → 計劃 → 執行 → 檢討（p3）","計劃時先解決危及生命的問題；措施要在醫護支援人員能力範圍之內（p3）","護理原則 6 項：準確度、安全度、透徹度、高效率、有效度、舒適度（p4）","護理前：查看記錄、核對病人、評估、準備；護理後：安頓病人、物品及環境處理、記錄、報告、再次觀察病人（p4）"],"terms":[["馬思樓需要層次（由底至頂）","生理 → 安全感 → 相愛及被愛 → 自尊或自我價值 → 自我實現","p1"],["自我實現的需要","當生理需要滿足，且感到安全、被尊重及被愛，就會有自我實現的念頭","p2"],["Virginia Henderson","1966 年提出 14 項基本護理要素","p2"],["護理過程五步驟","評估 → 確立問題 → 計劃 → 執行 → 檢討（循環）","p3"],["護理原則","準確度、安全度、透徹度、高效率、有效度、舒適度","p4"],["核對病人","清晰地詢問病人的姓名，耐心等待回應","p4"]]},{"id":"2B","ch":"（二）起居照顧技巧","title":"日常梳洗及沐浴","pages":"p5–13","points":["日常梳洗包括洗臉、漱口、更衣、如廁、梳頭、剃鬚；多鼓勵自助（p5）","缺乏個人衞生會引起感染、壓瘡、潰瘍、體臭、影響自尊心等（p5）","梳洗程序由協助病人使用便盆或便壺開始，最後作適當紀錄及報告（p6）","剃鬚：先檢查電鬚刨是否清潔；讓病人自行剃鬚，有需要時協助（p6）","沐浴目的包括清潔皮膚、觀察身體有否異常（如皮膚病、疤痕、損傷、壓瘡）、與病人交談表示關懷、增進血液循環（p7）","沐浴最佳時間：避開飯前／飯後一小時，或在排泄之後（p7）","最適當水溫 40°C；高血壓或心臟病病人宜 37°C–38°C（p7）","淋浴（花灑浴）適合清醒但行動不便的病人；床上浴適合危重病人，減少不必要的轉身（p7–8）","淋浴開水：先開冷水，後開熱水；關水：先關熱水，後關冷水（p7–8）","中風病人穿褲時，應先助病人穿弱腳的褲管（p8）","床上浴水溫維持約 40°C；清潔胸腹部後如水已污染要更換；盡量不暴露病人身體（p9）"],"exam":["★ 核對（讀出）病人手鈪及牌板的姓名、身份證號碼或 HN No.（p10）","★ 轉身準備：轉向左側臥時，右足放在左足上（p11）","★ 放回洗澡車腳踏；先鬆開車轆再推，入浴室後鎖上（p11）","★ 脫褲前確保病人雙腳踏地、腳踏已收起（p12）","★ 先開冷水，後開熱水，每次沖身前都要試水溫；沖身後先關熱水，後關冷水（p12）","★ 轉移前及離開病人前須鎖上洗澡車椅轆（p13）","★★ 過程中不可令病人跌到地上（p13）"],"terms":[["沐浴最適當水溫","40°C","p7"],["高血壓／心臟病病人沐浴水溫","37°C–38°C","p7"],["沐浴最佳時間","避開飯前／飯後的一小時；或在排泄之後","p7"],["淋浴（Shower Bath）","又稱花灑浴，適合清醒但行動不便的病人","p7"],["床上浴（Bed Bath）","適合危重病人，減少病人不必要的轉身","p8"],["淋浴開關水次序","開：先冷水後熱水；關：先熱水後冷水","p7–8"],["中風病人穿褲","先穿弱腳的褲管","p8"]]},{"id":"2C","ch":"（二）起居照顧技巧","title":"床上洗頭及頭蝨","pages":"p14–16","points":["盡量安排病人於浴室沐浴時洗頭；情況不許可才進行床上洗頭（p14）","床上洗頭用棉花球堵塞外耳道防入水；洗頭盆一端用細枕頭承高少許（p14）","頭蝨只以人類為宿主；患者多為幼兒和學前小童（p14）","頭蝨主要經直接毛髮接觸傳播；共用帽子、梳子而受傳染較罕見（p14）","卵 7 至 10 日孵化；蛹至成蟲 7 至 13 日；成蟲壽命約 28 至 30 日，離開人體約兩天便死亡（p14）","蝨卵：橢圓形、色澤光滑、不易脫落；頭皮：薄片狀、色澤暗淡、容易鬆脫（p15）","檢查頭蝨用密齒梳（篦），發現蝨狀物用棉花球醮火酒抹去（p15）","使用除蝨藥前無須洗頭，頭髮乾效果最好；12 小時後沖洗（p16）","不能丟棄的床單衣物放入 1:49 漂白水浸約 30 分鐘（p15–16）","多霸除蝨液易燃，勿用風筒；每週一次，不得連續使用超過三個星期；六個月以下幼嬰禁用（除非在監督下）（p16）"],"terms":[["頭蝨主要傳播途徑","與患者直接毛髮接觸","p14"],["頭蝨卵孵化時間","7 至 10 日","p14"],["頭蝨成蟲離開人體","大概兩天便會死亡","p14"],["蝨卵 vs 頭皮","蝨卵橢圓、光滑、不易脫落；頭皮薄片狀、暗淡、易鬆脫","p15"],["多霸除蝨藥液","Derbac Lotion – Malathion；易燃，勿用風筒；每週一次，最多連續三個星期","p15–16"],["除蝨藥塗後幾耐沖洗","12 小時","p16"],["除蝨用消毒溶液","1:49 稀釋漂白水，浸 30 分鐘","p15–16"]]},{"id":"2D","ch":"（二）起居照顧技巧","title":"口腔及假牙護理","pages":"p17–23","points":["口腔清潔目的包括除去口臭、防止口腔成傳染源頭、增進食慾、預防潰瘍、增強自信心（p17）","缺乏口腔護理可引起局部性問題（牙周病、舌炎、腮腺炎）及擴散性問題（胃炎、咽喉炎、氣管炎、肺炎、中耳炎）（p17）","用較軟性牙刷；可咀嚼較硬食物如生果增強牙肉健康；多飲開水（p17）","特別需要口腔護理：失去知覺、厭食、用口呼吸、不可用口進食、管道餵飼、脫水、不能自助等（p18）","使用人工呼吸機、Bipap 呼吸機的病人要由護士負責口腔護理（p18）","每支口腔清潔專用棉棒只可抹一次，不可過濕滴水或過乾（p18）","清洗範圍：牙齒外、齒面、內側、牙齦、舌頭、上顎、下顎、面頰內側；之後塗甘油或潤唇膏（p18）","用血管鉗時要用紗布包好鉗咀，以防弄傷牙肉（p19）","假牙：睡覺前一定要除去；不要用熱水浸；不要自行調整形狀（p19）"],"exam":["★ 核對病人手鈪及牌板（p20）","★ 穿衣先穿患側，然後穿健側；用好手按輪椅椅柄（p21）","★ 協助病人端坐、放回腳踏、扣上輪椅安全帶（p21）","★ 清潔範圍包括面頰內側；每支棉棒只抹一次（p22）","★ 轉移前、到達後及離開前鎖上輪椅剎掣（p22）","★★ 過程中不可令病人跌到地上（p23）"],"terms":[["需由護士負責口腔護理","使用人工呼吸機、Bipap 呼吸機的病人","p18"],["口腔清潔專用棉棒","每支只可抹拭一次；不可過濕滴水或過乾","p18"],["清潔口腔後塗甚麼","甘油（Glycerine）或潤唇膏","p18"],["漱口水","Thymol Gargle（遵醫囑）","p17"],["假牙睡前","一定要除去","p19"],["假牙浸泡","用清水，不要用熱水","p19"]]},{"id":"2E","ch":"（二）起居照顧技巧","title":"手足清潔及協助如廁","pages":"p24–27","points":["手足清潔目的：清潔舒適、保暖促進血液循環、預防發炎或感染、預防長指甲抓傷皮膚（p24）","需要手足護理：營養不良、關節炎、糖尿病、不能自助、昏迷病人（p24）","如廁方式視乎病人情況：可扶到廁所；用便椅／輪椅；或給予便盆／便壺（p25）","用便椅前確保病床及便椅已上鎖固定（p25）","接受髖關節成形術（AMA）或全髖關節置換（THR）的病人，要用扁身便盆防髖關節脫位（p26）","男病人用便盆時，可先給便壺，然後給便盆（p26）","不可讓病人使用便盆過久，以免引起壓瘡（p26）","替病人抹拭時由前向後；傾倒時觀察大小便，異常要留標本、記錄及通知護士（p26）","記錄大便：時間、色、質、量及異常（p26）"],"terms":[["扁身便盆","AMA 或 THR 術後病人用，防髖關節脫位","p26"],["AMA","Austin Moore Arthroplasty 髖關節成形術","p26"],["THR","Total Hip Replacement 全髖關節置換","p26"],["男病人用便盆","可先給便壺，然後給便盆","p26"],["便盆用太耐","會引起壓瘡","p26"]]},{"id":"2F","ch":"（二）起居照顧技巧","title":"失禁處理","pages":"p27–34","points":["小便失禁：無法用意志控制排尿；大便失禁：肛門喪失正常功能（p27）","小便失禁成因：盤骨底肌肉鬆弛（腹壓增加時漏尿，女性居多）、膀胱肌肉過度緊張、神經系統受影響（中風、腦退化、脊髓受損）、利尿藥等（p27）","大便失禁成因：括約肌損傷（分娩、肛門手術）、神經源性（中風、糖尿病）、濫用輕瀉劑等（p27）","護理目標：皮膚乾爽清潔、防皮膚破損、預防壓瘡、預防尿道感染、令病人舒適（p27）","清理臀部由肛門抹向後，每塊濕棉花只抹一次（p28–29）","女病人：由前向後抹，先中間後兩側；男病人：先抹尿道口再打圈清潔龜頭，之後將包皮推回原位（p28）","除褲先除健側，再除患側（p28）","皮膚有紅可按護士指示塗防水膏或鋅氧膏；皮膚破損則不可塗防水膏，並通知護士（p29）","預防小便失禁：白天充分飲水，晚上減量；有便意馬上如廁；選易脫衣服（p29）"],"exam":["★ 女病人由前向後抹，每塊棉花只抹一次，不可沾污尿道口（p31）","★ 男病人先抹尿道口再打圈清潔龜頭（p31）","★ 轉身準備：轉向左側臥，右足放在左足上（p31）","★ 包上乾淨新尿片（p32）","★ 穿褲先穿患側，然後穿健側，褲頭高於臀部（p32）","★ 如實記錄於 Intake and Output Chart；臀部有紅及大便有血要報告上級（p33）"],"terms":[["盤骨底肌肉鬆弛","腹壓增加時尿液不由自主流出，女性居多","p27"],["清潔臀部方向","由肛門抹向後，每塊濕棉花只抹一次","p28"],["除褲次序（偏癱）","先除健側，再除患側","p28"],["穿褲次序（偏癱）","先穿患側，然後穿健側","p32"],["皮膚破損時","不可塗防水膏，要通知護士","p29"],["預防小便失禁飲水","白天充分飲水，晚上減量","p29"]]},{"id":"2G","ch":"（二）起居照顧技巧","title":"造口護理","pages":"p35–41","points":["大腸負責吸收水份；渣滓經直腸由肛門排出（p35）","造口呈鮮紅色，由黏膜包裹，多為圓形或橢圓形（p36）","迴腸造口：排泄物較呈液狀，含鹽及消化酵素多，易損皮膚；開口通常在腹部右邊（p36–37）","降結腸／乙狀結腸造口：糞便與正常排泄一樣；開口在身體左邊（p36）","迴腸造口初期每天輸出 1500–1800 毫升，回復進食後 500–800 毫升（p37）","造口俗稱「假肛」；病者冇排糞感覺，不能控制（p38）","換袋宜在餐前、進餐後兩小時或睡前（p38）","造口周圍最好留三毫米空間（約 3 毫米或 1/8 吋）（p39、p41）","迴腸造口用開口袋；結腸造口用密口袋；凸面護膚板適合縮入造口（p39）","術後一至兩星期開始收縮，約一至兩個月停止（p41）","切勿用消毒藥水清潔造口周圍；顏色轉藍或黑要立即通知醫生（p41）","開口袋三份一滿就要清倒（p41）"],"terms":[["造口正常顏色","鮮紅色，有如咀唇內部","p36、p41"],["迴腸造口位置","通常在腹部右邊","p36"],["降結腸／乙狀結腸造口位置","身體左邊","p36"],["造口周圍空間","約 3 毫米（1/8 吋）","p39、p41"],["開口袋","適合迴腸造口；三份一滿時清倒","p39、p41"],["密口袋","適合結腸造口","p39"],["凸面護膚板","適合縮入造口","p39"],["碳片","吸去腸道排出的氣體","p40"],["防漏膏","填平不平滑或有摺痕的皮膚，防滲漏","p39"]]},{"id":"2H","ch":"（二）起居照顧技巧","title":"尿套及導尿管","pages":"p42–45","points":["尿套（Paul's Tube）對象：小便失禁或滴漏之男病人（p42）","尿袋要低於膀胱水平，防尿液倒流（p42–43）","每四小時或注滿三分二清倒尿袋；清倒後用酒精抹出口（p42–43）","尿套每天更換；陰莖皮膚有紅疹或水泡便不應再套（p42）","導尿管目的：排空膀胱、急性尿瀦留、手術前後、預防傷口感染、量度尿量（p42–43）","每小時排出量 < 30c.c 要報告護士（p43）","留置導尿管通常 7–14 日更換；矽膠導尿管可四星期才換（p43）","間歇性導尿管沒有水囊，通常用白頭 FG12（p43）","14FG 即外圓周 14mm；成人一般 12、14 或 16FG；小童 8、10FG（p43）","轉身時用夾子夾緊尿袋喉，完成後要放夾（p43–44）","鼓勵病人每日飲 1500–2000 毫升；導尿管用膠布固定於大腿內側（p44）","導尿系統為閉合式；每個病人要有個別量杯（p44）","每日用希必定（Hibitane）清潔尿道口（p44）"],"terms":[["尿套 Paul's Tube","適用於小便失禁或滴漏之男病人","p42"],["清倒尿袋","每四小時或注滿三分二","p42–43"],["排尿量要報告","每小時 < 30c.c","p43"],["留置導尿管更換","7–14 日；矽膠可四星期","p43"],["14FG","外面圓周為 14mm","p43"],["間歇性導尿管","沒有水囊，通常白頭 FG12","p43"],["導尿病人飲水量","每日 1500–2000 毫升","p44"],["希必定 Hibitane","清潔尿道口及附近皮膚","p44"]]},{"id":"2I","ch":"（二）起居照顧技巧","title":"七大營養素","pages":"p46–50","points":["七大要素：碳水化合物、蛋白質、脂肪、維他命、礦物質、纖維素、水分（p46–50）","碳水化合物為細胞提供能量；過剩糖分以肝醣儲存在肝及肌肉，再多就轉化成脂肪（p46）","蛋白質助長發育、修補細胞、製造激素、傷口復原、與鐵質形成血紅蛋白（p46）","高密度脂蛋白帶走血管壁膽固醇；低密度脂蛋白易黏附血管壁令血管變窄（p46）","維他命 A 缺乏：夜盲症；B1 缺乏：腳氣病；C 缺乏：牙肉出血、壞血病、傷口癒合慢；D 缺乏：佝僂病；K：凝血（p47–48）","鈉過高引致血壓高；鉀維持心律；鈣製造骨骼牙齒；鐵製造血液；碘維持甲狀腺；鋅幫助傷口復原（p48–49）","纖維素預防便秘及大腸癌、穩定血糖、降低膽固醇（p49）","人體水分約是體重的百分之七十五（p50）"],"terms":[["維他命 A 缺乏","夜盲症、眼球乾燥、皮膚乾燥","p47"],["維他命 B1 缺乏","情緒低落、腸胃不適、腳氣病、手腳麻木","p47"],["維他命 C 缺乏","牙肉出血、傷口癒合緩慢、皮下出血；防止壞血病","p48"],["維他命 D 缺乏","佝僂病；幫助吸收鈣質","p48"],["維他命 K","凝血作用","p48"],["碘缺乏","甲狀腺腫大；智力及發育遲緩","p49"],["鋅","幫助傷口復原；缺乏時味覺敏銳度降低","p49"],["高密度脂蛋白","帶走血管壁上的膽固醇，有助預防心血管病","p46"],["人體水分","約體重的 75%","p50"]]},{"id":"2J","ch":"（二）起居照顧技巧","title":"均衡飲食及膳食種類","pages":"p51–57","points":["健康飲食原則：少鹽、少糖、少脂肪、多高纖、保持理想體重、均衡飲食（p51）","日日二加三：每天最少兩份水果及三份蔬菜（p51）","一份水果約等於一個中型水果（如橙、蘋果）；純果汁四分三杯（180 毫升）以上都只當一份（p51）","三低一高：每日脂肪 10–13 茶匙油；鈉不多於 2400 毫克；糖不多於 4–6 茶匙；纖維 20–30 克（p52）","飲食金字塔：穀類吃最多（3–5 碗）；蔬菜吃多些；肉奶吃適量；油鹽糖吃最少；每天 6 至 8 杯流質（p52）","營養不良症狀：體重減輕、皮膚脆薄乾燥、毛髮易脫落、抵抗力減弱等（p53）","特別餐：糖尿餐、低蛋白餐（腎、肝病人）、高卡路里高蛋白餐、低鹽餐（心臟病、水腫、腎病）、少渣餐、低普林餐（痛風）、低脂肪餐、胃餐、低膽固醇餐（p54–55）","可耐受飲食（DAT）不代表任何特定餐類（p55）","N.P.O. 不准飲食；空肚血糖最少禁食八小時；空肚膽固醇最少十二小時（p57）","限飲一公升流質適用於腎病、心臟病病人（p57）"],"terms":[["日日二加三","每天最少兩份水果、三份蔬菜","p51"],["每日鈉上限","不多於 2400 毫克（每餐不多於 800 毫克）","p52"],["每日纖維","20–30 克","p52"],["每天流質","6 至 8 杯","p52"],["低普林餐","痛風、血尿酸高病人；避免內臟、濃肉湯等","p54"],["低蛋白餐","腎、肝病人適用","p54"],["低鹽餐","心臟病、水腫、腎病人","p54"],["胃餐","胃潰瘍病人；免刺激性食物、咖啡酒精","p55"],["DAT","Diet As Tolerated 可耐受飲食，不代表特定餐類","p55"],["N.P.O.","Nil By Mouth / Nil Per Oral 不准飲食","p57"],["空肚血糖","最少禁食八小時","p57"],["空肚膽固醇","最少禁食十二小時","p57"]]},{"id":"2K","ch":"（二）起居照顧技巧","title":"餵食技巧","pages":"p56–63","points":["餵食前了解病人吞嚥及咳嗽能力；要坐起，不可躺臥（p56）","護理人員要與病人同一高度；每次一茶匙；不可與病人交談以防哽塞（p56）","餵食後端坐最少半小時，或床頭調高不少於 60 度（p56）","哽噎、嘴唇及指甲發紫：鼓勵咳嗽，即時通知護士（p56）","依照言語治療師的飲食建議（p56）","先給病人喝水，再慢慢餵食；每口後檢查口腔確保已吞下（p58–59）","嗆咳時立即停止餵食，先讓病人休息，檢查口腔，情況穩定才再餵（p59）","餐後不可除去枱板讓病人單獨坐著（p59）","醫護支援人員只可以在護士指導下餵病人服食藥物（p57）"],"exam":["★ 核對病人手鈪及牌板（p60）","★ 鎖上大班椅檯板並確保椅轆已鎖上（p61）","★ 嗆咳時立即停止餵食、餵水，讓病人休息，檢查口腔，穩定才再餵（p62）","★ 每口後檢查口腔確保已吞下（p62）","★ 記錄進食情況於 Intake and Output Chart；嗆咳要報告上級（p62）","★ 依據餐單選擇正確的餐類；餐後不可除去檯板讓病人單獨坐著（p62）"],"terms":[["餵食份量","每次一茶匙，完全吞嚥後才餵下一匙","p56"],["餵食後","端坐最少半小時，或床頭不少於 60 度","p56"],["餵食時講嘢？","不可與病人交談，以防哽塞","p56"],["嗆咳時","立即停止，讓病人休息，檢查口腔，穩定才再餵","p59"],["餐後枱板","不可除去枱板讓病人單獨坐著","p59"]]},{"id":"2L","ch":"（二）起居照顧技巧","title":"整理床鋪","pages":"p64–69","points":["整理床鋪目的：整齊舒適、使新鮮空氣透入、可防褥瘡（p64）","鋪床姿勢：兩腳分開，勿彎腰，用大腿肌肉，避免扭轉身體（p64）","鋪上面床單時足部宜寬鬆，防足部受壓或足垂（p64）","拆床單不要抖動；清潔床單不要接觸地面；污穢床單不要放地上（p65）","先鋪床頭再鋪床尾，鋪好一側再鋪另一側（p65）","備用床（Closed Bed）：沒有病人佔用；應用床（Open Bed）：有病人佔用（p65–66）","面床單上端 8–12 吋向外摺；床角摺成 45°（p66）","病人不可離床時：協助側臥，將床單捲入病人背後，一邊一邊更換（p68–69）"],"terms":[["備用床 Closed Bed","床冚蓋全床；沒有病人佔用","p65"],["應用床 Open Bed","有病人佔用，例如收症床、病人離床外坐、請假回家、手術後床","p66"],["面床單向外摺","上端 8–12 吋","p66"],["床角摺法","45° 角","p66"],["拆床單","不要抖動床單","p65"]]},{"id":"3A","ch":"（三）病人護理技巧","title":"外科病人（手術前後）","pages":"p70–72","points":["手術分安排性及急症性；麻醉有全身（G.A.）、局部（L.A.）、脊髓（S.A.）、硬脊膜外腔（E.A.）（p70）","簽同意書前醫生要解釋手術名稱、原因、過程、風險及併發症（p70）","手術前一天：清潔腸道、剃毛（如需）、禁食（如 G.A.）、徹底洗澡及洗頭（p70）","學習深呼吸、咳嗽、放鬆及病人自控式止痛法（PCA）（p71）","手術日：除飾物、假牙、化妝；飾物除不下用膠布包好；排清大小便（p71）","醫護支援人員只可接送簡單小型手術（如局部麻醉）的術後病人（p71）","口咽人工氣道控制舌頭下墮，保持氣道暢通；成人 3 或 4 號，小童 2 或 3 號（p71）","回病房即時量血壓、體溫、脈搏、血含氧量，按醫囑每 15 分鐘至 1 小時觀察（p72）","仍需禁食的病人要飲水，只可用棉花棒沾水濕口（p72）"],"terms":[["G.A.","General Anaesthesia 全身麻醉","p70"],["L.A.","Local Anaesthesia 局部麻醉","p70"],["S.A.","Spinal Anaesthesia 脊髓麻醉","p70"],["E.A.","Epidural Anaesthesia 硬脊膜外腔麻醉","p70"],["PCA（止痛）","Patient Controlled Analgesia 病人自控式止痛法","p71"],["口咽人工氣道","控制舌頭下墮，保持氣道暢通","p71"],["禁食病人口渴","只可以用棉花棒沾水濕口","p72"]]},{"id":"3B","ch":"（三）病人護理技巧","title":"兒科病人","pages":"p73–78","points":["整理小兒床：上層被蓋不可高過小兒肩膊，以免窒息（p73）","換尿片：每塊濕棉花只用一次；女嬰由前向後抹；男嬰切勿將包皮朝後拉扯（p74）","女嬰尿片較厚部份向後移（p74）","嬰兒沐浴室溫 20°C–24°C；水溫約 37°C–40°C；先放冷水後放熱水，用手肘試水溫（p75）","清潔眼睛由眼頭向眼尾，每次一個棉球（p76）","洗頭時用大拇指和中指塞住兩耳；頭垢用橄欖油溶解（p76）","臍帶：保持清潔乾爽，尿片要令臍帶外露；用凍開水棉花棒抹乾淨臍帶底部（p77）","臍帶切忌用臍布包紮或洒臍粉，勿塗有色消毒藥水（p77）","瓶飼：奶咀流速每秒 1 滴為宜；奶溫 37°C–38°C，用手腕測試（p78）","餵奶中途及完畢都要掃風；餵後置右側臥（p78）"],"terms":[["小兒上層被蓋","不可高過小兒肩膊","p73"],["嬰兒沐浴室溫","20°C–24°C","p75"],["嬰兒沐浴水溫","約 37°C–40°C","p75"],["嬰兒清潔眼睛","由眼頭向眼尾，每次一個棉球","p76"],["臍帶護理","用凍開水沾濕棉花棒抹乾淨臍帶底部；尿片令臍帶外露","p77"],["奶咀流速","每秒流出 1 滴","p78"],["奶溫","37°C–38°C，以手腕皮膚測試","p78"],["掃風","餵飼中途及完畢各一次","p78"],["瓶飼後臥姿","右側臥","p78"]]},{"id":"3C","ch":"（三）病人護理技巧","title":"老化、白內障、便秘、膝關節炎","pages":"p79–85","points":["突然眼痛、眼紅、視力急劇衰退可能是青光眼；視力衰退配眼鏡糾正唔到可能是白內障（p79）","手腳（尤其一邊）突然失去感覺或無力可能是中風（p79）","持續便秘或肚瀉、大便出血或有黏液可能是腸癌（p79、p84）","在熟識的街道迷途可能是認知障礙症（p80）","長者短期記憶降低，但長期記憶仍能保持（p81）","退休及親友相繼去世是長者最大心理壓力（p81）","白內障：晶狀體變混濁；主要治療是手術切除；現多植入人工晶狀體（p82）","白內障術後多休息、防便秘、洗頭避免污水入眼（p83）","便秘成因：腸臟蠕動慢、飲水不足或缺纖維、心理因素、藥物（嗎啡類、鈣片、利尿藥）、疾病（p83）","高血壓者排便過份用力可誘發中風（p83）","退化性膝關節炎：膝痛尤其下樓梯、提重物時；過重者要減肥（p84–85）","關節內注射類固醇會令退化惡化，非不得已切勿採用（p84）"],"terms":[["青光眼徵狀","突然眼痛、眼紅及急劇視力衰退","p79"],["白內障","晶狀體逐漸混濁；主要治療是手術切除","p79、p82"],["前列腺增生（男）","小便不暢、尿後有剩餘感或滴尿","p79"],["長者記憶","短期記憶降低，長期記憶仍能保持","p81"],["便秘防治","每天六両或以上蔬菜、兩個水果；足夠流質；適量運動","p83"],["膝關節類固醇注射","會令退化惡化","p84"]]},{"id":"3D","ch":"（三）病人護理技巧","title":"柏金遜症、抑鬱症、認知障礙症","pages":"p86–94","points":["柏金遜症平均病發年齡 60 至 70 歲；與腦內多巴胺減少有關（p86）","柏金遜徵狀：震顫（初發多在一側上肢）、動作緩慢、關節如齒輪般僵硬、面部無表情（p86）","柏金遜藥物要長期服用，切勿自行停藥（p86）","護理時不要凡事代勞，否則自理能力退步更快（p87）","進食坐起、頭稍向前；太乾、太滑、太黏食物易哽塞（p87）","穿褲時應坐著；淋浴間比浴缸安全（p87–88）","長期臥床：至少每兩小時轉換姿勢（p89）","抑鬱症病徵持續兩星期或以上並影響日常生活（p90）","抑鬱症護理：協助定時服藥；拒絕服藥要了解原因並通知醫生（p91）","認知障礙症：65 歲或以上約百分之十；85 歲或以上每四名可能有一位（p91）","阿爾茲海默氏症最普遍，佔總數約三分之一至二分之一；近期記憶差，遠期記憶猶新（p91–92）","多次中風可引起多發性梗塞腦退化症（p92）","缺乏維生素 B12 等營養失調亦可引起（p92）","中期：性格改變、日夜顛倒；晚期：完全失去自我照顧能力（p92–93）","藥物：Ativan 鎮靜；Zoloft 抗抑鬱；Tacrine、Aricept 抗退化（p94）","緬懷活動、定向訓練等活動治療（p94）"],"terms":[["柏金遜症病發年齡","平均 60 至 70 歲","p86"],["多巴胺","柏金遜症與腦內多巴胺減少有關","p86"],["柏金遜關節","如齒輪般僵硬","p86"],["抑鬱症病徵時間","持續兩星期或以上","p90"],["阿爾茲海默氏症","最普遍的認知障礙症，約佔三分之一至二分之一","p91"],["多發性梗塞腦退化症","多次中風或血管梗塞引起","p92"],["Ativan","鎮靜藥，緩和激動情緒","p94"],["Zoloft","抗抑鬱藥（俗稱開心藥）","p94"],["Aricept／Tacrine","抗退化藥，治療輕度及中度阿爾茲海默氏症","p94"],["定向訓練","使病人認知自己處身的時、地及周圍的人","p94"]]},{"id":"3E","ch":"（三）病人護理技巧","title":"嘔吐及失眠病人","pages":"p95–97","points":["清醒病人嘔吐：扶坐或轉側，以免吸入嘔吐物；有假牙應即除去（p95）","昏迷病人嘔吐：立即轉側臥；用鉗子鉗紗布清除口內嘔吐物；發紺要通知護士用抽痰器（p96）","嘔吐物鮮紅色：可能急性食道或胃出血；咖啡渣樣：腸胃出血；黃綠色：胃液混膽汁（p96）","嘔吐物有糞便味可能是腸閉塞（p96）","睡眠需要量與年齡成反比（p97）","促進睡眠：睡前背部護理、配合睡眠習慣、關燈調室溫、黃昏後避免咖啡因、白天多活動、夜間工作集中進行（p97）"],"terms":[["咖啡渣樣嘔吐物","可能是腸胃出血","p96"],["鮮紅色嘔吐物","可能是急性食道或胃部出血","p96"],["黃綠色嘔吐物","胃液混和膽汁","p96"],["糞便味嘔吐物","可能是腸閉塞","p96"],["睡眠需要量","與年齡成反比","p97"]]},{"id":"3F","ch":"（三）病人護理技巧","title":"體位擺放及扶抱轉移","pages":"p98–108","points":["左側臥方便肛門或直腸檢查、直腸或會陰治療（p98）","半仰臥：床頭 30 度；否硫氏臥式：45 度，用於呼吸困難或有引流者；端坐式：90 度（p98–99）","俯臥：方便背部或臀部傷口料理，減輕腹痛（p99）","脊骨傷患／手術後病人不適合扶行；避免拖行病人（p99）","扶抱：屈膝坐馬、背部挺直、用雙腳發力、手肘緊靠身體、靠近病人、用碎步轉身（p99）","兩人搬運由一人數口令「一、二、三」（p99）","扶病人坐起應扶肩膊，不是頸部（p101）","轉輪椅：調床高至足跟著地，輪椅上鎖、移開腳踏，扣上安全帶（p102）","雙人前後式：發號令者通常是站在病人後方的護理員（p103）","由護士選擇抬動方法並由護士發號施令（p106）","拐杖用較強健那邊的手拿；步行：叉 → 弱腳 → 好腳（p107）","樓梯口訣「好上，壞落」：上樓好腳先上，落樓弱腳先落（p107）","上樓：護理人員站病人弱肢後方；落樓：站弱肢前方（p107）"],"terms":[["半仰臥式","床頭 30 度","p98"],["否硫氏臥式","床頭 45 度；呼吸困難或有引流者","p98"],["端坐式","床頭 90 度；呼吸困難或胸腔手術後","p99"],["左側臥用途","肛門或直腸檢查、直腸或會陰治療","p98"],["扶病人坐起","扶肩膊，不是頸部","p101"],["樓梯口訣","好上，壞落","p107"],["拐杖用邊隻手拿","較強健那邊的手","p107"],["平路步行次序","叉 → 弱腳 → 好腳","p107"],["上樓時護理員位置","病人弱肢後方","p107"],["落樓時護理員位置","病人弱肢前方","p107"]]},{"id":"3G","ch":"（三）病人護理技巧","title":"輔助器材及約束物品","pages":"p109–117","points":["滑動板過床：鎖好床轆，滑動板放病人背後最少一半（p109）","輪椅：停止、移動、起身前先拉好制動器；安全帶按體型調鬆緊（p109–110）","落斜坡用雙手推輪椅；提起輪椅要握座椅支架，不可握扶手或腳踏（p110）","防反桿防止輪椅往後翻（p110）","護理人員應站於病人麻痺側、人多側、車道側（p111）","助行器高度：手肘彎曲 20° 至 30°，手腕至地面距離（p111）","步行前讓病人站立片刻冇頭暈才起步；轉彎用好腳做重心（p111）","約束物品要盡量避免，基於防傷害、防跌倒、防拔喉才使用（p113）","約束衣用 V 領或低領；過寬可退上胸部或勒頸（p114）","臥床約束：索帶綁在床的兩邊，勿繫在床欄上（p115）","火警時應迅速解除約束；絕對不可作懲罰或方便員工（p115）","不良反應：壓瘡及感染增加、纏頸或胸部受壓窒息、驚慌憤怒無助（p116）","觀察頻率：Cat. 1 至少每半小時；Cat. 2 至少每小時；Cat. 3 每 4 小時（p117）"],"terms":[["滑動板","過床時放病人背後最少一半","p109"],["防反桿","防止輪椅往後翻","p110"],["落斜坡推輪椅","用雙手推，以免拐彎轉向一邊","p110"],["提起輪椅","緊握座椅支架，不可握扶手或腳踏","p110"],["助行器高度","手肘彎曲 20° 至 30°","p111"],["護理員站位","病人麻痺側、人多側、車道側","p111"],["約束衣領口","V 領或低領，減低勒頸機會","p114"],["臥床約束索帶","綁在床的兩邊，勿繫在床欄","p115"],["火警時約束物品","應迅速解除","p115"],["Cat. 1 約束觀察","至少每半小時","p117"]]},{"id":"3H","ch":"（三）病人護理技巧","title":"皮膚及壓瘡","pages":"p118–130","points":["皮膚功能：保護、感覺、調節體溫、激活維生素 D、排泄（p118）","壓瘡：局部皮膚受壓，血液循環受阻，細胞缺乏養份而壞死（p118）","易生壓瘡：長期臥床、年長癱瘓、失禁、嚴重腹瀉、過肥或過瘦、浮腫、血液循環不良（p118–119）","外在因素：壓力、磨擦、削力（壓力及磨擦的綜合體）、潮濕；內在因素：營養不良（尤其蛋白質）、貧血老化、循環慢、疾病（p119）","第 1 級：發紅發腫，移開壓力 30 分鐘後仍一樣；第 2 級：傷到真皮；第 3 級：深至皮下組織或脂肪；第 4 級：達肌膜、肌肉甚至骨頭（p119–120）","平躺壓點：腳跟、骶骨、手肘、肩胛骨、頭之後面；側臥：踝部、膝內外側、大粗隆、肩峯突、耳朵（p120）","預防：經常轉換體位；避免床頭提高過 30°；用減壓輔助器；便盆用後即移開（p121）","容易沾濕部位按護士指示塗鋅氧膏（p121）","壓點護理：檢查耳翼、肩膊、手肘外側、股骨大粗隆、膝內外側、足踝及足跟（p124）","側臥用三個枕頭：胸前、背部、膝間至腳跟（p124）"],"exam":["★ 轉身準備（左側臥：右足放左足上）（p127）","★ 先指導協助員扶穩病人，然後檢查並口述壓點（p127）","★ 穿褲先穿患側，然後穿健側（p128）","★ 使病人側臥至預定的正確方向（p128）","★ 記錄於 Patient Turning Chart 並簽署；臀部有紅要報告上級（p129）"],"terms":[["壓瘡第 1 級","皮膚發紅發腫，移開壓力 30 分鐘後仍一樣","p119"],["壓瘡第 2 級","皮膚破損／水泡，已傷到真皮","p119"],["壓瘡第 3 級","全層皮膚受傷，深至皮下組織或脂肪","p120"],["壓瘡第 4 級","組織壞死，達肌膜、肌肉甚至骨頭","p120"],["削力","壓力及磨擦的綜合體","p119"],["預防壓瘡床頭","避免將床頭提高過 30°","p121"],["鋅氧膏","Zinc Oxide Cream；防濕軟膏","p121"],["LL / RL","Left Lateral 左側臥 / Right Lateral 右側臥","p130"],["S / P","Supine 仰臥 / Prone 俯臥","p130"]]},{"id":"3I","ch":"（三）病人護理技巧","title":"疥瘡","pages":"p131–132、p144","points":["疥瘡俗稱「癩」，由疥蟲引起；接觸性傳染，與不良衞生及擠迫有關（p131）","診斷：刮皮屑（p131）","痕癢晚上就寢後更甚；紅斑在皺摺處，面部及頭皮少受影響（p131）","潛伏期：從未患過 2-6 星期；曾感染過 1-4 天（p131）","25% BBE 由頸部以下塗到腳趾，12 小時後再塗一次（無需沐浴），再過 12 小時沐浴（p131、p144）","乳劑只適宜用兩次；洗手後要重新塗雙手（p144）","衣物 60°C 以上熱水煮不少於十分鐘（p132）","床褥等烈日曝曬六至八小時；難洗物品密封膠袋最少 7 天（p132）","親密接觸者即使冇徵狀亦應一併治療（p132） function prep(){const z=S.quiz;z.ans=null;const q=byId[z.ids[z.i]];z.order=shuffle([0,1,2,3]);S.flagOpen=false}
function nextBatch(){const pool=Q.filter(q=>S.picked.includes(secOf(q))&&inLv(q)).map(q=>q.id);
 let fresh=pool.filter(id=>!S.seen.includes(id));let note=false;
 if(fresh.length===0){S.seen=S.seen.filter(id=>!pool.includes(id));store.set('seen',S.seen);fresh=pool;note=true}
 let pick=shuffle(fresh).slice(0,BATCH);
 if(pick.length<BATCH&&pool.length>pick.length){pick=pick.concat(shuffle(pool.filter(id=>!pick.includes(id))).slice(0,BATCH-pick.length))}
 startQuiz(pick,'batch')}

  ${z.mode==='batch'?`<button class="btn" data-act="more">刷新下一批題目（${esc(S.level)}）</button><button class="btn ghost" data-act="swap-level">轉做「${S.level==='簡單'?'正常':'簡單'}」程度</button>`:''}
  <button class="btn ghost" data-act="quit">${z.mode==='batch'?'返回揀範圍':'返回錯題本'}</button>`;return}
 const q=byId[z.ids[z.i]],ai=L.indexOf(q.answer),a=z.ans,fl=S.flags[q.id];
 app.innerHTML=`<div class="row"><span class="mute sm">第 ${z.i+1} / ${z.ids.length} 題${z.mode==='wrong'?'（錯題）':`｜${esc(S.level)}程度`}</span><button class="flag" data-act="quit">結束</button></div><div class="bar"><i style="width:${z.i/z.ids.length*100}%"></i></div>
 <p class="mute sm" style="margin-bottom:2px">${esc(q.chapter.replace('｜',' ｜ '))}<span class="pill">${esc(q.level)}</span></p><p style="font-weight:600;font-size:1.08rem;margin-top:2px">${esc(q.question)}</p>
 ${z.order.map((oi,pos)=>{const k=L[oi];let cls='';let why='';if(a!==null){if(oi===ai)cls='ok';else if(oi===a)cls='bad';why=oi===ai?'':(q.explanation.wrong[k]||'')}
  return `<button class="opt ${cls}" data-act="ans" data-o="${oi}" ${a!==null?'disabled':''}><span class="l">${L[pos]}</span><span>${esc(q.options[oi])}${why?`<span class="why">✗ ${esc(why)}</span>`:''}</span></button>`}).join('')}
 ${a!==null?`<div class="res ${a===ai?'ok':'bad'}"><strong>${a===ai?'✓ 答啱':'✗ 答錯'}</strong>${esc(q.explanation.correct)}<div class="mute sm" style="margin-top:6px">出處：${esc(q.chapter.replace('｜',' ｜ '))}，${esc(q.page)}</div></div>
 <button class="btn" data-act="next">${z.i+1<z.ids.length?'下一題':'睇結果'}</button>`:''}
 ${flagBlock(q.id,fl)}`}
function flagBlock(id,fl){return `<div><button class="flag ${fl?'on':''}" data-act="flag" data-id="${id}">${fl?'已標記（撳嚟改）':'呢題有問題'}</button>${S.flagOpen===id?`<div class="card"><label class="sm" for="fn">有咩問題？（可以留空）</label><textarea id="fn" placeholder="例如：第二個選項都啱">${esc(fl?fl.note:'')}</textarea><button class="btn small" data-act="flag-save" data-id="${id}">儲存標記</button>${fl?`<button class="btn ghost small" data-act="flag-del" data-id="${id}">取消標記</button>`:''}</div>`:''}</div>`}

document.addEventListener('change',e=>{if(e.target.id==='fcs'){S.fcSec=e.target.value;S.fc=null;render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render();toTop();return}
 const act=b.dataset.act,z=S.quiz;if(!act)return;
 switch(act){
 case'open':S.sec=b.dataset.id;render();toTop();break;
 case'back':S.sec=null;render();toTop();break;
 case'practice-sec':S.picked=[b.dataset.sec];store.set('picked',S.picked);S.quiz=null;S.tab='quiz';render();toTop();break;
 case'cards-sec':S.fcSec=b.dataset.sec;S.fc=null;S.tab='cards';render();toTop();break;
 case'flip':S.fc.flip=!S.fc.flip;b.classList.toggle('flip');break;
 case'fc-next':S.fc.i++;S.fc.flip=false;render();break;
 case'fc-prev':S.fc.i--;S.fc.flip=false;render();break;
 case'fc-shuffle':S.fc=null;render();break;
 case'pick':{const s=b.dataset.sec;S.picked=S.picked.includes(s)?S.picked.filter(x=>x!==s):[...S.picked,s];store.set('picked',S.picked);render();break}
 case'swap-level':S.level=S.level==='簡單'?'正常':'簡單';store.set('level',S.level);nextBatch();break;
 case'level':S.level=b.dataset.lv;store.set('level',S.level);render();break;
 case'pick-all':S.picked=C.map(c=>c.title);store.set('picked',S.picked);render();break;
 case'pick-none':S.picked=[];store.set('picked',S.picked);render();break;
 case'start':case'more':nextBatch();break;
 case'ans':{if(z.ans!==null)break;const q=byId[z.ids[z.i]],oi=+b.dataset.o,ok=oi===L.indexOf(q.answer);z.ans=oi;if(ok)z.score++;z.results.push({id:q.id,ok});
  if(z.mode==='batch'&&!S.seen.includes(q.id)){S.seen.push(q.id);store.set('seen',S.seen)}
  if(ok){if(z.mode==='wrong')delete S.wrong[q.id]}else S.wrong[q.id]=(S.wrong[q.id]||0)+1;store.set('wrong',S.wrong);render();break}
 case'next':z.i++;if(z.i<z.ids.length)prep();render();toTop();break;
 case'quit':{const m=z&&z.mode;S.quiz=null;S.tab=m==='wrong'?'wrong':'quiz';render();toTop();break}
 case'redo':startQuiz(shuffle(Object.keys(S.wrong).filter(i=>byId[i])),'wrong');break;
 case'clear-wrong':if(confirm('確定清空錯題本？')){S.wrong={};store.set('wrong',S.wrong);render()}break;
 case'flag':S.flagOpen=S.flagOpen===b.dataset.id?false:b.dataset.id;render();break;
 case'flag-save':S.flags[b.dataset.id]={note:(document.getElementById('fn')||{}).value||'',t:Date.now()};store.set('flags',S.flags);S.flagOpen=false;render();break;
 case'flag-del':delete S.flags[b.dataset.id];store.set('flags',S.flags);S.flagOpen=false;render();break;
 case'copy':{const t=flagText(),m=document.getElementById('msg');try{await navigator.clipboard.writeText(t);m.textContent='已複製。'}catch(err){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let k=false;try{k=document.execCommand('copy')}catch(x){}a.remove();m.textContent=k?'已複製。':'複製唔到，請用「下載文字檔」。'}break}
 case'dl':{const u=URL.createObjectURL(new Blob([flagText()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='PCA正式教材_有問題題目.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);break}
 }});

/* ===== 填表練習 ===== */
const rnd=a=>a[Math.random()*a.length|0];
const ionorm=s=>String(s||'').normalize('NFKC').toUpperCase().replace(/1[⁄\/]2/g,'½').replace(/3[⁄\/]4/g,'¾').replace(/0?\.5(?=\s*BOWL)/g,'½').replace(/[×✕✖*]/g,'X').replace(/COLOR/g,'COLOUR').replace(/BOWLS/g,'BOWL').replace(/[^A-Z0-9½¾]/g,'').replace(/X/g,'');
const ioTime=s=>{let d=String(s||'').normalize('NFKC').replace(/\D/g,'');return d.length===3?'0'+d:d};
const bowlNum=s=>{s=String(s||'').normalize('NFKC').replace(/1⁄2|1\/2/g,' .5').replace(/3⁄4|3\/4/g,' .75').replace(/1⁄4|1\/4/g,' .25').replace(/[^0-9. ]/g,' ').trim();if(!s)return null;return s.split(/\s+/).reduce((a,x)=>a+Number(x),0)};
const bowlTxt=n=>{const w=Math.floor(n),f={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[n-w];return (w||!f?w:'')+f};
const zhTime=t=>{let[h,m]=t.split(':').map(Number);const p=h<12?'上午':h===12?'中午':'下午';const H='零一二三四五六七八九十'.split('').concat(['十一','十二'])[h>12?h-12:h];return p+H+'時'+(m?'三十分':'正')};
const COL=[['黃色','Y'],['啡色','B'],['綠色','G']],QUA=[['硬','H'],['軟','S'],['爛','L'],['水狀','W']],QTY=[['大量','L'],['中量','M'],['小量','S']],SUF=[['',''],['',''],['含黏液',' with Mucus'],['含血',' with Blood']];
const LIQ=[['清水','H2O',['Water']],['奶','Milk'],['湯','Soup'],['果汁','Juice'],['粥水','RH2O'],['麥皮','Oatmeal']],DIET=[['糊餐','Puree'],['胃餐','Gastric Diet'],['粥','Congee'],['飯','Rice'],['麵','Noodles'],['免治餐','Minced Diet']],BOWL=[['一碗',1],['大半碗',.75],['半碗',.5]];
const VOM=[['黃色水狀胃液','Y.F.'],['綠色水狀胃液','G.F.'],['啡色（咖啡渣樣）胃液','C.G.F.'],['未消化食物','U.D. Food']];

const fld=(k,l,ph)=>{const z=S.io,c=z.checked&&z.checked.find(x=>x.k===k);return `<label class="ff"><span>${esc(l)}</span><input data-f="${k}" value="${esc(z.draft[k]||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${z.checked?'disabled':''} class="${c?(c.ok?'ok':'bad'):''}"></label>`};
function ptCard(p){return `<div class="card sm"><strong>病人資料</strong><br>姓名：${esc(p.zh)}　性別：${p.sex==='F'?'女':'男'}　年齡：${p.age}<br>身份証編號：${esc(p.id)}　醫院號碼：${p.hn}<br>病房：${p.ward}　床號：${p.bed}　部門：${p.dept}　Team ${p.team}<br>日期：${p.date}</div>`}
function chartTable(c,upto){let h='';c.rows.slice(0,upto).forEach(r=>{const e=expectRow(r),n=Math.max(1,r.in.length);for(let i=0;i<n;i++){const x=r.in[i];h+=`<tr><td>${i===0&&r.in.length?r.t:''}</td><td></td><td></td><td></td><td></td><td></td><td>${x?esc(x.name):''}</td><td>${x?esc(x.amt):''}</td>${i===0&&r.out.length?`<td>${r.t}</td><td>${e.v?esc(e.v.nat):''}</td><td>${e.v?esc(e.v.amt):''}</td><td>${e.u?esc(e.u.ans):''}</td><td>${e.f?esc(e.f.ans):''}</td><td></td>`:'<td></td><td></td><td></td><td></td><td></td><td></td>'}</tr>`}});
 return `<div class="tw" tabindex="0" aria-label="出入量記錄表，可左右掃"><table><thead><tr><th rowspan="2">Date/ Time</th><th colspan="7">INTAKE</th><th colspan="6">OUTPUT</th></tr><tr><th>IV Fluids</th><th>Amount</th><th>Additive/ Dosage</th><th>Given by</th><th>Checked by</th><th>By Mouth/ <s>Tube Feed</s></th><th>Amount</th><th>Time</th><th>Vomit/ <s>Aspiration</s> Nature</th><th>Amount</th><th>Urine</th><th>Faeces</th><th>Drainage</th></tr></thead><tbody><tr><td>${c.pt.date.replace(/-/g,'/')}</td>${'<td></td>'.repeat(13)}</tr>${h}</tbody></table></div>`}
const cheat=open=>`<details class="card sm" ${open?'open':''}><summary><strong>縮寫表（p137、p140–141）</strong></summary>
<p><strong>大便</strong>＝顏色＋質＋S（Stool）＋（量）x 次數<br>顏色：Y 黃、B 啡、G 綠；Tarry 柏油便<br>質：H 硬、S 軟、L 爛、W 水狀<br>量：L 大量、M 中量、S 小量<br>含黏液 with Mucus；含血 with Blood；冇大便 BNO<br>例：中量啡色軟大便一次＝B.S.S.(M) x1</p>
<p><strong>小便</strong>：__ml；茶色 (tea colour)<br>W.N. 換尿片；PU 如廁；N.P.U. 冇排小便<br>B.E. 已清倒尿袋；B.N.E. 未清倒，下次要減回前量</p>
<p><strong>嘔吐</strong>：Y.F. 黃色、G.F. 綠色、C.G.F. 咖啡渣樣、U.D. Food 未消化食物<br>黃綠色胃液：p139 範例寫 Y.G.F.<br>量唔到：縮寫＋（量）x 次數；量到：縮寫＋ml</p>
<p><strong>入口</strong>：H2O 清水、RH2O 粥水、Soup 湯、Juice 果汁、Milk 奶、Oatmeal 麥皮、Congee 粥、Rice 飯、Noodles 麵、Puree 糊餐、Gastric Diet 胃餐、Minced Diet 免治餐、Full Diet 正餐<br>1 bowl 一碗、3/4 bowl 大半碗、1/2 bowl 半碗<br>N.P.O. 不准飲食；Refused Diet 拒絕進食</p>
<p class="mute">教材註明：各醫院嘅縮寫可能有所修改。</p></details>`;
function vForm(){const z=S.io;
 if(!z){const sv=store.get('io',null);
  app.innerHTML=`<h1>身體的液體出入量紀錄練習</h1><p class="mute sm">出入量記錄表 Intake and Output Chart（教材 p136–141）。按教材要求用英文填寫。</p>
  <h2>① 縮寫練習（10 題）</h2><p class="mute sm">睇中文，寫返記錄表上嘅英文縮寫。每次題目都唔同。</p><div class="lv"><button data-io="drill" data-m="簡單">簡單<small>四揀一</small></button><button data-io="drill" data-m="正常">正常<small>自己打字</small></button></div>
  <h2>② 填整張表</h2><p class="mute sm">逐個時間填，每步即時對答案，最後計總出入量。</p>${sv?`<button class="btn" data-io="resume">繼續上次未完成嘅表</button>`:''}
  <button class="link" data-io="p138"><span>教材原題</span><small>p138，答案 p139</small></button><button class="link" data-io="rand"><span>隨機新題</span><small>每次都唔同</small></button>
  <div class="hw"><span class="tag">功課</span><h2>功課 #1</h2><p class="mute sm">病人：陳華（Chan Wah）｜8D 病房 10 號床｜由凌晨二時到晚上八時，共 14 個時間點</p><button class="btn" data-io="hw1">開始做功課 #1（網上填）</button><button class="btn ghost" data-io="hwdemo">睇示範答案（真表格樣）</button></div>
  <h2>填表重點</h2><div class="card sm"><ul><li>時間用 24 小時制，例如下午一時寫 13:00</li><li>每次飲食、排便、嘔吐後即時記錄（p136）</li><li>人工哺飼及靜脈注射通常由護士負責記錄（p136）</li><li>每日總結算一次出入量；異常要立即通知主理護士（p136）</li></ul></div>${cheat(false)}`;return}
 if(z.k==='hwdemo'){vHwDemo();return}
 if(z.k==='drill'){
  if(z.i>=z.items.length){app.innerHTML=`<h1>縮寫練習完成</h1><div class="card" style="text-align:center"><div class="score">${z.score} / ${z.items.length}</div></div>${z.items.filter(x=>!x.ok).map(x=>`<div class="card sm">${esc(x.zh)}<br><strong>${esc(x.ans)}</strong> <span class="mute">${x.p}</span></div>`).join('')}<button class="btn" data-io="drill" data-m="${z.m}">再做 10 題（${z.m}）</button><button class="btn ghost" data-io="exit">返回出入量紀錄練習</button>`;return}
  const it=z.items[z.i],a=z.ans!==null,ok=a&&ioOk(it,z.ans);
  app.innerHTML=`<div class="row"><span class="mute sm">第 ${z.i+1} / ${z.items.length} 題｜${z.m}</span><button class="flag" data-io="exit">結束</button></div><div class="bar"><i style="width:${z.i*10}%"></i></div><p class="mute sm" style="margin-bottom:2px">${it.cat}</p><p style="font-weight:600;font-size:1.15rem;margin-top:2px">${esc(it.zh)}</p>
  ${z.m==='簡單'?it.opts.map((o,i)=>`<button class="opt ${a?(ioOk(it,o)?'ok':o===z.ans?'bad':''):''}" data-io="pick" data-v="${esc(o)}" ${a?'disabled':''}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`).join(''):`<form data-ioform="type"><label class="ff"><span>記錄表上應寫</span><input id="dv" value="${a?esc(z.ans):''}" ${a?'disabled':''} class="${a?(ok?'ok':'bad'):''}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>${a?'':'<button class="btn">對答案</button>'}</form><p class="mute sm">大細楷、空格、點同括號唔計分。</p>`}
  ${a?`<div class="res ${ok?'ok':'bad'}"><strong>${ok?'✓ 答啱':'✗ 答錯'}</strong>答案：${esc(it.ans)}<br>${esc(it.why)}<div class="mute sm">出處：印刷 ${it.p}</div></div><button class="btn" data-io="dnext">${z.i+1<z.items.length?'下一題':'睇結果'}</button>`:''}${z.m==='正常'&&!a?cheat(false):''}`;return}
 const c=z.c,n=c.rows.length,ck=z.checked;
 if(z.step>n){const t=totals(c);app.innerHTML=`<h1>完成：${esc(c.title)}</h1><div class="card" style="text-align:center"><div class="score">${z.got} / ${z.total}</div><p class="mute">填啱嘅欄位</p></div><h2>完整答案（可左右掃）</h2>${ptCard(c.pt)}${chartTable(c,n)}<div class="card sm"><strong>Total Input</strong><br>${esc(t.inT)}<br><strong>Total Output</strong><br>${esc(t.outT)}</div><p class="mute sm">有量唔到嘅項目（例如尿片、大便），教材 p139 範例冇填 Balance，所以唔使計。</p><button class="btn" data-io="rand">再做一張隨機新題</button><button class="btn ghost" data-io="exit">返回出入量紀錄練習</button>`;return}
 const fb=ck?`<div class="res ${ck.every(x=>x.ok)?'ok':'bad'}"><strong>${ck.every(x=>x.ok)?'✓ 全部填啱':`填啱 ${ck.filter(x=>x.ok).length} / ${ck.length}`}</strong>${ck.map(x=>`${x.ok?'✓':'✗'} ${esc(x.label)}：${esc(x.ans)}`).join('<br>')}</div><button class="btn" data-io="cnext">${z.step<n?'下一步':'睇完整表格'}</button>`:'<button class="btn" data-io="check">對答案</button>';
 let body;
 if(z.step===-1)body=`<h1>先填表頭同日期</h1>${ptCard(c.pt)}<div class="fg">${HF.map(h=>fld(h[0],h[1])).join('')}</div><p class="mute sm">Date 寫喺表格左邊第一格（Date/Time 欄），下面先寫時間。</p>`;
 else if(z.step<n){const r=c.rows[z.step];body=`<div class="card"><strong>${zhTime(r.t)}</strong><br><span class="mute sm">入口</span> ${r.in.length?r.in.map(x=>esc(x.zh)).join('、'):'—'}<br><span class="mute sm">出口</span> ${r.out.length?r.out.map(x=>esc(x.zh)).join('、'):'—'}</div><p class="mute sm">冇資料嘅欄留空。</p>
  <h3>INTAKE 入口</h3>${fld('ti','Time')}<div class="fg">${[0,1,2].map(i=>fld('n'+i,'By Mouth')+fld('a'+i,'Amount')).join('')}</div>
  <h3>OUTPUT 出口</h3>${fld('to','Time')}<div class="fg">${fld('vn','Vomit：Nature')}${fld('va','Vomit：Amount')}</div>${fld('ur','Urine')}${fld('fa','Faeces')}`}
 else body=`<h1>計全日總出入量</h1>${chartTable(c,n)}<p class="mute sm">表格可以左右掃。</p><div class="fg">${fld('tin','入口總量（ml）')}${fld('tb','餐類總碗數')}${fld('tout','出口總量（ml）')}${fld('tbo','大便總次數 B.O.')}</div>`;
 app.innerHTML=`<div class="row"><span class="mute sm">${esc(c.title)}｜${z.step+2} / ${n+2} 步</span><button class="flag" data-io="exit">離開（會儲存）</button></div><div class="bar"><i style="width:${(z.step+1)/(n+2)*100}%"></i></div>${body}${fb}${ck?'':cheat(false)}`}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k&&S.io&&S.io.draft){S.io.draft[k]=e.target.value;saveIo()}});
function drillAns(v){const z=S.io,it=z.items[z.i];if(z.ans!==null||!v.trim())return;z.ans=v;it.ok=ioOk(it,v);if(it.ok)z.score++;render()}
document.addEventListener('submit',e=>{if(e.target.dataset.ioform){e.preventDefault();drillAns(document.getElementById('dv').value)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-io]');if(!b)return;const z=S.io;let top=true;
 switch(b.dataset.io){
 case'drill':{const m=b.dataset.m;newDrill();S.io.m=m;break}
 case'p138':case'rand':case'hw1':if(store.get('io',null)&&!(z&&z.step>z.c?.rows.length)&&!confirm('開新一張表會取代未完成嗰張，確定？'))return;newChart(b.dataset.io==='p138'?P138:b.dataset.io==='hw1'?HW1():randCase());break;
 case'hwdemo':S.io={k:'hwdemo',c:HW1(),big:false};break;
 case'hwbig':z.big=!z.big;render();return;
 case'resume':S.io=store.get('io',null);break;
 case'exit':if(z&&z.k==='chart'&&z.step<=z.c.rows.length)saveIo();S.io=null;break;
 case'pick':drillAns(b.dataset.v);return;
 case'dnext':z.i++;z.ans=null;break;
 case'check':checkStep();top=false;break;
 case'cnext':z.step++;z.draft={};z.checked=null;if(z.step>z.c.rows.length)store.set('io',null);else saveIo();break}
 render();if(top)toTop()});
render();
</script>
